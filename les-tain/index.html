function isNight(){return S.hour>=21||S.hour<6}
function timeName(){if(S.hour>=5&&S.hour<11)return '🌅 Утро';if(S.hour>=11&&S.hour<17)return '☀️ День';if(S.hour>=17&&S.hour<21)return '🌇 Вечер';return '🌙 Ночь'}
function newWeather(){
  var w=['sun','sun','rain','rain','fog','snow','storm'];
  S.weather=pick(w);
}
function advanceHour(n){
  S.hour+=n||1;
  S.mana=Math.min(maxMana(),(S.mana||0)+(n||1));
  while(S.hour>=24){S.hour-=24;S.day++;newWeather();log('🌅 День '+S.day+'. Погода: '+WEATHERS[S.weather].e+' '+WEATHERS[S.weather].n)}
}
function energyCost(loc){
  var c=loc.cost;
  if(S.tools.boots)c-=2;
  if(S.weather==='storm')c+=5;
  return Math.max(4,c);
}
function regenEnergy(){
  if(!S.lastSeen)return;
  var mins=Math.floor((Date.now()-S.lastSeen)/60000);
  if(mins<3)return;
  var gain=Math.floor(mins/3)+S.camp.fire*5;
  gain=Math.min(gain,maxEnergy()-S.energy);
  if(gain>0){S.energy+=gain;log('⚡ Отдохнул: +'+gain+' энергии')}
}

function renderTabs(){
  $('tabs').innerHTML=TABS.map(function(t){

  }).join('');
}
function renderStats(){
  $('dayLine').textContent='🌅 День '+S.day+' • '+WEATHERS[S.weather].e+' '+WEATHERS[S.weather].n+' • '+timeName()+' ('+S.hour+':00)';
  $('stCoins').textContent=fmt(S.coins);
  $('stCrys').textContent=S.crys;
  $('stLvl').textContent=S.level;
  $('stEnergy').textContent=S.energy;
  $('stEnergyMax').textContent=maxEnergy();
  var items=0;for(var k in S.inv)items+=S.inv[k];
  $('stItems').textContent=items;
  $('stMana').textContent=S.mana+'/'+maxMana();
  var need=xpNeed(S.level);
  $('xpFill').style.width=Math.min(100,Math.round(S.xp/need*100))+'%';
}

  regenEnergy();

function resetDaily(){
  if(S.questsDate===todayStr())return;
  S.questsDate=todayStr();
  S.quests={};
}
function doExplore(loc,mode){
  var cost=mode==='animal'?15:mode==='secret'?20:energyCost(loc);
  if(S.energy<cost){toast('⚡ Не хватает энергии! Подожди немного или улучши лагерь');return}
  S.energy-=cost;
  S.explores++;S.quests.dq1=(S.quests.dq1||0)+1;
  advanceHour(1);
  resetDaily();
  // магия: яйца питомцев
  var eggCh=S.buffs.luck?0.08:0.04;
  if(chance(eggCh)){var eggId=rollEgg();S.eggs[eggId]=(S.eggs[eggId]||0)+1;log('🥚 Ты нашёл магическое яйцо! Загляни в 🐾 Питомцы — там его можно вылупить.');toast('🥚 Магическое яйцо! Загляни к питомцам!')}
  // расход баффов зелий
  ['luck','friend','treasure','invis','portal'].forEach(function(b){if(S.buffs[b])S.buffs[b]--});
  if(mode==='animal'){startEncounter(loc);return}
  if(mode==='secret'){doSecret(loc);return}
  // случайное событие
  if(chance(0.09)){if(rollEvent(loc))return}
  // магическое событие
  if(chance(0.05)){if(magicEvent(loc))return}
  var roll=Math.random();
  var animalChance=S.camp.pet==='owl'&&isNight()?0.35:0.25;
  if(roll<animalChance){startEncounter(loc);return}
  if(roll<0.8){findItem(loc);return}
  var noth=pick(['🍂 Только шорох листвы… Ничего не нашлось.','🌫️ Лес молчит. Попробуй ещё раз.','🐾 Следы ведут в никуда. Пусто.']);
  log(noth);toast(noth);save();render();
}
function findItem(loc){
  var pool=loc.items.slice();
  if(S.weather==='rain')pool.push(['mushroom',3]);
  if(S.weather==='snow')pool.push(['shard',2]);
  var total=0;pool.forEach(function(p){total+=p[1]});
  var r=Math.random()*total,it=pool[0][0];
  for(var i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0){it=pool[i][0];break}}
  // компас: шанс на редкую находку
  if(S.tools.compass&&chance(0.15))it=pick(['shard','goldmush','key']);
  var n=1+(S.tools.bag?1:0);
  addItem(it,n);
  S.quests.dq2=(S.quests.dq2||0)+n;
  addXp(5*n);
  var msg='Нашёл: '+ITEMS[it].e+' '+ITEMS[it].n+(n>1?' ×'+n:'')+'!';
  log('🔍 '+loc.n+': '+msg);
  toast(msg);
  // магические ингредиенты
  var ingCh=S.buffs.luck?0.45:0.25;
  if(chance(ingCh)){var ing=pickIng(loc);if(ing){addIng(ing,1);log('✨ Магический ингредиент: '+ING[ing].e+' '+ING[ing].n);toast('✨ +'+ING[ing].e+' '+ING[ing].n+'!')}}
  // питомец находит что-то
  var _op2=Object.keys(S.pets2||{});
  if(_op2.length&&chance(0.12)){var pid=pick(_op2);var ing2=pickIng(loc);if(ing2){addIng(ing2,1);var pt=S.pets2[pid];log('🐾 '+(pt.name||PETS2[pid].n)+' нашёл: '+ING[ing2].e+' '+ING[ing2].n+'!');toast('🐾 '+(pt.name||PETS2[pid].n)+' нашёл '+ING[ing2].e+'!')}}
  save();render();
}
function doSecret(loc){
  var bonus=(S.tools.lantern?0.1:0)+(S.weather==='fog'?0.1:0)+(S.tools.compass?0.1:0);
  if(S.buffs.treasure){bonus+=0.3;S.buffs.treasure--}
  if(S.buffs.clair){bonus=1;S.buffs.clair=0}
  if(!chance(0.35+bonus)){
    log('🗝️ Тайн не нашлось… Попробуй в туман или с фонарём.');
    toast('🗝️ Пока пусто… Попробуй ещё раз!');
    save();render();return;
  }
  S.secrets++;
  var sid=loc.secret.item;
  var already=(ITEMS[sid]&&sid.indexOf('artifact')===0&&S.artifacts[sid])||(sid.indexOf('note')===0&&S.inv[sid]);
  if(already){
    addItem('shard',2);addXp(30);
    log('🗝️ '+loc.secret.txt+' Но здесь уже было найдено — зато нашлись осколки кристалла!');
    toast('🔮 Нашёл осколки кристалла ×2!');
  }else{
    if(sid.indexOf('artifact')===0)S.artifacts[sid]=true;
    addItem(sid,1);addXp(50);
    log('🗝️ '+loc.secret.txt);
    toast(loc.secret.txt);
  }
  save();render();
}
function pickAnimal(loc){
  var list=loc.animals.filter(function(a){
    var A=ANIMALS[a];
    if(A.night&&!isNight())return false;
    if(A.weather&&A.weather.indexOf(S.weather)<0)return false;
    if(a==='butterfly'&&!isNight()&&S.weather!=='sun'&&chance(0.5))return false;
    return true;
  });
  if(!list.length)list=loc.animals;
  return pick(list);
}
function startEncounter(loc){
  var a=pickAnimal(loc);
  ENC={animal:a,loc:loc.id};
  S.meets++;S.quests.dq3=(S.quests.dq3||0)+1;
  log('🐾 Встреча: '+ANIMALS[a].e+' '+ANIMALS[a].n+'!');
  save();render();
}
function encScreen(){
  var A=ANIMALS[ENC.animal],loc=locById(ENC.loc);
  var h='<div class="card" style="text-align:center"><div style="font-size:64px">'+A.e+'</div><h2>'+A.n+'</h2><p>Редкость: <b>'+A.r+'</b> • Место: '+loc.n+'</p><p class="muted">Животное заметило тебя. Что будешь делать?</p>';

  h+='<button class="choice" data-enc="feed">🍯 Покормить<small>'+(S.inv.honey?'У тебя есть мёд — почти наверняка подружитесь!':'Без мёда сработает хуже. Мёд — у торговца.')+'</small></button>';

  h+='<button class="btn ghost" data-enc="leave">🚶 Уйти тихо</button></div>';
  return h;
}
function resolveEnc(kind){
  var A=ANIMALS[ENC.animal];
  var ok=false,msg='';
  if(kind==='leave'){log('🚶 Ты тихо ушёл. '+A.n+' остался в лесу.');ENC=null;save();render();return}
  if(kind==='quiet'){
    var base=A.r2>=2?0.5:0.7;
    if(S.buffs.friend)base+=0.3;
    if(S.buffs.wolf&&(ENC.animal==='wolf'||ENC.animal==='bear'))ok=true;
    else ok=chance(Math.min(0.95,base));
  }
  if(kind==='feed'){
    if(S.inv.honey){S.inv.honey--;if(S.inv.honey<=0)delete S.inv.honey;ok=chance(0.95)}
    else if(S.inv.berry){S.inv.berry--;if(S.inv.berry<=0)delete S.inv.berry;ok=chance(0.7)}
    else ok=chance(0.6);
  }
  if(kind==='photo'){ok=chance(0.5);addXp(10)}
  if(ok){
    var first=!S.animals[ENC.animal];
    S.animals[ENC.animal]=(S.animals[ENC.animal]||0)+1;
    addXp(A.xp);
    msg='❤️ '+A.n+' подружился с тобой! +'+A.xp+'⭐';
    if(first)msg+=' (новый вид в коллекции!)';
    log(msg);toast(msg);
  }else{
    addXp(5);
    msg='💨 '+A.n+' убежал… +5⭐ за попытку';
    if(A.r2>=2){S.energy=Math.max(0,S.energy-15);msg+=' • Испугался: −15⚡'}
    log(msg);toast(msg);
  }
  ENC=null;save();render();
}
function rollEvent(loc){
  // сюжетные события — в приоритете

    S.storyDone.hermit=true;

    log('👴 Отшельник вышел из-за деревьев: «Деревня не исчезла — её спрятали. Ищи страницы дневника». +100💰 +5💎');
    toast('👴 Ты встретил Отшельника! +100💰 +5💎');

  }
  if(loc.id==='lake'&&isNight()&&S.story>=4&&!S.storyDone.keeper){
    S.storyDone.keeper=true;
    S.coins+=150;S.crys+=5;

  }
  var ev=pick(['trader','hiker','thief','butterfly','rain','whisper']);
  if(ev==='trader'){
    log('🦡 Торговец Барсук встретился на тропе: «Ключ? Мёд? Недорого!» — загляни в магазин.');
    toast('🦡 Встретил торговца на тропе!');
  }else if(ev==='hiker'){
    S.coins+=30;addXp(15);
    log('🥾 Потерявшийся грибник: ты вывел его из леса. Благодарность: +30💰 +15⭐');
    toast('🥾 Помог грибнику! +30💰');
  }else if(ev==='thief'){
    if(S.coins>=10){S.coins-=10;log('🦝 Енот-воришка стащил 10 монет! Вот нахал.');toast('🦝 Енот стащил 10💰!')}
    else{addItem('acorn',2);log('🦝 Енот хотел тебя обокрасть, но ты его перехитрил: +2🌰');toast('🦝 Перехитрил енота! +2🌰')}
  }else if(ev==='butterfly'&&!isNight()&&S.weather==='sun'){
    S.crys+=5;addXp(20);
    log('🦋 Золотая бабочка села тебе на плечо! +5💎 +20⭐');
    toast('🦋 Золотая бабочка! +5💎');
  }else if(ev==='rain'&&S.weather==='rain'){
    addItem('mushroom',3);S.quests.dq2=(S.quests.dq2||0)+3;
    log('🌧️ После дождя грибы лезут отовсюду: +3🍄');
    toast('🌧️ Грибной дождь! +3🍄');

    log('🌫️ Туман шепчет: «Тайна рядом…» — попробуй «Искать тайну» сейчас!');
    toast('🌫️ Туман шепчет… Ищи тайну!');
  }else{
    return false;
  }

function storyReward(){
  var R=[[50,0],[100,0],[100,5],[100,0],[150,5],[150,0],[200,10],[0,0]];
  var r=R[Math.min(S.story,R.length-1)];
  S.coins+=r[0];S.crys+=r[1];
  return (r[0]?'+'+r[0]+'💰':'')+(r[1]?' +'+r[1]+'💎':'');
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-loc],[data-act],[data-dq],[data-sell],[data-open],[data-camp],[data-pet],[data-buy],[data-buykey],[data-buyhoney],[data-ach],[data-storynext],[data-ending],[data-enc],#backBtn,#dailyBtn,#harvestBtn,#decorBtn,#resetBtn');
  if(!t)return;
  if(t.dataset.tab){TAB=t.dataset.tab;LOC=null;ENC=null;save();render();return}
  if(t.dataset.loc){
    var l=locById(t.dataset.loc);
    if(locLocked(l)){toast('🔒 '+locLocked(l));return}
    LOC=l.id;save();render();return;
  }
  if(t.id==='backBtn'){LOC=null;save();render();return}
  if(t.dataset.act){var l=locById(LOC);doExplore(l,t.dataset.act);return}
  if(t.dataset.enc){resolveEnc(t.dataset.enc);return}
  if(t.id==='dailyBtn'){
    if(S.daily.date===todayStr()){toast('🎁 Подарок уже забран — приходи завтра!');return}
    var streak=(S.daily.lastDate&&((Date.now()-new Date(S.daily.lastDate).getTime())<86400000*2))?S.daily.streak+1:1;
    S.daily.streak=streak;S.daily.date=todayStr();S.daily.lastDate=todayStr();
    var rew=50+S.camp.storage*25;
    S.coins+=rew;
    var bonus=pick(['mushroom','berry','herb','wood','shard']);
    addItem(bonus,2);
    if(streak>=3)S.crys+=5;
    addXp(20);
    log('🎁 Подарок за вход: +'+rew+'💰 +2'+ITEMS[bonus].e+' • Серия: '+streak+' дн.'+(streak>=3?' +5💎':''));
    toast('🎁 +'+rew+'💰 +2'+ITEMS[bonus].e+'! Серия: '+streak+' дн.');
    save();render();return;
  }
  if(t.dataset.dq){
    var q=DAILY_QUESTS.filter(function(x){return x.id===t.dataset.dq})[0];
    if(q&&q.check()&&!S.quests['c_'+q.id]){S.quests['c_'+q.id]=true;S.coins+=q.r;log('📋 Задание выполнено: +'+q.r+'💰');toast('📋 +'+q.r+'💰 за задание!');save();render()}
    return;
  }
  if(t.dataset.sell){
    var id=t.dataset.sell;
    if(!S.inv[id])return;
    S.inv[id]--;if(S.inv[id]<=0)delete S.inv[id];
    S.coins+=ITEMS[id].p;
    toast('Продано: '+ITEMS[id].e+' '+ITEMS[id].n+' +'+ITEMS[id].p+'💰');
    save();render();return;
  }
  if(t.dataset.open){
    if(!S.inv.key){toast('🗝️ Нужен ключ! Купи у торговца за 40💰');return}
    if(!S.inv.chest)return;
    S.inv.key--;if(S.inv.key<=0)delete S.inv.key;
    S.inv.chest--;if(S.inv.chest<=0)delete S.inv.chest;
    var r=Math.random(),msg='';
    if(r<0.4){var c=50+rnd(101);S.coins+=c;msg='🎁 В сундуке: +'+c+'💰!'}
    else if(r<0.7){var it=pick(['mushroom','berry','herb','shard','honey']);addItem(it,2);msg='🎁 В сундуке: '+ITEMS[it].e+' '+ITEMS[it].n+' ×2!'}
    else if(r<0.9){var cr=3+rnd(6);S.crys+=cr;msg='🎁 В сундуке: +'+cr+'💎!'}
    else{
      var missing=['artifact1','artifact2','artifact3'].filter(function(a){return !S.artifacts[a]});
      if(missing.length){var a=pick(missing);S.artifacts[a]=true;addItem(a,1);msg='🎁 В сундуке — АРТЕФАКТ: '+ITEMS[a].e+' '+ITEMS[a].n+'!'}
      else{S.coins+=200;msg='🎁 В сундуке: +200💰!'}
    }
    addXp(30);log(msg);toast(msg);save();render();return;
  }
  if(t.dataset.camp){
    var k=t.dataset.camp,lv=S.camp[k],next=CAMP[k][lv+1];
    if(!next)return;
    if(S.coins<next.p){toast('💰 Не хватает монет! Нужно '+next.p+'💰');return}
    S.coins-=next.p;S.camp[k]++;
    log('🏕️ Улучшено: '+next.n+'!');
    toast('🏕️ '+next.n+'!');save();render();return;
  }
  if(t.dataset.pet){
    var p=t.dataset.pet;
    if(S.crys<PETS[p].p){toast('💎 Не хватает кристаллов! Нужно '+PETS[p].p+'💎');return}
    S.crys-=PETS[p].p;S.camp.pet=p;
    log('🐾 Новый питомец: '+PETS[p].e+' '+PETS[p].n+'!');
    toast('🐾 '+PETS[p].n+' теперь с тобой!');save();render();return;
  }
  if(t.id==='harvestBtn'){
    if(S.gardenDate===todayStr())return;
    S.gardenDate=todayStr();
    var n=S.camp.garden*5;addItem('berry',n);
    log('🌷 Собрал урожай: +'+n+'🫐');toast('🫐 Урожай: +'+n+' ягод!');save();render();return;
  }
  if(t.id==='decorBtn'){
    if(S.coins<50){toast('💰 Не хватает монет! Нужно 50💰');return}
    S.coins-=50;S.camp.decor++;addXp(10);
    log('🌸 Украсил лагерь! +10⭐');toast('🌸 Лагерь стал красивее! +10⭐');save();render();return;
  }
  if(t.dataset.buy){
    var tool=TOOLS[t.dataset.buy];
    if(S.tools[t.dataset.buy])return;
    if(S.coins<tool.p){toast('💰 Не хватает монет! Нужно '+tool.p+'💰');return}
    S.coins-=tool.p;S.tools[t.dataset.buy]=true;
    log('🛒 Куплено: '+tool.e+' '+tool.n);toast('🛒 '+tool.n+' — твоё!');save();render();return;
  }
  if(t.dataset.buykey){
    if(S.coins<40){toast('💰 Не хватает монет! Нужно 40💰');return}
    S.coins-=40;addItem('key',1);toast('🗝️ Куплен ключ!');save();render();return;
  }
  if(t.dataset.buyhoney){
    if(S.coins<30){toast('💰 Не хватает монет! Нужно 30💰');return}
    S.coins-=30;addItem('honey',1);toast('🍯 Куплен мёд!');save();render();return;
  }
  if(t.dataset.ach){
    var a=ACH.filter(function(x){return x.id===t.dataset.ach})[0];
    if(a&&a.check()&&!S.ach[a.id]){S.ach[a.id]=true;S.crys+=a.r;log('🏆 Достижение: '+a.n+' +'+a.r+'💎');toast('🏆 '+a.n+'! +'+a.r+'💎');save();render()}
    return;
  }
  if(t.dataset.storynext){
    var ch=STORY[S.story];
    if(ch&&ch.check()){
      var rw=storyReward();
      S.story++;
      log('📖 Глава завершена: '+ch.t+' • Награда: '+rw);
      toast('📖 Глава пройдена! '+rw);
      save();render();
    }
    return;
  }
  if(t.dataset.ending){
    var end=t.dataset.ending,ok=false,txt='';
    if(end==='restore'&&Object.keys(S.artifacts).length>=3){ok=true;txt='🌻 Ты вернул деревне свет! Дома засветились, жители вернулись, а лес запел. Ты — герой Леса Тайн!'}
    if(end==='secret'&&S.coins>=1000){S.coins-=1000;ok=true;txt='🤫 Ты унёс тайну с собой. Деревня спит под озером, а ты — её единственный хранитель. Лес доверяет тебе.'}
    if(end==='keeper'&&S.level>=25){ok=true;txt='👑 Лес признал тебя! Корона лесного короля — твоя. Теперь ты — Хранитель Леса Тайн.'}
    if(!ok){toast('🔒 Не хватает условий для этой концовки!');return}
    S.storyDone.ending=end;S.storyDone.endingText=txt;S.story=STORY.length;
    S.coins+=500;S.crys+=50;addXp(200);
    log('🎭 ФИНАЛ: '+txt);toast('🎭 Концовка открыта! +500💰 +50💎');
    save();render();return;
  }
  if(t.id==='resetBtn'){
    if(!confirm('Начать заново? Весь прогресс Леса Тайн пропадёт.'))return;
    S=defaultState();TAB='map';LOC=null;ENC=null;save();render();
    toast('🌲 Новый лес ждёт тебя!');
    return;
  }
});

function maxMana(){return 10+((S.alch&&S.alch.lv)||1)*2}
function addIng(id,n){S.ing[id]=(S.ing[id]||0)+(n||1);S.found+=(n||1)}
function ingTotal(){var t=0;for(var k in S.ing)t+=S.ing[k];return t}
function pickIng(loc){
  if(loc&&loc.ings&&loc.ings.length)return pick(loc.ings);
  var w=[10,6,3,1.5,0.6,0.2],pool=[],tot=0;
  for(var id in ING){var ww=w[ING[id].r];pool.push([id,ww]);tot+=ww}
  var r=Math.random()*tot;
  for(var i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0)return pool[i][0]}
  return pool[0][0];
}
function rollEgg(){
  var w=[40,30,18,8,3,1],pool=[],tot=0;
  for(var id in PETS2){var ww=w[PETS2[id].r];pool.push([id,ww]);tot+=ww}
  var r=Math.random()*tot;
  for(var i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0)return pool[i][0]}
  return pool[0][0];
}
function addAlchXp(n){
  S.alch.xp+=n;

    toast('🧙 Уровень алхимика: '+S.alch.lv+'! +2✨ маны, новые заклинания!');

}

function castSpell(sp){
  if(S.alch.lv<sp.lv){toast('🔒 Нужно звание алхимика '+sp.lv+' уровня!');return}
  if(S.mana<sp.cost){toast('✨ Не хватает маны! Нужно '+sp.cost+'✨');return}
  S.mana-=sp.cost;S.spells[sp.id]=true;
  var msg='';
  switch(sp.id){
    case 'light':S.buffs.luck=2;msg='✨ Свет озарил лес! 2 исследования — удачнее!';break;
    case 'growth':S.gardenDate='';msg='🌱 Сад мгновенно поспел!';break;
    case 'rain':S.weather='rain';msg='🌧️ Пошёл дождь! Грибов станет больше.';break;

    case 'rainbow':S.coins+=200;msg='🌈 Радуга! +200💰';break;
    case 'butterflies':addXp(30);msg='🦋 Бабочки кружат! +30⭐';break;
    case 'tree':addItem('wood',5);msg='🌳 Древнее дерево поделилось: +5🪵';break;
    case 'portal':S.buffs.portal=1;msg='🌀 Следующее исследование — бесплатно!';break;
    case 'secrets':if(LOC){log('🔮 Заклинание указало на тайну…');doSecret(locById(LOC));addXp(10);save();render();return}msg='🔮 Выбери локацию на карте — заклинание укажет тайну!';S.mana+=sp.cost;delete S.spells[sp.id];toast(msg);save();render();return;

function spinWheel(){
  if(S.wheelDate===todayStr()){toast('🎡 Колесо уже крутили сегодня — приходи завтра!');return}
  S.wheelDate=todayStr();
  var tot=0;WHEEL_PRIZES.forEach(function(p){tot+=p.w});
  var r=Math.random()*tot,pr=WHEEL_PRIZES[0];
  for(var i=0;i<WHEEL_PRIZES.length;i++){r-=WHEEL_PRIZES[i].w;if(r<=0){pr=WHEEL_PRIZES[i];break}}
  pr.go();addXp(10);
  log('🎡 Колесо удачи: '+pr.t);
  toast('🎡 '+pr.t);
  save();render();
}

function petsScreen(){
  var owned=Object.keys(S.pets2||{});
  var h='<div class="card"><h2>🐾 Домик питомцев</h2><p>Твои питомцы живут здесь и гуляют по лагерю. Гладить, кормить и играть — дружба растёт, а питомцы приносят подарки!</p></div>';
  h+='<div class="meadow">';
  owned.slice(0,8).forEach(function(id,i){var P=PETS2[id];var pt=S.pets2[id];h+='<span class="petwalk" style="animation-delay:'+(i*1.3)+'s;animation-duration:'+(9+i*1.5)+'s" data-petjump="'+id+'">'+(pt.skin||P.e)+'</span>'});
  h+='<div class="ground">'+(S.labDecor>=1?'🏠':'')+(S.labDecor>=2?'🛏️':'')+(S.labDecor>=3?'🎾':'')+(S.labDecor>=4?'🥣':'')+(S.labDecor>=5?'🌸':'')+'🌱🌼🍄🌿🌸</div></div>';
  h+='<div class="card"><h2>🥚 Яйца ('+Object.keys(S.eggs).filter(function(k){return S.eggs[k]}).length+' видов)</h2>';
  var hasEgg=false;
  for(var eid in S.eggs){
    if(!S.eggs[eid])continue;hasEgg=true;
    var P=PETS2[eid];
    h+='<div class="item"><span class="e">🥚</span><span class="n">Яйцо: '+P.n+'<small>'+RARN[P.r]+' • Вылупление стоит 10⚡</small></span><button class="btn small gold" data-hatch="'+eid+'">Вылупить</button><span class="cnt">×'+S.eggs[eid]+'</span></div>';
  }
  if(!hasEgg)h+='<p class="muted">Яиц пока нет. Они находятся при исследовании леса (4% шанс) и в Колесе удачи!</p>';
  h+='</div>';
  if(!owned.length)h+='<div class="card"><p>Питомцев пока нет. Найди яйцо — и вылупи первого друга! 🥚</p></div>';
  owned.forEach(function(id){
    var P=PETS2[id],pt=S.pets2[id];
    var fly=(id==='butterfly'||id==='fairy'||id==='bird'||id==='dragon');
    h+='<div class="petcard"><span class="pe'+(fly?' fly':'')+'">'+(pt.skin||P.e)+'</span><span class="n" style="flex:1"><b>'+(pt.name||P.n)+'</b> • '+P.n+'<small>'+RARN[P.r]+' • '+petFrTitle(pt.fr)+' • Дружба: '+pt.fr+'/100</small><div class="bar" style="margin:4px 0 0"><i style="width:'+pt.fr+'%"></i></div></span></div>';
    h+='<div class="row" style="margin-bottom:10px"><button class="btn small" data-petpet="'+id+'">🥰 Гладить</button><button class="btn small" data-feed="'+id+'">🍖 Кормить</button><button class="btn small" data-play="'+id+'">🎮 Играть</button><button class="btn small" data-bath="'+id+'">🛁 Купать</button><button class="btn small" data-rename="'+id+'">✏️ Имя</button></div>';
  });
  h+='<div class="card"><h2>🏡 Украшения домика</h2><p class="muted">Украшений: '+(S.labDecor||0)+'/5 • Каждое — +10⭐ и радость питомцев.</p><button class="btn" data-labdecor="1">Купить украшение (50💰, +10⭐)</button></div>';
  return h;
}
function bookScreen(){
  var bs=bookStats();
  var h='<div class="card"><h2>📖 Книга магии</h2><p>Заполняй страницы открытий — за каждые 25% награда +5💎!</p></div>';
  var cats=[
    {k:'pot',e:'🧪',n:'Зелья',got:bs.pot.got,tot:bs.pot.tot},
    {k:'ing',e:'🌿',n:'Ингредиенты',got:bs.ing.got,tot:bs.ing.tot},
    {k:'pets',e:'🐾',n:'Питомцы',got:bs.pets.got,tot:bs.pets.tot},
    {k:'spells',e:'🪄',n:'Заклинания',got:bs.spells.got,tot:bs.spells.tot},
    {k:'art',e:'🏺',n:'Артефакты',got:bs.art.got,tot:bs.art.tot},
    {k:'sec',e:'🗝️',n:'Секреты',got:bs.sec.got,tot:bs.sec.tot}
  ];
  cats.forEach(function(c){
    var pct=Math.min(100,Math.round(c.got/c.tot*100));
    var mile=Math.floor(pct/25);
    var claimed=S.bookClaim[c.k]||0;
    h+='<div class="card"><h2>'+c.e+' '+c.n+'</h2><p>'+c.got+'/'+c.tot+' • '+pct+'%</p><div class="bar"><i style="width:'+pct+'%"></i></div>';
    if(mile>claimed)h+='<button class="btn small gold" data-bookclaim="'+c.k+'">Забрать награду +'+(5*(mile-claimed))+'💎</button>';
    else h+='<p class="muted">Следующая награда — на '+(claimed+1)*25+'%</p>';
    h+='</div>';
  });
  h+='<div class="card"><h2>🎡 Колесо удачи</h2><p class="muted">Одно бесплатное вращение в день! Призы: монеты, кристаллы, ингредиенты, зелья и даже магические яйца.</p><button class="btn gold" data-wheel="1">🎡 Крутить колесо'+(S.wheelDate===todayStr()?' — завтра':'')+'</button></div>';
  h+='<div class="card"><h2>🧪 Коллекция зелий</h2><p>';
  Object.keys(POTIONS).forEach(function(pid){
    var P=POTIONS[pid];
    h+='<span class="badge" style="'+(S.knownPot[pid]?'':'opacity:.4')+'">'+P.e+' '+P.n+'</span>';
  });
  h+='</p><h2 style="margin-top:10px">🌿 Найденные ингредиенты</h2><p>';
  var ingIds=Object.keys(S.ing);
  if(!ingIds.length)h+='<span class="muted">Пока ничего не найдено.</span>';
  ingIds.forEach(function(iid){
    var I=ING[iid];
    h+='<span class="badge" style="'+(ING[iid].r>=2?'':'opacity:.7')+'">'+I.e+' '+I.n+' ×'+S.ing[iid]+'</span>';
  });
  h+='</p></div>';
  return h;
}
// ================= МАГИЯ v2: ДЕЙСТВИЯ =================
function magicGoods(){
  var keys=Object.keys(ING).filter(function(k){return ING[k].r<=2});
  var base=(S.day*3)%keys.length,ings=[];
  for(var i=0;i<3;i++){var id=keys[(base+i)%keys.length];ings.push({id:id,p:[20,35,50][ING[id].r]})}
  var pots=Object.keys(POTIONS).filter(function(k){return POTIONS[k].r<=1});
  return{ings:ings,pot:pots[S.day%pots.length]};
}
function brewFromRecipe(pid){
  var P=POTIONS[pid];
  if(!P)return false;
  if(P.r>=4&&S.alch.lv<5){toast('🔒 Легендарные зелья — с 5 уровня алхимика!');return false}
  if(P.r>=3&&S.alch.lv<3){toast('🔒 Эпические зелья — с 3 уровня алхимика!');return false}
  for(var ri in P.rec)if((S.ing[ri]||0)<P.rec[ri]){toast('🌿 Не хватает: '+ING[ri].n);return false}
  for(var ri in P.rec){S.ing[ri]-=P.rec[ri];if(S.ing[ri]<=0)delete S.ing[ri]}
  S.pot[pid]=(S.pot[pid]||0)+1;
  S.knownPot[pid]=true;
  S.alch.brewed=(S.alch.brewed||0)+1;
  S.quests.dq4=(S.quests.dq4||0)+1;
  addAlchXp(20);
  log('🧪 Сварено: '+P.e+' '+P.n+'!');
  toast('🧪 '+P.n+' готово!');
  return true;
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-ing],[data-slot],[data-brew],[data-clearpot],[data-brewrec],[data-uspot],[data-cast],[data-wheel],[data-hatch],[data-petpet],[data-feed],[data-play],[data-bath],[data-rename],[data-petjump],[data-labdecor],[data-bookclaim],[data-mbuying],[data-mbuypot]');
  if(!t)return;
  if(t.dataset.ing){
    var id=t.dataset.ing;
    var ix=CAULD.indexOf(id);
    if(ix>=0){CAULD.splice(ix,1)}
    else{
      if(CAULD.length>=3){toast('🧪 В котле уже 3 ингредиента!');return}
      if(!S.ing[id])return;
      CAULD.push(id);
    }
    save();render();return;
  }
  if(t.dataset.slot!==undefined){CAULD.splice(+t.dataset.slot,1);save();render();return}
  if(t.dataset.clearpot){CAULD=[];save();render();return}
  if(t.dataset.brew){
    if(!CAULD.length){toast('🧪 Котёл пуст! Выбери ингредиенты.');return}
    var match=null;
    Object.keys(POTIONS).forEach(function(pid){
      var rec=POTIONS[pid].rec,keys=Object.keys(rec);
      if(keys.length!==CAULD.length)return;
      var ok=true,tmp=CAULD.slice();
      keys.forEach(function(k){for(var i=0;i<rec[k];i++){var ix=tmp.indexOf(k);if(ix<0){ok=false;return}tmp.splice(ix,1)}});
      if(ok&&!tmp.length)match=pid;
    });
    if(match){
      var P=POTIONS[match];
      if(P.r>=4&&S.alch.lv<5){toast('🔒 Легендарные зелья — с 5 уровня алхимика!');return}
      if(P.r>=3&&S.alch.lv<3){toast('🔒 Эпические зелья — с 3 уровня алхимика!');return}
      CAULD.forEach(function(ing){S.ing[ing]--;if(S.ing[ing]<=0)delete S.ing[ing]});
      CAULD=[];
      S.pot[match]=(S.pot[match]||0)+1;
      S.knownPot[match]=true;
      S.alch.brewed=(S.alch.brewed||0)+1;
      S.quests.dq4=(S.quests.dq4||0)+1;
      addAlchXp(20);
      log('🧪 Сварено: '+P.e+' '+P.n+'! Рецепт открыт в книге!');
      toast('🧪 '+P.n+' готово! Рецепт открыт!');
    }else{
      CAULD.forEach(function(ing){S.ing[ing]--;if(S.ing[ing]<=0)delete S.ing[ing]});
      CAULD=[];
      if(chance(0.3)){
        var ks=Object.keys(POTIONS).filter(function(k){return POTIONS[k].r<=1});
        var p=pick(ks);S.pot[p]=(S.pot[p]||0)+1;
        S.alch.brewed=(S.alch.brewed||0)+1;S.quests.dq4=(S.quests.dq4||0)+1;addAlchXp(10);
        log('🧪 Эксперимент удался! Получилось: '+POTIONS[p].e+' '+POTIONS[p].n);
        toast('🧪 Случайное зелье: '+POTIONS[p].n+'!');
      }else{
        addAlchXp(5);
        log('💩 Эксперимент не удался… Получилась слизь. Попробуй другой рецепт!');
        toast('💩 Получилась слизь… Попробуй иначе!');
      }
    }
    save();render();return;
  }
  if(t.dataset.brewrec){if(brewFromRecipe(t.dataset.brewrec)){save();render()}return}
  if(t.dataset.uspot){usePotion(t.dataset.uspot);return}
  if(t.dataset.cast){var sp=SPELLS.filter(function(x){return x.id===t.dataset.cast})[0];if(sp)castSpell(sp);return}
  if(t.dataset.wheel){spinWheel();return}
  if(t.dataset.hatch){
    var eid=t.dataset.hatch;
    if(!S.eggs[eid])return;
    if(S.energy<10){toast('⚡ Не хватает энергии! Нужно 10⚡');return}
    S.energy-=10;S.eggs[eid]--;if(S.eggs[eid]<=0)delete S.eggs[eid];
    S.pets2[eid]={name:PETS2[eid].n,fr:10,lvl:1};
    if(PETS2[eid].r>=4)S.hatchedLeg=true;
    addXp(30);
    log('🐣 Вылупился питомец: '+PETS2[eid].e+' '+PETS2[eid].n+'! Теперь он твой друг!');
    toast('🐣 Вылупился: '+PETS2[eid].n+'!');
    save();render();return;
  }
  if(t.dataset.petpet){
    var pt=S.pets2[t.dataset.petpet];if(!pt)return;
    pt.fr=Math.min(100,pt.fr+5);
    S.quests.dq5=(S.quests.dq5||0)+1;
    petGiftCheck(t.dataset.petpet);
    toast('🥰 '+(pt.name||PETS2[t.dataset.petpet].n)+' доволен! Дружба: '+pt.fr+'/100');
    save();render();return;
  }
  if(t.dataset.feed){
    var pt=S.pets2[t.dataset.feed];if(!pt)return;
    if(S.inv.berry){S.inv.berry--;if(!S.inv.berry)delete S.inv.berry}
    else if(S.inv.mushroom){S.inv.mushroom--;if(!S.inv.mushroom)delete S.inv.mushroom}
    else{toast('🍖 Нечем кормить! Нужны ягоды или грибы.');return}
    pt.fr=Math.min(100,pt.fr+10);
    petGiftCheck(t.dataset.feed);
    toast('🍖 '+(pt.name||PETS2[t.dataset.feed].n)+' поел! Дружба: '+pt.fr+'/100');
    save();render();return;
  }
  if(t.dataset.play){
    var pt=S.pets2[t.dataset.play];if(!pt)return;
    if(S.energy<5){toast('⚡ Не хватает энергии для игры!');return}
    S.energy-=5;pt.fr=Math.min(100,pt.fr+8);
    petGiftCheck(t.dataset.play);
    toast('🎮 Играете вместе! Дружба: '+pt.fr+'/100');
    save();render();return;
  }
  if(t.dataset.bath){
    var pt=S.pets2[t.dataset.bath];if(!pt)return;
    pt.fr=Math.min(100,pt.fr+5);
    petGiftCheck(t.dataset.bath);
    toast('🛁 '+(pt.name||PETS2[t.dataset.bath].n)+' чистый и довольный!');
    save();render();return;
  }
  if(t.dataset.rename){
    var pt=S.pets2[t.dataset.rename];if(!pt)return;
    var nm=prompt('Имя для питомца:',pt.name||PETS2[t.dataset.rename].n);
    if(nm&&nm.trim()){pt.name=nm.trim().slice(0,20);toast('✏️ Теперь его зовут '+pt.name+'!')}
    save();render();return;
  }
  if(t.dataset.petjump){
    var pt=S.pets2[t.dataset.petjump];if(!pt)return;
    toast('🐾 '+(pt.name||PETS2[t.dataset.petjump].n)+' рад тебя видеть! '+petFrTitle(pt.fr)+' • Дружба: '+pt.fr+'/100');
    return;
  }
  if(t.dataset.labdecor){
    if((S.labDecor||0)>=5){toast('🏡 Домик уже полностью украшен!');return}
    if(S.coins<50){toast('💰 Не хватает монет! Нужно 50💰');return}
    S.coins-=50;S.labDecor=(S.labDecor||0)+1;addXp(10);
    toast('🏡 Украшение куплено! Питомцы в восторге! +10⭐');
    save();render();return;
  }
  if(t.dataset.bookclaim){
    var k=t.dataset.bookclaim,bs=bookStats()[k];
    var mile=Math.floor(Math.min(100,Math.round(bs.got/bs.tot*100))/25);
    var claimed=S.bookClaim[k]||0;
    if(mile>claimed){var rw=(mile-claimed)*5;S.crys+=rw;S.bookClaim[k]=mile;log('📖 Награда за Книгу магии: +'+rw+'💎');toast('📖 +'+rw+'💎 за открытия!')}
    save();render();return;
  }
  if(t.dataset.mbuying){
    var id=t.dataset.mbuying,g=magicGoods().ings.filter(function(x){return x.id===id})[0];
    if(!g)return;
    if(S.coins<g.p){toast('💰 Не хватает монет! Нужно '+g.p+'💰');return}
    S.coins-=g.p;addIng(id,1);
    toast('🧙 Куплено: '+ING[id].e+' '+ING[id].n+'!');
    save();render();return;
  }
  if(t.dataset.mbuypot){
    var id=t.dataset.mbuypot;
    if(S.crys<5){toast('💎 Не хватает кристаллов! Нужно 5💎');return}
    S.crys-=5;S.pot[id]=(S.pot[id]||0)+1;
    toast('🧙 Куплено: '+POTIONS[id].e+' '+POTIONS[id].n+'!');
    save();render();return;
  }
});
// ================= СТАРТ =================
(function init(){
  resetDaily();
  if(!S.weather)newWeather();
  // энергия за время отсутствия
  if(S.lastSeen){
    var mins=Math.floor((Date.now()-S.lastSeen)/60000);
    if(mins>=3){
      var gain=Math.min(Math.floor(mins/3)+S.camp.fire*5,maxEnergy()-S.energy);
      if(gain>0){S.energy+=gain;setTimeout(function(){toast('⚡ Отдохнул: +'+gain+' энергии')},800)}
    }
  }
  render();
})();
</script>
