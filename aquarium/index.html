<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐠 Аквариум — E.Y.L Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0d1117; color:#e6edf3; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:10px 10px 26px; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .back { color:#58a6ff; text-decoration:none; font-size:15px; background:#161b22; border:1px solid #30363d; padding:7px 12px; border-radius:10px; }
  h1 { font-size:21px; }
  .hud { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .hud .cell { flex:1; min-width:86px; background:#161b22; border:1px solid #30363d; border-radius:12px; padding:7px 8px; text-align:center; font-size:15px; }
  .hud .cell b { display:block; font-size:16px; color:#ffd93d; }
  .hud .cell span { font-size:11px; color:#8b949e; }
  #tank { position:relative; height:44vh; min-height:280px; border-radius:16px; overflow:hidden; border:2px solid #2b6cb0;
    background:linear-gradient(180deg,#63b3ed 0%,#2b6cb0 55%,#1a4a73 100%); touch-action:none; user-select:none; }
  #tank.dirty { background:linear-gradient(180deg,#7a9a5b 0%,#55703d 55%,#38502a 100%); }
  .sand { position:absolute; left:0; right:0; bottom:0; height:26px; background:linear-gradient(180deg,#e8d28a,#c2a356); z-index:1; }
  .bubble { position:absolute; border-radius:50%; background:rgba(255,255,255,.35); z-index:1; pointer-events:none; animation:rise linear forwards; }
  @keyframes rise { from { transform:translateY(0); opacity:.8; } to { transform:translateY(-46vh); opacity:0; } }
  .fish { position:absolute; transform:translate(-50%,-50%); line-height:1; pointer-events:none; z-index:3; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .decor { position:absolute; bottom:20px; z-index:2; pointer-events:none; line-height:1; }
  #tankMsg { position:absolute; top:8px; left:0; right:0; text-align:center; font-size:16px; font-weight:800; color:#fff; text-shadow:0 2px 6px #000; z-index:8; pointer-events:none; opacity:0; transition:opacity .25s; }
  .btnrow { display:flex; gap:8px; margin:10px 0; }
  .btn { flex:1; background:#238636; color:#fff; border:none; border-radius:12px; padding:13px 6px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn.blue { background:#1f6feb; } .btn:disabled { opacity:.45; }
  .tabs { display:flex; gap:6px; margin:6px 0 8px; }
  .tabbtn { flex:1; background:#161b22; border:2px solid #30363d; color:#e6edf3; border-radius:10px; padding:9px 4px; font-size:15px; cursor:pointer; }
  .tabbtn.on { border-color:#ffd93d; background:#2a2410; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:10px; }
  .row { display:flex; align-items:center; gap:9px; padding:8px 4px; border-bottom:1px solid #21262d; }
  .row:last-child { border-bottom:none; }
  .row .ic { font-size:26px; }
  .row .tx { flex:1; font-size:14px; }
  .row .tx small { display:block; color:#8b949e; font-size:12px; }
  .bar { height:7px; background:#30363d; border-radius:4px; margin-top:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#4cc9f0; border-radius:4px; }
  .act { background:#ffd93d; color:#111; border:none; border-radius:9px; padding:8px 11px; font-weight:800; font-size:13px; cursor:pointer; white-space:nowrap; }
  .act.blue { background:#1f6feb; color:#fff; }
  .act:disabled { background:#30363d; color:#8b949e; }
  .foot { text-align:center; color:#8b949e; font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="../">← Игры</a><h1>🐠 Аквариум</h1></div>

  <div class="hud">
    <div class="cell"><b id="hudCoins">0</b><span>🪙 монеты</span></div>
    <div class="cell"><b id="hudFish">0/5</b><span>🐠 рыбки</span></div>
    <div class="cell"><b id="hudFeed">0</b><span>🍽️ корм</span></div>
    <div class="cell"><b id="hudClean">100%</b><span>🧽 чистота</span></div>
  </div>

  <div id="tank">
    <div class="sand"></div>
    <div id="tankMsg"></div>
  </div>

  <div class="btnrow">
    <button class="btn" id="feedBtn" onclick="feedAll()">🍽️ Покормить</button>
    <button class="btn blue" id="cleanBtn" onclick="cleanTank()">🧽 Почистить</button>
  </div>

  <div class="tabs">
    <button class="tabbtn on" id="tabbtn-fish" onclick="openTab('fish')">🐠 Мои рыбки</button>
    <button class="tabbtn" id="tabbtn-shop" onclick="openTab('shop')">🛒 Магазин</button>
    <button class="tabbtn" id="tabbtn-tasks" onclick="openTab('tasks')">📋 Задания</button>
  </div>
  <div class="panel" id="panel-fish"></div>
  <div class="panel" id="panel-shop" style="display:none"></div>
  <div class="panel" id="panel-tasks" style="display:none"></div>

  <div class="foot">Игра от создателя E.Y.L · рыбки растут, даже пока тебя нет · никто не умирает, не бойся 💛</div>
</div>
<script>
'use strict';
/* ============ АКВАРИУМ E.Y.L ============ */
var SAVE_KEY = 'eyl-aqua-v1';
var SPECIES = [
  { id:'guppy', e:'🐠', name:'Гуппи',     buy:20,   adult:55,    growMin:3 },
  { id:'plotva',e:'🐟', name:'Плотвичка', buy:30,   adult:85,    growMin:4 },
  { id:'krevet',e:'🦐', name:'Креветка',  buy:60,   adult:155,   growMin:6 },
  { id:'krab',  e:'🦀', name:'Краб',      buy:90,   adult:245,   growMin:8 },
  { id:'fugu',  e:'🐡', name:'Фугу',      buy:120,  adult:330,   growMin:10 },
  { id:'ulitka',e:'🐌', name:'Улитка',    buy:150,  adult:210,   growMin:10, cleaner:true },
  { id:'osmin', e:'🐙', name:'Осьминог',  buy:300,  adult:820,   growMin:15 },
  { id:'kalmar',e:'🦑', name:'Кальмар',   buy:450,  adult:1250,  growMin:20 },
  { id:'akula', e:'🦈', name:'Акула',     buy:1500, adult:4300,  growMin:30 },
  { id:'delfin',e:'🐬', name:'Дельфин',   buy:5000, adult:14500, growMin:45 }
];
var DECORS = [
  { id:'vodorosli', e:'🌿', name:'Водоросли', price:150,  growBonus:5,  sellBonus:0,  left:'6%' },
  { id:'korall',    e:'🪸', name:'Коралл',    price:200,  growBonus:0,  sellBonus:5,  left:'24%' },
  { id:'yakor',     e:'⚓', name:'Якорь',     price:350,  growBonus:5,  sellBonus:0,  left:'72%' },
  { id:'zamok',     e:'🏰', name:'Замок',     price:500,  growBonus:0,  sellBonus:10, left:'45%' },
  { id:'sunduk',    e:'💎', name:'Сундук с сокровищами', price:1000, growBonus:0, sellBonus:15, left:'86%' }
];
var TANKS = [
  { name:'Маленький аквариум', cap:5,  price:0 },
  { name:'Средний аквариум',   cap:10, price:1000 },
  { name:'Большой аквариум',   cap:20, price:5000 },
  { name:'Океанариум',         cap:40, price:20000 }
];
var TASKS = [
  { id:'buy',   icon:'🛒', name:'Купи рыбок',              tiers:[3,10,30,80],     rewards:[50,200,700,2500] },
  { id:'grow',  icon:'🌱', name:'Вырасти взрослых рыбок',  tiers:[3,10,30,80],     rewards:[80,300,1000,3500] },
  { id:'sell',  icon:'💰', name:'Продай рыбок',            tiers:[5,20,60,150],    rewards:[80,350,1200,4000] },
  { id:'feed',  icon:'🍽️', name:'Покорми аквариум (раз)',  tiers:[5,25,100],       rewards:[60,300,1500] },
  { id:'earn',  icon:'🪙', name:'Заработай на продажах',   tiers:[500,3000,15000,60000], rewards:[100,500,2000,8000] },
  { id:'kinds', icon:'🐡', name:'Собери разных видов',     tiers:[3,5,8,10],       rewards:[100,400,1500,5000] }
];
var DAILY_POOL = [
  { id:'sell', icon:'💰', name:'Продай 2 рыбок',        target:2, reward:100 },
  { id:'buy',  icon:'🛒', name:'Купи 2 рыбок',          target:2, reward:100 },
  { id:'feed', icon:'🍽️', name:'Покорми 2 раза',         target:2, reward:100 },
  { id:'grow', icon:'🌱', name:'Вырасти 1 взрослую рыбку', target:1, reward:120 }
];
var FEED_PACK = { price:25, count:10 };

function defState() {
  return {
    coins:100, feed:5, fish:[], nextId:1,
    clean:100, fedUntil:0, tank:0, decors:[],
    prog:{ buy:0, grow:0, sell:0, feed:0, earn:0 },
    kinds:[],
    tier:{ buy:0, grow:0, sell:0, feed:0, earn:0, kinds:0 },
    daily:{ date:'', idx:0, base:0, claimed:false },
    lastSeen: Date.now()
  };
}
var S = defState();
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw) { var p = JSON.parse(raw); var d = defState();
    for (var k in d) { if (p[k] !== undefined) S[k] = p[k]; }
    for (var k2 in d.prog) { if (S.prog[k2] === undefined) S.prog[k2] = 0; }
    for (var k3 in d.tier) { if (S.tier[k3] === undefined) S.tier[k3] = 0; }
  }
} catch (e) {}
function save() { S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function spDef(id) { for (var i=0;i<SPECIES.length;i++) if (SPECIES[i].id===id) return SPECIES[i]; return SPECIES[0]; }
function tankCap() { return TANKS[S.tank].cap; }
function growBonus() { var b = 0; DECORS.forEach(function(dc){ if (S.decors.indexOf(dc.id) >= 0) b += dc.growBonus; }); return b; }
function sellBonus() { var b = 0; DECORS.forEach(function(dc){ if (S.decors.indexOf(dc.id) >= 0) b += dc.sellBonus; }); return b; }
function hasCleaner() { return S.fish.some(function(f){ return spDef(f.sp).cleaner; }); }
function todayStr() { var t = new Date(); return t.getFullYear() + '-' + (t.getMonth()+1) + '-' + t.getDate(); }
function dailyDef() { return DAILY_POOL[S.daily.idx % DAILY_POOL.length]; }
function ensureDaily() {
  var t = todayStr();
  if (S.daily.date !== t) {
    var idx = 0; for (var i=0;i<t.length;i++) idx += t.charCodeAt(i);
    S.daily = { date:t, idx: idx % DAILY_POOL.length, base:0, claimed:false };
    S.daily.base = S.prog[dailyDef().id] || 0;
  }
}
function dailyProg() { var d = dailyDef(); return Math.min(d.target, (S.prog[d.id] || 0) - S.daily.base); }

/* ---- рост и время ---- */
function growthRatePerSec() {
  var r = 1;
  if (Date.now() < S.fedUntil) r *= 2;          /* сытые растут вдвое быстрее */
  if (S.clean < 30) r *= 0.5;                    /* в грязи медленнее */
  r *= (1 + growBonus() / 100);
  return r;
}
function advanceTime(seconds) {
  if (seconds <= 0) return;
  var rate = growthRatePerSec();
  S.fish.forEach(function(f){
    if (f.prog < 1) {
      var before = f.prog;
      f.prog = Math.min(1, f.prog + seconds * rate / (spDef(f.sp).growMin * 60));
      if (before < 1 && f.prog >= 1) S.prog.grow += 1;
    }
  });
  var dirt = seconds / (20 * 3600) * 100;        /* полный загряз за 20 часов */
  if (hasCleaner()) dirt *= 0.4;                 /* улитка помогает */
  S.clean = Math.max(0, S.clean - dirt);
}
function offlineProgress() {
  var now = Date.now();
  var elapsed = Math.min(8 * 3600, Math.max(0, (now - (S.lastSeen || now)) / 1000));
  if (elapsed > 30) advanceTime(elapsed);
  S.lastSeen = now;
}

/* ---- действия ---- */
function buyFish(spId) {
  var d = spDef(spId);
  if (S.fish.length >= tankCap()) { tankSay('Аквариум полный! Купи аквариум побольше в магазине 🐠'); return false; }
  if (S.coins < d.buy) { tankSay('Не хватает монет 🪙'); return false; }
  S.coins -= d.buy;
  S.fish.push({ id:S.nextId++, sp:spId, prog:0, x:10 + Math.random()*80, y:20 + Math.random()*55, vx:(Math.random()<0.5?-1:1)*(14+Math.random()*16), vy:0, ph:Math.random()*6 });
  S.prog.buy += 1;
  if (S.kinds.indexOf(spId) < 0) S.kinds.push(spId);
  tankSay(d.e + ' ' + d.name + ' теперь живёт у тебя!');
  save(); renderAll();
  return true;
}
function sellPrice(f) {
  var d = spDef(f.sp);
  var base = d.buy * 0.4 + (d.adult - d.buy * 0.4) * f.prog;
  return Math.round(base * (1 + sellBonus() / 100));
}
function sellFish(id) {
  var i = -1; for (var j=0;j<S.fish.length;j++) if (S.fish[j].id===id) i = j;
  if (i < 0) return false;
  var f = S.fish[i], price = sellPrice(f);
  S.coins += price; S.prog.earn += price; S.prog.sell += 1;
  removeFishEl(f);
  S.fish.splice(i, 1);
  tankSay('Продано за ' + price + ' 🪙');
  save(); renderAll();
  return true;
}
function feedAll() {
  if (S.feed <= 0) { tankSay('Корм кончился! Купи в магазине 🍽️'); return false; }
  if (S.fish.length === 0) { tankSay('Сначала купи рыбок в магазине 🐠'); return false; }
  S.feed -= 1;
  S.fedUntil = Date.now() + 30 * 60 * 1000;
  S.prog.feed += 1;
  tankSay('Ням-ням! Рыбки сыты и растут вдвое быстрее 🍽️');
  save(); renderAll();
  return true;
}
function cleanTank() {
  S.clean = 100;
  tankSay('Блестит! Чистая водичка 🧽✨');
  save(); renderAll();
  return true;
}
function buyFeed() {
  if (S.coins < FEED_PACK.price) { tankSay('Не хватает монет 🪙'); return false; }
  S.coins -= FEED_PACK.price; S.feed += FEED_PACK.count;
  save(); renderAll();
  return true;
}
function buyDecor(id) {
  var d = null; DECORS.forEach(function(x){ if (x.id===id) d = x; });
  if (!d || S.decors.indexOf(id) >= 0 || S.coins < d.price) return false;
  S.coins -= d.price; S.decors.push(id);
  save(); renderAll();
  return true;
}
function buyTank() {
  var next = TANKS[S.tank + 1];
  if (!next || S.coins < next.price) return false;
  S.coins -= next.price; S.tank += 1;
  tankSay('Новый дом для рыбок: ' + next.name + '! 🎉');
  save(); renderAll();
  return true;
}
function claimTask(id) {
  var t = null; TASKS.forEach(function(x){ if (x.id===id) t = x; });
  if (!t) return;
  var ti = S.tier[id] || 0;
  if (ti >= t.tiers.length) return;
  var val = (id === 'kinds') ? S.kinds.length : (S.prog[id] || 0);
  if (val < t.tiers[ti]) return;
  S.coins += t.rewards[ti]; S.tier[id] = ti + 1;
  save(); renderAll();
}
function claimDaily() {
  ensureDaily();
  if (S.daily.claimed) return;
  var d = dailyDef();
  if (dailyProg() < d.target) return;
  S.coins += d.reward; S.daily.claimed = true;
  save(); renderAll();
}
/* ============ ОТРИСОВКА ============ */
var tank = $('tank');
var sayTimer = null;
function tankSay(txt) {
  var m = $('tankMsg');
  m.textContent = txt; m.style.opacity = '1';
  if (sayTimer) clearTimeout(sayTimer);
  sayTimer = setTimeout(function(){ m.style.opacity = '0'; }, 2400);
}
function fishSize(f) { return Math.round(24 + f.prog * 18); }
function createFishEl(f) {
  var el = document.createElement('div');
  el.className = 'fish';
  el.textContent = spDef(f.sp).e;
  tank.appendChild(el);
  f.el = el;
  drawFish(f, 0);
}
function removeFishEl(f) { if (f.el && f.el.parentNode) f.el.parentNode.removeChild(f.el); f.el = null; }
function drawFish(f, t) {
  if (!f.el) return;
  var bob = Math.sin(t / 600 + f.ph) * 1.2;
  f.el.style.left = f.x + '%';
  f.el.style.top = (f.y + bob) + '%';
  f.el.style.fontSize = fishSize(f) + 'px';
  var flip = f.vx > 0 ? -1 : 1;   /* рыбки смотрят влево — разворачиваем по движению */
  f.el.style.transform = 'translate(-50%,-50%) scaleX(' + flip + ')';
}
function renderDecors() {
  var old = tank.querySelectorAll ? tank.querySelectorAll('.decor') : [];
  for (var i = 0; i < old.length; i++) if (old[i].parentNode) old[i].parentNode.removeChild(old[i]);
  DECORS.forEach(function(dc){
    if (S.decors.indexOf(dc.id) < 0) return;
    var el = document.createElement('div');
    el.className = 'decor';
    el.textContent = dc.e;
    el.style.left = dc.left;
    el.style.fontSize = '30px';
    tank.appendChild(el);
  });
}
function renderHUD() {
  $('hudCoins').textContent = S.coins;
  $('hudFish').textContent = S.fish.length + '/' + tankCap();
  $('hudFeed').textContent = S.feed;
  $('hudClean').textContent = Math.round(S.clean) + '%';
  tank.className = S.clean < 30 ? 'dirty' : '';
  tank.id = 'tank';
  $('feedBtn').disabled = S.feed <= 0 || S.fish.length === 0;
  $('feedBtn').textContent = Date.now() < S.fedUntil ? '🍽️ Сыты! Растут x2' : '🍽️ Покормить';
}
function stageName(f) {
  if (f.prog >= 1) return 'взрослая ✨ — можно продавать дорого';
  if (f.prog >= 0.45) return 'подросшая';
  return 'малёк';
}
function renderFishList() {
  var h = '';
  if (S.fish.length === 0) h = '<div class="row"><div class="tx">Пока пусто. Купи первую рыбку в магазине 🛒 — на старте у тебя 100 монет</div></div>';
  S.fish.forEach(function(f){
    var d = spDef(f.sp);
    h += '<div class="row"><div class="ic">' + d.e + '</div><div class="tx"><b>' + d.name + '</b> · ' + stageName(f) +
      '<div class="bar"><i style="width:' + Math.round(f.prog * 100) + '%"></i></div>' +
      '<small>Рост: ' + Math.round(f.prog * 100) + '% · цена сейчас: ' + sellPrice(f) + ' 🪙 (взрослая — ' + d.adult + ')</small></div>' +
      '<button class="act" onclick="sellFish(' + f.id + ')">Продать ' + sellPrice(f) + ' 🪙</button></div>';
  });
  $('panel-fish').innerHTML = h;
}
function renderShop() {
  var h = '';
  h += '<div class="row"><div class="ic">🍽️</div><div class="tx"><b>Пачка корма</b> · ' + FEED_PACK.count + ' порций<small>Сытые рыбки растут вдвое быстрее (30 минут)</small></div>' +
    '<button class="act" ' + (S.coins >= FEED_PACK.price ? '' : 'disabled') + ' onclick="buyFeed()">Купить ' + FEED_PACK.price + ' 🪙</button></div>';
  SPECIES.forEach(function(d){
    var full = S.fish.length >= tankCap();
    h += '<div class="row"><div class="ic">' + d.e + '</div><div class="tx"><b>' + d.name + '</b><small>Растёт ' + d.growMin + ' мин · взрослая стоит ' + d.adult + ' 🪙' + (d.cleaner ? ' · чистит аквариум' : '') + '</small></div>' +
      '<button class="act" ' + ((S.coins >= d.buy && !full) ? '' : 'disabled') + ' onclick="buyFish(\'' + d.id + '\')">Купить ' + d.buy + ' 🪙</button></div>';
  });
  DECORS.forEach(function(dc){
    var owned = S.decors.indexOf(dc.id) >= 0;
    var bonus = (dc.growBonus ? 'рост +' + dc.growBonus + '%' : '') + (dc.sellBonus ? 'продажа +' + dc.sellBonus + '%' : '');
    h += '<div class="row"><div class="ic">' + dc.e + '</div><div class="tx"><b>' + dc.name + '</b><small>Украшение · ' + bonus + '</small></div>' +
      (owned ? '<button class="act" disabled>Стоит ✔️</button>' : '<button class="act" ' + (S.coins >= dc.price ? '' : 'disabled') + ' onclick="buyDecor(\'' + dc.id + '\')">Купить ' + dc.price + ' 🪙</button>') + '</div>';
  });
  var next = TANKS[S.tank + 1];
  if (next) {
    h += '<div class="row"><div class="ic">🏠</div><div class="tx"><b>' + next.name + '</b><small>Влезает рыбок: ' + next.cap + ' (сейчас ' + tankCap() + ')</small></div>' +
      '<button class="act" ' + (S.coins >= next.price ? '' : 'disabled') + ' onclick="buyTank()">Купить ' + next.price + ' 🪙</button></div>';
  } else {
    h += '<div class="row"><div class="ic">🏠</div><div class="tx"><b>Океанариум</b><small>Самый большой дом для рыбок ✔️</small></div></div>';
  }
  $('panel-shop').innerHTML = h;
}
function renderTasks() {
  ensureDaily();
  var h = '';
  var dd = dailyDef(), dp = dailyProg();
  h += '<div class="row"><div class="ic">📅</div><div class="tx"><b>Задание дня:</b> ' + dd.name +
    '<small>Награда: ' + dd.reward + ' 🪙 · прогресс: ' + dp + ' / ' + dd.target + '</small>' +
    '<div class="bar"><i style="width:' + Math.round(100 * dp / dd.target) + '%"></i></div></div>' +
    (S.daily.claimed ? '<button class="act" disabled>Взято ✔️</button>' : '<button class="act" ' + (dp >= dd.target ? '' : 'disabled') + ' onclick="claimDaily()">Забрать ' + dd.reward + ' 🪙</button>') + '</div>';
  TASKS.forEach(function(t){
    var ti = S.tier[t.id] || 0;
    var val = (t.id === 'kinds') ? S.kinds.length : (S.prog[t.id] || 0);
    if (ti >= t.tiers.length) {
      h += '<div class="row"><div class="ic">' + t.icon + '</div><div class="tx">' + t.name + '<small>Все награды взяты ✔️</small></div></div>';
      return;
    }
    var target = t.tiers[ti], prog = Math.min(target, val);
    h += '<div class="row"><div class="ic">' + t.icon + '</div><div class="tx">' + t.name +
      '<small>Награда: ' + t.rewards[ti] + ' 🪙 · прогресс: ' + prog + ' / ' + target + '</small>' +
      '<div class="bar"><i style="width:' + Math.round(100 * prog / target) + '%"></i></div></div>' +
      '<button class="act" ' + (prog >= target ? '' : 'disabled') + ' onclick="claimTask(\'' + t.id + '\')">Забрать ' + t.rewards[ti] + ' 🪙</button></div>';
  });
  $('panel-tasks').innerHTML = h;
}
function renderAll() { renderHUD(); renderFishList(); renderShop(); renderTasks(); renderDecors(); }
function openTab(name) {
  ['fish','shop','tasks'].forEach(function(t){
    $('panel-' + t).style.display = (t === name) ? 'block' : 'none';
    $('tabbtn-' + t).className = 'tabbtn' + (t === name ? ' on' : '');
  });
  if (name === 'fish') renderFishList();
  if (name === 'shop') renderShop();
  if (name === 'tasks') renderTasks();
}

/* ============ ЦИКЛЫ ============ */
var lastFrame = 0;
function swim(ts) {
  var dt = Math.min(0.05, lastFrame ? (ts - lastFrame) / 1000 : 0.016);
  lastFrame = ts;
  S.fish.forEach(function(f){
    f.x += f.vx * dt;
    f.vy = Math.sin(ts / 900 + f.ph) * 4;
    f.y += f.vy * dt;
    if (f.x < 4) { f.x = 4; f.vx = Math.abs(f.vx); }
    if (f.x > 96) { f.x = 96; f.vx = -Math.abs(f.vx); }
    if (f.y < 10) f.y = 10;
    if (f.y > 84) f.y = 84;
    drawFish(f, ts);
  });
  requestAnimationFrame(swim);
}
setInterval(function(){ advanceTime(1); renderHUD(); }, 1000);
setInterval(function(){ renderFishList(); save(); }, 5000);
setInterval(function(){
  var b = document.createElement('div');
  b.className = 'bubble';
  var sz = 4 + Math.random() * 8;
  b.style.width = sz + 'px'; b.style.height = sz + 'px';
  b.style.left = (5 + Math.random() * 90) + '%';
  b.style.bottom = '24px';
  b.style.animationDuration = (4 + Math.random() * 3) + 's';
  tank.appendChild(b);
  setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 7500);
}, 900);
document.addEventListener('visibilitychange', function(){ if (document.hidden) save(); });

/* ---- старт ---- */
ensureDaily();
offlineProgress();
S.fish.forEach(createFishEl);
renderAll();
requestAnimationFrame(swim);
window.__aqua = { S:S, buyFish:buyFish, sellFish:sellFish, feedAll:feedAll, cleanTank:cleanTank, buyFeed:buyFeed, buyDecor:buyDecor, buyTank:buyTank, claimTask:claimTask, claimDaily:claimDaily, advanceTime:advanceTime, sellPrice:sellPrice, tankCap:tankCap, offlineProgress:offlineProgress };
</script>
