<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тетрис — E.Y.L Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#141432,#1d2b53);color:#fff;font-family:Verdana,sans-serif;min-height:100vh;text-align:center;padding:14px 10px 24px}
a.back{color:#aef;font-size:14px;text-decoration:none}
h1{font-size:28px;color:#ffd23f;text-shadow:2px 2px 0 #b8860b;margin:10px 0 4px}
.score{font-size:17px;margin:6px 0 10px}.score b{color:#ffd23f}
.wrap{display:flex;justify-content:center;gap:12px;align-items:flex-start}
canvas{background:#0d0d26;border:3px solid #ffd23f;border-radius:14px;touch-action:none}
#next{width:80px;height:80px}
.side{font-size:13px;color:#dde}.side div{margin-top:8px}
#msg{font-size:18px;min-height:26px;margin:10px 0;color:#ffd23f}
button{background:#ffd23f;color:#1a1a2e;border:0;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #b8860b}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b}
.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px auto 0;max-width:420px}
.pad button{padding:0;width:62px;height:54px;font-size:24px}
.pad button.wide{width:132px}
.hint{color:#89a;font-size:12px;margin-top:14px}
</style></head><body>
<a class="back" href="../">← E.Y.L Games</a>
<h1>🧩 ТЕТРИС</h1>
<div class="score">Счёт: <b id="sc">0</b> • Линии: <b id="ln">0</b> • Рекорд: <b id="best">0</b></div>
<div class="wrap">
<canvas id="c" width="240" height="480"></canvas>
<div class="side">Следующая:<canvas id="next" width="80" height="80"></canvas><div>Уровень: <b id="lv">1</b></div></div>
</div>
<div id="msg">Нажми «Играть»!</div>
<button id="start" onclick="startGame()">▶ Играть</button>
<div class="pad">
<button onclick="move(-1)">⬅️</button><button onclick="rotate()">🔄</button><button onclick="move(1)">➡️</button>
<button onclick="softDrop()">⬇️</button><button class="wide" onclick="hardDrop()">⏬ Сброс</button>
</div>
<div class="hint">Клавиатура: ← → двигать, ↑ повернуть, ↓ ускорить, пробел — сброс • Телефон: кнопки снизу или свайп по полю</div>
<script>
var COLS=10,ROWS=20,S=24;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var nx=document.getElementById('next'),nctx=nx.getContext('2d');
var SHAPES={
 I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],
 Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]
};
var COLORS={I:'#00e5ff',O:'#ffd23f',T:'#c44dff',S:'#32cd32',Z:'#ff4d4d',J:'#4d7dff',L:'#ff8c1a'};
var board,cur,next,score,lines,level,best=+(localStorage.getItem('eyl_tetris_best')||0),timer,over=false,started=false;
document.getElementById('best').textContent=best;
function newPiece(){
  var ks=Object.keys(SHAPES),k=ks[Math.floor(Math.random()*ks.length)];
  return {k:k,shape:SHAPES[k].map(function(r){return r.slice();}),x:3,y:0};
}
function collide(p,dx,dy,shape){
  shape=shape||p.shape;
  for(var y=0;y<shape.length;y++)for(var x=0;x<shape[y].length;x++){
    if(!shape[y][x])continue;
    var nx2=p.x+x+dx,ny=p.y+y+dy;
    if(nx2<0||nx2>=COLS||ny>=ROWS)return true;
    if(ny>=0&&board[ny][nx2])return true;
  }
  return false;
}
function merge(){
  cur.shape.forEach(function(row,y){row.forEach(function(v,x){if(v)board[cur.y+y][cur.x+x]=cur.k;});});
}
function clearLines(){
  var n=0;
  for(var y=ROWS-1;y>=0;y--){
    if(board[y].every(function(v){return v;})){board.splice(y,1);board.unshift(new Array(COLS).fill(0));n++;y++;}
  }
  if(n){lines+=n;score+=[0,100,300,500,800][n]*level;
    level=Math.floor(lines/10)+1;
    document.getElementById('ln').textContent=lines;
    document.getElementById('lv').textContent=level;
    document.getElementById('sc').textContent=score;
    if(score>best){best=score;localStorage.setItem('eyl_tetris_best',best);document.getElementById('best').textContent=best;}
    clearInterval(timer);timer=setInterval(step,Math.max(120,600-(level-1)*50));
  }
}
function spawn(){
  cur=next;next=newPiece();
  if(collide(cur,0,0)){clearInterval(timer);over=true;
    document.getElementById('msg').textContent='💥 Игра окончена! Счёт: '+score;
    document.getElementById('start').textContent='↻ Ещё раз';}
  draw();
}
function step(){if(!collide(cur,0,1))cur.y++;else{merge();clearLines();spawn();}draw();}
function drawCell(c,x,y,s){
  c.fillStyle=COLORS[board[y]&&board[y][x]||cur.k];c.fillRect(x*s+1,y*s+1,s-2,s-2);
}
function draw(){
  ctx.fillStyle='#0d0d26';ctx.fillRect(0,0,240,480);
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(board[y][x]){
    ctx.fillStyle=COLORS[board[y][x]];ctx.fillRect(x*S+1,y*S+1,S-2,S-2);
  }
  if(cur)cur.shape.forEach(function(row,y){row.forEach(function(v,x){
    if(v){ctx.fillStyle=COLORS[cur.k];ctx.fillRect((cur.x+x)*S+1,(cur.y+y)*S+1,S-2,S-2);}});});
  nctx.fillStyle='#0d0d26';nctx.fillRect(0,0,80,80);
  if(next)next.shape.forEach(function(row,y){row.forEach(function(v,x){
    if(v){nctx.fillStyle=COLORS[next.k];nctx.fillRect(x*20+10,y*20+10,18,18);}});});
}
function move(dx){if(started&&!over&&!collide(cur,dx,0))cur.x+=dx;draw();}
function rotate(){
  if(!started||over)return;
  var r=cur.shape[0].map(function(_,i){return cur.shape.map(function(row){return row[i];}).reverse();});
  if(!collide(cur,0,0,r))cur.shape=r;draw();
}
function softDrop(){if(started&&!over)step();}
function hardDrop(){if(!started||over)return;while(!collide(cur,0,1))cur.y++;step();}
function startGame(){
  board=[];for(var y=0;y<ROWS;y++)board.push(new Array(COLS).fill(0));
  score=0;lines=0;level=1;over=false;started=true;
  document.getElementById('sc').textContent=0;document.getElementById('ln').textContent=0;document.getElementById('lv').textContent=1;
  document.getElementById('msg').textContent='Удачи! 🧩';document.getElementById('start').textContent='↻ Заново';
  next=newPiece();spawn();clearInterval(timer);timer=setInterval(step,600);
}
document.addEventListener('keydown',function(e){
  if(!started||over)return;
  if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='ArrowRight')move(1);
  else if(e.key==='ArrowDown')softDrop();
  else if(e.key==='ArrowUp')rotate();
  else if(e.key===' '){hardDrop();e.preventDefault();}
  if(e.key.indexOf('Arrow')===0)e.preventDefault();
});
var tx,ty;
cv.addEventListener('touchstart',function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
cv.addEventListener('touchend',function(e){
  if(!started){startGame();return;}
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>20)move(dx>0?1:-1);}
  else if(dy>30)softDrop();else if(dy<-20)rotate();
},{passive:true});
board=[];for(var i=0;i<ROWS;i++)board.push(new Array(COLS).fill(0));
cur=null;next=newPiece();draw();
</script></body></html>
