  @keyframes rinsePulse { 0%,100% { transform:translateX(-50%) scale(1); } 50% { transform:translateX(-50%) scale(1.06); } }
  .bubble:after { content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); border:8px solid transparent; border-top-color:#fff; border-bottom:0; }
  .bubble.show { opacity:1; }
  .timer { position:absolute; right:10px; top:10px; background:rgba(0,0,0,.55); color:#ffe259; font-weight:700; border-radius:10px; padding:4px 10px; font-size:15px; display:none; z-index:5; }

  .fill-hunger { background:linear-gradient(90deg,#ff8a5c,#ffb35c); }
  .fill-clean  { background:linear-gradient(90deg,#4dc3ff,#5ce1e6); }

  .tabs { display:flex; gap:6px; margin:12px 0 8px; }

  .hint { font-size:13px; color:#aab; text-align:center; margin-top:6px; line-height:1.45; }
  .overlay { position:fixed; inset:0; background:#0d0f1a; z-index:50; display:flex; align-items:center; justify-content:center; padding:18px; overflow-y:auto; }

function loadSave(){
  try {
    var raw = localStorage.getItem('eyl-pet-v1');
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    var d = JSON.parse(raw);
    var out = JSON.parse(JSON.stringify(DEF));
    for(var k in DEF){ if(d[k] !== undefined) out[k] = d[k]; }
    return out;
  } catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(){
  S.lastSeen = Date.now();
  try { localStorage.setItem('eyl-pet-v1', JSON.stringify(S)); } catch(e){}
}

/* офлайн-прогресс: шкалы падают, пока страницы не было */
(function offline(){
  var dtMin = (Date.now() - (S.lastSeen || Date.now())) / 60000;
  if(dtMin < 1) return;
  if(dtMin > 480) dtMin = 480;
  if(S.sleeping){
    S.energy = clamp(S.energy + 2.2 * dtMin, 0, 100);
    S.hunger = clamp(S.hunger - 0.12 * dtMin, 3, 100);
    S.clean  = clamp(S.clean  - 0.05 * dtMin, 3, 100);
    S.fun    = clamp(S.fun    - 0.08 * dtMin, 3, 100);
    if(S.energy >= 100) S.sleeping = false;
  } else {
    S.hunger = clamp(S.hunger - 0.30 * dtMin, 3, 100);
    S.clean  = clamp(S.clean  - 0.14 * dtMin, 3, 100);
    S.energy = clamp(S.energy - 0.20 * dtMin, 3, 100);
    S.fun    = clamp(S.fun    - 0.22 * dtMin, 3, 100);
  }
})();

/* ---------- УРОВНИ И РОСТ ---------- */
function levelInfo(){
  var lvl = 1, need = 60, acc = 0;
  while(S.xp >= acc + need && lvl < 99){ acc += need; lvl++; need = 60 + lvl * 20; }
  return { lvl:lvl, into:S.xp - acc, need:need };
}
function stageInfo(){
  var l = levelInfo().lvl, base;
  if(l < 3)       base = { n:'Малыш',     s:0.72 };
  else if(l < 6)  base = { n:'Подросток', s:0.87 };
  else if(l < 10) base = { n:'Взрослый',  s:1.0  };
  else            base = { n:'Большой',   s:1.14 };
  if(fx.big > 0)        base = { n:base.n + ' · огромный', s:base.s * 1.45 };
  else if(fx.small > 0) base = { n:base.n + ' · кроха',    s:base.s * 0.6  };
  return base;
}
function addXp(n){
  var before = levelInfo().lvl;
  S.xp += n;
  var after = levelInfo().lvl;
  if(after > before){
    var bonus = 25 * after;
    S.coins += bonus;
    say('🎉 Новый уровень ' + after + '! +' + bonus + ' 🪙');
    sndWin();
    burstHearts(10);
  }
  updateHUD();
}
function mood(){
  if(S.sleeping) return '💤';
  if(S.sick) return '🤒';
  var avg = (S.hunger + S.clean + S.energy + S.fun) / 4;
  if(avg >= 70) return '😊';
  if(avg >= 45) return '🙂';
  if(avg >= 25) return '😟';
  return '😢';
}

/* ---------- ЗВУК (WebAudio) ---------- */
var AC = null;
function ac(){ if(!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if(AC && AC.state === 'suspended') AC.resume(); return AC; }
function beep(f, d, type, delay, vol){
  var c = ac(); if(!c) return;
  var t = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + d + 0.02);
}

function petGeom(){
  var st = stageInfo();
  var R = Math.min(W, H) * 0.30 * st.s;
  var groundY = H - 34;
  var cx = W / 2;
  if(game.active) cx = game.petX;
  if(room === 'street' && walk.on) cx = walk.x;
  var bob = Math.sin(performance.now() / 550) * 3;
  var jump = 0;
  if(jumpT >= 0) jump = -Math.sin(jumpT * Math.PI) * R * 0.45;
  var cy = groundY - R * 0.85 + bob + jump;
  return { R:R, cx:cx, cy:cy, groundY:groundY };
}

      var by = floorY - ((t / 45 + b2 * 53) % Math.max(floorY - 36, 20)) - 8;

      ctx.fillStyle = 'rgba(255,255,255,.20)'; ctx.fill();
    }
  } else if(room === 'bedroom'){
    rr(W - 100, 12, 86, 62, 8, '#0d1b38'); rr(W - 96, 16, 78, 54, 6, '#16264d');
    emj('🌙', W - 72, 34, 22);
    ctx.fillStyle = '#fff';
    for(var s3 = 0; s3 < 7; s3++){ ctx.globalAlpha = 0.5 + ((s3 * 31) % 10) / 20; ctx.fillRect(W - 90 + (s3 * 23) % 66, 22 + (s3 * 17) % 44, 2, 2); }
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(38, 42, 26, 0, Math.PI * 2);

    emj('💡', 38, 42, 25);
  } else if(room === 'game'){

    emj('🎮', W / 2, 40, 26, 0.85);
  } else if(room === 'wardrobe'){
    rr(W - 78, 10, 62, floorY - 24, 12, 'rgba(224,208,255,.88)');
    ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W - 62, floorY - 40); ctx.lineTo(W - 34, 30); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(12, 28); ctx.lineTo(122, 28); ctx.stroke();
    emj('👗', 34, 50, 25, 0.95); emj('👕', 68, 50, 25, 0.95); emj('🧥', 102, 50, 25, 0.95);
  } else if(room === 'lab'){
    rr(10, 28, 124, 5, 2, 'rgba(0,0,0,.30)');
    emj('🧪', 30, 16, 21, 0.95); emj('⚗️', 58, 16, 21, 0.95); emj('🔬', 90, 16, 23, 0.95); emj('🧫', 118, 16, 19, 0.95);
    rr(W - 86, 14, 70, 52, 6, 'rgba(255,255,255,.10)');
    emj('🧬', W - 51, 40, 25, 0.9);
    emj('🌡️', 30, floorY - 16, 22, 0.9);
  }
  /* пол */
  ctx.fillStyle = th[2]; ctx.fillRect(0, floorY, W, 34);
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(0, floorY, W, 3);
  if(room === 'bath' || room === 'lab'){
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(var fx3 = 23; fx3 < W; fx3 += 46){ ctx.moveTo(fx3, floorY); ctx.lineTo(fx3, H); }
    ctx.moveTo(0, floorY + 17); ctx.lineTo(W, floorY + 17);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    for(var px = 23; px < W; px += 46){ ctx.moveTo(px, floorY + 3); ctx.lineTo(px, H); }
    ctx.stroke();
  }
  /* коврик под питомцем */
  if(room !== 'bath'){

}

function drawScene(t){
  drawRoomBg(t);
  /* душ — капли */
  if(showerOn && room === 'bath'){
    var pg = petGeom();
    for(var i = 0; i < 3; i++){
      drops.push({ x:pg.cx + (Math.random() - 0.5) * pg.R * 1.7, y:10 + Math.random() * 20, vy:5 + Math.random() * 3 });
    }
    ctx.strokeStyle = 'rgba(140,210,255,.85)'; ctx.lineWidth = 2;
    ctx.font = '34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🚿', pg.cx, 26);
    drops = drops.filter(function(d){ return d.y < pg.cy + pg.R * 0.6; });
    drops.forEach(function(d){
      d.y += d.vy;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 1, d.y + 11); ctx.stroke();
    });
  } else { drops = []; }
  /* мини-игра: падающие предметы */
  if(game.active){
    game.items.forEach(function(it){
      ctx.font = '34px "Segoe UI Emoji", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(it.e, it.x, it.y);
    });
  }
  /* мячик */
  if(ball){
    ctx.font = '36px "Segoe UI Emoji", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🏀', ball.x, ball.y);
  }
  drawPet(t);
  /* бабочки на улице */
  if(room === 'street'){
    flies.forEach(function(f){
      emj('🦋', f.x + Math.sin(t / 300 + f.ph) * 10, f.y + Math.sin(t / 170 + f.ph) * 7, 26);
    });
  }
  /* шарики второй мини-игры */
  if(game2.active){
    game2.items.forEach(function(it){
      emj(it.e, it.x + Math.sin(it.ph * 6 + it.y / 40) * 6, it.y, 36);
    });
  }
  /* летящая еда */
  if(flyFood){
    ctx.font = '40px "Segoe UI Emoji", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(flyFood.e, flyFood.x, flyFood.y);
  }
  /* сердечки */
  hearts = hearts.filter(function(h){ return h.life > 0; });
  hearts.forEach(function(h){
    h.y += h.vy; h.x += h.vx; h.life -= 0.012;
    ctx.globalAlpha = Math.max(h.life, 0);
    ctx.font = '20px "Segoe UI Emoji", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('❤️', h.x, h.y);
    ctx.globalAlpha = 1;
  });
  /* Zzz */
  if(S.sleeping){
    zzzT -= 16;
    if(zzzT <= 0){ zzzT = 700; var pg2 = petGeom(); zzzs.push({ x:pg2.cx + pg2.R * 0.7, y:pg2.cy - pg2.R, life:1, s:16 }); }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
    zzzs = zzzs.filter(function(z){ return z.life > 0; });
    zzzs.forEach(function(z){
      z.y -= 0.5; z.x += 0.25; z.life -= 0.008; z.s += 0.25;
      ctx.globalAlpha = Math.max(z.life, 0);
      ctx.fillStyle = '#cfe4ff';
      ctx.font = 'bold ' + z.s + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Z', z.x, z.y);
      ctx.globalAlpha = 1;
    });
  } else { zzzs = []; }
}

var lastFrame = performance.now();
function loop(now){
  var dt = Math.min(now - lastFrame, 100); lastFrame = now;
  /* моргание */
  if(blinkT > 0){ blinkT -= dt; } else { nextBlink -= dt; if(nextBlink <= 0){ blinkT = 130; nextBlink = 2200 + Math.random() * 3000; } }
  /* прыжок и жевание */
  if(jumpT >= 0){ jumpT += dt / 380; if(jumpT >= 1) jumpT = -1; }
  if(eatT >= 0){ eatT += dt / 900; if(eatT >= 1) eatT = -1; }
  if(shakeT > 0) shakeT -= dt;
  /* летящая еда */
  if(flyFood){
    flyFood.t += dt / 480;
    var g = petGeom();
    var tx = g.cx, ty = g.cy + g.R * 0.28;
    flyFood.x += (tx - flyFood.x) * 0.22;
    flyFood.y += (ty - flyFood.y) * 0.22 - 1.2;
    if(flyFood.t >= 1){ flyFood = null; eatT = 0; sndNom(); }
  }
  /* мячик */
  if(ball){
    ball.t += dt / 1000;
    ball.vy += 0.55; ball.x += ball.vx; ball.y += ball.vy;
    var fl = H - 52;
    if(ball.y > fl){ ball.y = fl; ball.vy = -Math.abs(ball.vy) * 0.72; ball.bounces++; if(jumpT < 0 && !S.sleeping) jumpT = 0; sndPop(); }
    if(ball.x < 22 || ball.x > W - 22) ball.vx = -ball.vx;
    if(ball.t > 4 || ball.bounces > 5) ball = null;
  }
  /* душ: смываем пену и грязь */
  if(showerOn && room === 'bath' && !S.sleeping){
    washAcc += dt;
    if(washAcc > 420){
      washAcc = 0;
      if(foam > 0){ foam--; S.clean = clamp(S.clean + 5, 0, 100); if(Math.random() < 0.5) sndSplash(); }
      else { S.clean = clamp(S.clean + 0.8, 0, 100); }
      if(foam === 0 && !washedBonus && S.clean > 60){ washedBonus = true; }
      updateHUD(); renderPanel();
    }
  }
  /* тряска */
  ctx.save();
  if(shakeT > 0) ctx.translate((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9);
  drawScene(now);
  ctx.restore();
  /* мини-игра шаг */
  if(game.active) stepGame(dt);
  if(game2.active) stepGame2(dt);
  /* прогулка по улице: питомец ходит, бабочки появляются */
  if(room === 'street' && walk.on && !S.sleeping){
    walk.x += walk.dir * dt * 0.055;
    var wg = petGeom();
    if(walk.x > W - wg.R * 0.8){ walk.x = W - wg.R * 0.8; walk.dir = -1; }
    if(walk.x < wg.R * 0.8){ walk.x = wg.R * 0.8; walk.dir = 1; }
    flyAcc += dt;
    if(flyAcc > 2400 && flies.length < 3){
      flyAcc = 0;
      flies.push({ x:40 + Math.random() * (W - 80), y:54 + Math.random() * 80, ph:Math.random() * 6.28 });
    }
  }
  if(room !== 'street' && flies.length) flies = [];
  /* большая кнопка душа прямо на сцене: видна ВСЕГДА в ванной, пока душ выключен */
  var rb = $('btnRinse');
  if(rb){
    var showRb = (room === 'bath' && !showerOn && !S.sleeping);
    rb.style.display = showRb ? 'block' : 'none';
    if(showRb) rb.textContent = foam > 0 ? '🚿 Смыть пену' : '🚿 Душ — помыть';
  }
  requestAnimationFrame(loop);
}
var washAcc = 0;

/* ---------- МИНИ-ИГРА «ПОЙМАЙ ЯБЛОКО» ---------- */
var game = { active:false, timeLeft:45, score:0, earned:0, items:[], spawnAcc:0, petX:200 };
function startGame(){
  if(S.sleeping){ say('Тсс… он спит 💤'); return; }
  if(S.sick){ say('Я болею… 🤒 Сначала лекарство в лаборатории!'); return; }
  if(game2.active) stopGame2(false);
  game.active = true; game.timeLeft = 45; game.score = 0; game.earned = 0;
  game.items = []; game.spawnAcc = 0; game.petX = W / 2;
  $('timer').style.display = 'block';
  say('Лови яблоки 🍎! Мусор не лови!');
  sndPop(); renderPanel();
}
function stopGame(finished){
  game.active = false; game.items = [];
  $('timer').style.display = 'none';
  if(finished){
    addXp(5 + Math.floor(game.score / 3));
    say('🏁 Игра окончена! Очки: ' + game.score + ', монет: +' + game.earned + ' 🪙');
    sndWin();
  }
  renderPanel(); save();
}
function stepGame(dt){
  game.timeLeft -= dt / 1000;
  $('timer').textContent = '⏰ ' + Math.max(0, Math.ceil(game.timeLeft)) + ' · ⭐ ' + game.score + ' · 🪙 +' + game.earned;
  if(game.timeLeft <= 0){ stopGame(true); return; }
  game.spawnAcc += dt;
  if(game.spawnAcc > 640){
    game.spawnAcc = 0;
    var bad = Math.random() < 0.22;
    game.items.push({ x:30 + Math.random() * (W - 60), y:-20,
                      vy:1.7 + Math.random() * 1.3 + (45 - game.timeLeft) * 0.014,
                      e: bad ? (Math.random() < 0.5 ? '💣' : '🧦') : '🍎', bad:bad });
  }
  var g = petGeom();
  if(pointerX !== null) game.petX += (pointerX - game.petX) * 0.3;
  game.petX = clamp(game.petX, g.R * 0.7, W - g.R * 0.7);
  game.items = game.items.filter(function(it){
    it.y += it.vy * (dt / 16.7);
    var caught = it.y > g.cy - g.R * 0.3 && it.y < g.cy + g.R * 0.9 && Math.abs(it.x - game.petX) < g.R * 0.95;
    if(caught){
      if(it.bad){ game.score = Math.max(0, game.score - 3); shakeT = 260; sndBad(); say('Фу, мусор! 🤢'); }
      else { game.score++; game.earned += 2; S.coins += 2; S.fun = clamp(S.fun + 1.2, 0, 100); sndCoin(); burstHearts(1); }
      updateHUD();
      return false;
    }
    return it.y < H + 30;
  });
}

/* ---------- ДЕЙСТВИЯ ---------- */
function blocked(){ if(S.sleeping){ say('Тсс… он спит 💤 Разбуди его в спальне'); return true; } return false; }
function sickBlock(){ if(S.sick){ say('Я болею… 🤒 Лекарство — в лаборатории 🧪'); return true; } return false; }

function feed(id){
  if(blocked()) return;
  var f = FOODS.filter(function(x){ return x.id === id; })[0];
  if(!f) return;
  var lvl = levelInfo().lvl;
  if(lvl < f.lvl){ say('Откроется на уровне ' + f.lvl + ' 🔒'); return; }
  if(S.hunger >= 98){ say('Я сыт! Больше не влезет 😋'); return; }
  if(!S.stock) S.stock = {};
  if((S.stock[id] || 0) <= 0){ say('В холодильнике пусто! Купи еду в магазине 🛒'); sndBad(); setRoom('shop'); return; }
  if(flyFood) return;
  S.stock[id] -= 1;
  S.hunger = clamp(S.hunger + f.hunger, 0, 100);
  S.fun = clamp(S.fun + f.fun, 0, 100);
  if(f.energy) S.energy = clamp(S.energy + f.energy, 0, 100);
  flyFood = { e:f.e, x:W * 0.82, y:H - 50, t:0 };
  if(Math.random() < 0.3) setTimeout(function(){ say('Вкусно! 😋'); }, 600);
  addXp(6); updateHUD(); renderPanel(); save();
}

/* магазин: покупка еды в запас (холодильник), как в Pou */
function buyFood(id){
  if(blocked()) return;
  var f = FOODS.filter(function(x){ return x.id === id; })[0];
  if(!f) return;
  var lvl = levelInfo().lvl;
  if(lvl < f.lvl){ say('Откроется на уровне ' + f.lvl + ' 🔒'); return; }
  if(S.coins < f.price){ say('Не хватает монет! Заработай в игре 🎮'); sndBad(); return; }
  S.coins -= f.price;
  if(!S.stock) S.stock = {};
  S.stock[id] = (S.stock[id] || 0) + 1;
  sndCoin();
  say(f.e + ' ' + f.n + ' — в холодильник! Там уже ' + S.stock[id] + ' шт.');
  addXp(2); updateHUD(); renderPanel(); save();
}

function soapTap(){
  if(blocked()) return;
  if(foam >= 12){ say('Уже весь в пене! Теперь душ 🚿'); return; }
  foam = Math.min(12, foam + 3);
  sndPop();

function buyWear(id){
  if(blocked()) return;
  var h = HATS.filter(function(x){ return x.id === id; })[0];
  if(!h) return;
  var lvl = levelInfo().lvl;
  if(S.owned.indexOf(id) < 0){
    if(lvl < h.lvl){ say('Откроется на уровне ' + h.lvl + ' 🔒'); return; }
    if(S.coins < h.price){ say('Не хватает монет! Заработай в игре 🎮'); sndBad(); return; }
    S.coins -= h.price; S.owned.push(id);
    say('Купили: ' + h.e + ' ' + h.n + '!');

  }
  if(h.kind === 'top') S.wornTop = (S.wornTop === id ? null : id);
  else S.wornEyes = (S.wornEyes === id ? null : id);

}

function buyPotion(id){
  if(blocked()) return;
  var p = POTIONS.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  if(id === 'med' && !S.sick){ say('Я здоров! 😊 Лекарство не нужно'); return; }
  if(S.coins < p.price){ say('Не хватает монет! Заработай в играх 🎮'); sndBad(); return; }
  S.coins -= p.price;
  if(id === 'big'){ fx.big = 60; fx.small = 0; say('Зелье роста! Я большой! 🧪'); }
  else if(id === 'small'){ fx.small = 60; fx.big = 0; say('Зелье уменьшения! Я кроха! 🧪'); }
  else if(id === 'energy'){ S.energy = 100; say('Энергия полная! ⚡'); }
  else if(id === 'food'){ S.hunger = 100; say('Сытый до ушей! 🍔'); }
  else if(id === 'med'){ S.sick = false; say('Выздоровел! ❤️ Спасибо!'); burstHearts(6); }
  else if(id === 'hp1'){ S.sick = false; S.energy = clamp(S.energy + 20, 0, 100); S.fun = clamp(S.fun + 10, 0, 100); say('Зелье здоровья! Мне лучше! ❤️'); burstHearts(4); }
  else if(id === 'hp2'){ S.sick = false; S.hunger = clamp(S.hunger + 30, 0, 100); S.clean = clamp(S.clean + 30, 0, 100); S.energy = clamp(S.energy + 30, 0, 100); S.fun = clamp(S.fun + 30, 0, 100); say('Большое зелье здоровья! Как новенький! ❤️‍🩹'); burstHearts(8); }
  else if(id === 'vit'){ S.immuneUntil = Date.now() + 24 * 3600 * 1000; S.fun = clamp(S.fun + 10, 0, 100); say('Витамины! Сутки болезнь не пристанет 🍋'); }
  else if(id === 'super'){ S.sick = false; S.hunger = 100; S.clean = 100; S.energy = 100; S.fun = 100; S.immuneUntil = Date.now() + 24 * 3600 * 1000; say('Супер-здоровье! Всё на максимуме! 🌟'); burstHearts(10); }
  sndWin(); addXp(3); updateHUD(); renderPanel(); save();
}
function cycleWall(){
  var w = WALLS[room];
  if(!w) return;
  S.wall[room] = ((S.wall[room] || 0) + 1) % w.length;
  sndPop(); save(); renderPanel();
}
var pickChar = null;
function setChar(id){
  pickChar = id; S.char = id;
  renderCharRows();
  if(S.started){
    save();
    var c = CHARS.filter(function(x){ return x.id === id; })[0];
    if(c) say('Теперь я — ' + c.n + '! ' + c.e);
    sndPop();
  }
}
function renderCharRows(){
  var cur = pickChar || S.char || 'swan';
  var html = CHARS.map(function(c){
    return '<button class="' + (cur === c.id ? 'on' : '') + '" title="' + c.n + '" onclick="setChar(\'' + c.id + '\')">' + c.e + '</button>';
  }).join('');
  var a = $('charRowStart'); if(a) a.innerHTML = html;
  var b = $('charRowSet'); if(b) b.innerHTML = html;
}

/* ---------- ИНТЕРФЕЙС ---------- */
function updateHUD(){
  $('hudName').textContent = S.name;
  $('hudMood').textContent = mood();
  var li = levelInfo();
  $('hudLvl').textContent = 'Уровень ' + li.lvl + ' · ' + stageInfo().n + ' · ⭐ ' + li.into + '/' + li.need;
  $('hudCoins').textContent = S.coins;
  var map = [ ['Hunger', S.hunger], ['Clean', S.clean], ['Energy', S.energy], ['Fun', S.fun] ];
  map.forEach(function(m){
    $('v' + m[0]).textContent = Math.round(m[1]);
    var bar = $('b' + m[0]);
    bar.style.width = m[1] + '%';
    if(m[1] < 30) bar.classList.add('low'); else bar.classList.remove('low');
  });
}
/* 👑 президентская казна: 5 нажатий по монетам = +1000 */
(function(){
  var taps = 0, lastTap = 0;
  function bind(){
    var el = $('hudCoins');
    if(!el || !el.parentElement) return;
    el.parentElement.addEventListener('click', function(){
      var now = Date.now();
      if(now - lastTap > 1600) taps = 0;
      lastTap = now; taps++;
      if(taps >= 5){
        taps = 0;
        S.coins += 1000; save(); updateHUD(); sndPop();
        say('👑 Президентская казна: +1000 монет!');
      }
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
})();

function renderTabs(){
  var html = '';
  ROOMS.forEach(function(r){
    html += '<button class="' + (room === r.id ? 'on' : '') + '" onclick="setRoom(\'' + r.id + '\')">' + r.e + '<br>' + r.n + '</button>';
  });
  $('tabs').innerHTML = html;
}
function setRoom(id){
  room = id;
  if(id !== 'bath') showerOn = false;
  if(id !== 'street'){ walk.on = false; flies = []; }
  renderTabs(); renderPanel();
}
function renderPanel(){
  var p = $('panel'), lvl = levelInfo().lvl, html = '';
  if(room === 'kitchen'){
    if(!S.stock) S.stock = {};
    html = '<div class="grid">';
    FOODS.forEach(function(f){
      var lock = lvl < f.lvl, n = S.stock[f.id] || 0, empty = !lock && n <= 0;
      html += '<button class="item' + (lock ? ' lock' : (empty ? ' poor' : '')) + '" onclick="feed(\'' + f.id + '\')">'
            + '<span class="e">' + f.e + '</span>' + f.n + '<br>'
            + '<span class="plus">+' + f.hunger + ' 🍔</span><br>'
            + (lock ? '🔒 ур. ' + f.lvl : (empty ? '<span class="p">пусто · в магазин 🛒</span>' : '<span class="p">📦 в холодильнике: ' + n + '</span>')) + '</button>';
    });
    html += '</div><div class="hint">Это холодильник 🧊 Еда берётся из запасов.<br>Пополнить запасы — в комнате 🛒 Магазин, как в Pou!</div>';
  }
  else if(room === 'shop'){
    if(!S.stock) S.stock = {};
    html = '<div class="grid">';
    FOODS.forEach(function(f){
      var lock = lvl < f.lvl, poor = S.coins < f.price, n = S.stock[f.id] || 0;
      html += '<button class="item' + (lock ? ' lock' : (poor ? ' poor' : '')) + '" onclick="buyFood(\'' + f.id + '\')">'
            + '<span class="e">' + f.e + '</span>' + f.n + '<br>'
            + '<span class="plus">+' + f.hunger + ' 🍔' + (n > 0 ? ' · 📦 ' + n : '') + '</span><br>'
            + (lock ? '🔒 ур. ' + f.lvl : '<span class="p">🪙 ' + f.price + '</span>') + '</button>';
    });
    html += '</div><div class="hint">Магазин E.Y.L 🛒 Нажимай на еду — она упадёт в холодильник на кухне.<br>Потом корми питомца оттуда. Не хватает монет? Загляни в 🎮 Игровую!</div>';
  }
  else if(room === 'bath'){
    html = '<button class="bigbtn" onclick="soapTap()">🧼 Намылить ' + (foam > 0 ? '(пены: ' + foam + ')' : '') + '</button>'
         + '<button class="bigbtn alt" onclick="toggleShower()">' + (showerOn ? '💦 Душ льётся — выключить' : '🚿 Смыть пену (душ)') + '</button>'
         + '<div class="hint">Сначала намыль питомца — можно тапать прямо по нему! 🫧<br>Потом включи душ и смой пену — станет чистым.</div>';
  }
  else if(room === 'bedroom'){
    html = S.sleeping
      ? '<button class="bigbtn" onclick="toggleLamp()">🔆 Разбудить</button><div class="hint">Питомец спит, энергия растёт быстро… 💤</div>'
      : '<button class="bigbtn" onclick="toggleLamp()">💡 Выключить свет — спать!</button><div class="hint">Во сне энергия восстанавливается заметно быстрее.<br>Пока он спит, кормить и играть нельзя.</div>';
  }
  else if(room === 'game'){
    if(game.active){
      html = '<button class="bigbtn" onclick="stopGame(false)">⏹ Закончить игру</button>'
           + '<div class="hint">Двигай питомца пальцем и лови яблоки 🍎 (+2 🪙).<br>💣 и 🧦 — мусор, от него −3 очка!</div>';
    } else if(game2.active){
      html = '<button class="bigbtn" onclick="stopGame2(false)">⏹ Закончить игру</button>'
           + '<div class="hint">Тапай по шарикам 🎈 — каждый +1 🪙. Бомбы 💣 не трогай: −3 очка!</div>';
    } else {
      html = '<button class="bigbtn" onclick="startGame()">🍎 Играть: «Поймай яблоко» (45 сек)</button>'
           + '<button class="bigbtn" onclick="startGame2()">🎈 Играть: «Лопни шарик» (30 сек)</button>'
           + '<button class="bigbtn alt" onclick="playBall()">🏀 Поиграть с мячиком (+веселье)</button>'
           + '<div class="hint">Яблоки и шарики — это монеты и веселье. Мячик — просто радость без монет 😄</div>';
    }
  }
  else if(room === 'lab'){
    if(S.sick) html += '<div class="hint" style="color:#ff9d9d;font-weight:700">🤒 Питомец болеет! Дай ему лекарство 💊 — оно в списке ниже</div>';
    html += '<div class="grid">';
    POTIONS.forEach(function(pt){
      var poor = S.coins < pt.price;
      html += '<button class="item' + (poor ? ' poor' : '') + '" onclick="buyPotion(\'' + pt.id + '\')">'
            + '<span class="e">' + pt.e + '</span>' + pt.n + '<br>'
            + '<span class="plus">' + pt.d + '</span><br>'
            + '<span class="p">🪙 ' + pt.price + '</span></button>';
    });
    if(S.immuneUntil && Date.now() < S.immuneUntil) html += '<div class="hint" style="color:#9fe8a9;font-weight:700">🍋 Действуют витамины: болезнь питомцу не страшна</div>';
    html += '</div><div class="hint">Лаборатория E.Y.L 🧪 Главное тут — здоровье: зелья ❤️ лечат и дают силы, витамины 🍋 защищают на сутки.<br>Зелья роста и уменьшения действуют 60 секунд. Заболеть питомец может, если надолго оставить его голодным или грязным.</div>';
  }
  else if(room === 'street'){
    html = '<button class="bigbtn" onclick="toggleWalk()">' + (walk.on ? '🏠 Закончить прогулку' : '🚶 Гулять по улице') + '</button>'
         + '<button class="bigbtn alt" onclick="waterFlower()">💧 Полить цветок ' + FLOWER_E[S.flower] + (S.flower < 4 ? ' (рост: ' + S.flowerXp + '/3)' : ' — расцвёл!') + '</button>'
         + '<button class="bigbtn alt" onclick="playBall()">🏀 Поиграть с мячиком</button>'
         + '<div class="hint">На прогулке питомец ходит сам, а ты лови бабочек 🦋 — тапай по ним, за каждую +2 🪙.<br>Цветок у дома растёт от полива: 🌰 → 🌱 → 🌿 → 🌷 → 🌹, за расцвет +50 🪙!</div>';
  }
  else if(room === 'wardrobe'){
    html = '<div class="grid">';
    HATS.forEach(function(h){
      var owned = S.owned.indexOf(h.id) >= 0;
      var worn = (h.kind === 'top' && S.wornTop === h.id) || (h.kind === 'eyes' && S.wornEyes === h.id);
      var lock = !owned && lvl < h.lvl, poor = !owned && S.coins < h.price;
      html += '<button class="item' + (worn ? ' worn' : '') + (lock ? ' lock' : (poor ? ' poor' : '')) + '" onclick="buyWear(\'' + h.id + '\')">'
            + '<span class="e">' + h.e + '</span>' + h.n + '<br>'
            + (owned ? (worn ? '✅ Надето' : 'Надеть') : (lock ? '🔒 ур. ' + h.lvl : '<span class="p">🪙 ' + h.price + '</span>')) + '</button>';
    });
    html += '</div>';
    if(S.wornTop || S.wornEyes) html += '<button class="bigbtn alt" onclick="takeOff()">Снять всё</button>';
    html += '<div class="hint">👑 Корона президента — самая дорогая и самая крутая. Копи монеты!</div>';
  }
  if(WALLS[room]) html += '<button class="bigbtn alt" onclick="cycleWall()">🎨 ' + (room === 'street' ? 'Сменить время дня' : 'Сменить обои') + ' (' + ((S.wall[room] || 0) + 1) + '/' + WALLS[room].length + ')</button>';
  p.innerHTML = html;
}

/* ---------- КАСАНИЯ ПО ПИТОМЦУ ---------- */
var petXpCd = 0;
function canvasPos(ev){
  var r = cv.getBoundingClientRect();
  return { x:ev.clientX - r.left, y:ev.clientY - r.top };
}
cv.addEventListener('pointermove', function(ev){
  var pos = canvasPos(ev);
  pointerX = pos.x;
  var g = petGeom();
  lookX = clamp((pos.x - g.cx) / 90, -1, 1);
  lookY = clamp((pos.y - (g.cy - g.R * 0.3)) / 90, -1, 1);
});
cv.addEventListener('pointerdown', function(ev){
  ac();
  var pos = canvasPos(ev);
  pointerX = pos.x;
  /* мини-игра «Лопни шарик»: тапы по шарикам и бомбам */
  if(game2.active){
    for(var i2 = game2.items.length - 1; i2 >= 0; i2--){
      var it2 = game2.items[i2];
      if(Math.abs(pos.x - it2.x) < 40 && Math.abs(pos.y - it2.y) < 40){
        game2.items.splice(i2, 1);
        if(it2.bad){ game2.score = Math.max(0, game2.score - 3); shakeT = 260; sndBad(); say('Это бомба! 💣 −3 очка'); }
        else { game2.score++; S.coins += 1; S.fun = clamp(S.fun + 0.8, 0, 100); sndPop(); burstHearts(1); say('Лопнул! 🎈 +1 🪙'); }
        updateHUD();
        break;
      }
    }
    return;
  }
  /* бабочки на улице */
  if(room === 'street' && !S.sleeping){
    for(var j2 = flies.length - 1; j2 >= 0; j2--){
      var f2 = flies[j2];
      if(Math.abs(pos.x - f2.x) < 42 && Math.abs(pos.y - f2.y) < 42){
        flies.splice(j2, 1);
        S.coins += 2; sndCoin(); burstHearts(2);
        say('Поймал бабочку! 🦋 +2 🪙');
        addXp(2); updateHUD(); save();
        return;
      }
    }
  }
  var g = petGeom();
  var dx = (pos.x - g.cx) / (g.R * 1.05), dy = (pos.y - g.cy) / (g.R * 1.2);
  if(dx * dx + dy * dy > 1) return; /* не по питомцу */
  if(S.sleeping){ say('Тсс… он спит 💤'); return; }
  if(game.active) return;
  if(room === 'bath'){
    if(foam < 12){ foam = Math.min(12, foam + 2); sndPop(); }
    return;
  }
  if(jumpT < 0) jumpT = 0;
  burstHearts(4);
  sndPop();
  S.fun = clamp(S.fun + 1.5, 0, 100);
  if(petXpCd <= 0){ addXp(1); petXpCd = 2; }
  if(Math.random() < 0.35) say(PHRASES_LOVE[Math.floor(Math.random() * PHRASES_LOVE.length)]);
  updateHUD(); save();
});

/* ---------- ТИК: ПОТРЕБНОСТИ СО ВРЕМЕНЕМ ---------- */
var tickN = 0, lastFoam = 0;
function tick(){
  tickN++;
  if(petXpCd > 0) petXpCd--;
  if(fx.big > 0) fx.big--;
  if(fx.small > 0) fx.small--;
  if(S.started){
    if(S.sleeping){
      S.energy = clamp(S.energy + 1.5, 0, 100);
      S.hunger = clamp(S.hunger - 0.03, 0, 100);
      S.clean  = clamp(S.clean  - 0.012, 0, 100);
      S.fun    = clamp(S.fun    - 0.02, 0, 100);
      if(S.energy >= 100){
        S.sleeping = false;
        say('Я выспался! ☀ Доброе утро!');
        renderPanel();
      }
    } else {
      S.hunger = clamp(S.hunger - 0.016, 0, 100);
      S.clean  = clamp(S.clean  - 0.008, 0, 100);
      S.energy = clamp(S.energy - 0.011, 0, 100);
      S.fun    = clamp(S.fun    - 0.013, 0, 100);
      if(S.hunger < 25 && Math.random() < 0.25) beep(95, 0.18, 'sine', 0, 0.06); /* урчит живот */
      /* болезнь: от долгого голода или грязи */
      if(S.sick){
        S.fun = clamp(S.fun - 0.02, 0, 100);
      } else if((S.hunger <= 10 || S.clean <= 10) && Math.random() < 0.05 && Date.now() > (S.immuneUntil || 0)){
        S.sick = true;
        say('Ой… я заболел 🤒 Нужно лекарство — оно в лаборатории 🧪');
        sndBad(); save();
      }
    }
    /* бонус за полное мытьё */
    if(lastFoam > 0 && foam === 0 && S.clean > 60 && room === 'bath'){
      addXp(6); say('Чистый-чистый! ✨'); sndWin();
    }
    lastFoam = foam;
    /* фразы по ситуации */
    if(tickN % 14 === 0 && !$('bubble').classList.contains('show')){
      var np = needPhrase();
      if(np) say(np);
      else if(Math.random() < 0.3) say(PHRASES_IDLE[Math.floor(Math.random() * PHRASES_IDLE.length)]);
    }
    if(tickN % 10 === 0) save();
    updateHUD();
  }
}

/* ---------- СТАРТ И НАСТРОЙКИ ---------- */
$('btnStart').addEventListener('click', function(){
  ac();
  var n = $('nameInput').value.trim();
  S.name = n || 'Пушик';
  S.char = pickChar || S.char || 'swan';
  S.started = true;
  $('startOverlay').classList.add('hidden');
  say('Привет! Я ' + S.name + '! Погладь меня 👇');
  updateHUD(); save(); sndWin();
});
$('btnSettings').addEventListener('click', function(){
  $('nameInput2').value = S.name;
  $('settingsOverlay').classList.remove('hidden');
});
$('btnCloseSettings').addEventListener('click', function(){
  $('settingsOverlay').classList.add('hidden');
});
$('btnSaveName').addEventListener('click', function(){
  var n = $('nameInput2').value.trim();
  if(n){ S.name = n; save(); updateHUD(); }
  $('settingsOverlay').classList.add('hidden');
  say('Меня зовут ' + S.name + '!');
});
$('btnReset').addEventListener('click', function(){
  if(!confirm('Сбросить питомца и начать заново?')) return;
  try { localStorage.removeItem('eyl-pet-v1'); } catch(e){}
  S = JSON.parse(JSON.stringify(DEF));
  foam = 0; showerOn = false; stopGameSilent();
  $('settingsOverlay').classList.add('hidden');
  $('startOverlay').classList.remove('hidden');
  renderPanel(); updateHUD();
});
function stopGameSilent(){
  game.active = false; game.items = [];
  game2.active = false; game2.items = [];
  walk.on = false; flies = [];
  $('timer').style.display = 'none';
}
document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });

/* ---------- ЗАПУСК ---------- */
resize();
if(S.started) $('startOverlay').classList.add('hidden');
else $('nameInput').value = S.name;
pickChar = S.char || 'swan';
renderCharRows();
renderTabs();
renderPanel();
updateHUD();
if(S.started){
  var np0 = needPhrase();
  if(S.sleeping) setTimeout(function(){ say('Он ещё спит… 💤'); }, 600);
  else if(np0) setTimeout(function(){ say(np0); }, 600);
  else setTimeout(function(){ say('С возвращением! Я скучал ❤'); }, 600);
}
requestAnimationFrame(function(now){ lastFrame = now; requestAnimationFrame(loop); });
setInterval(tick, 1000);
</script>
<script>
/* самообновление: телефон Erik держит старые копии страниц в кэше */
(function(){
  var PET_VER = 5;
  try {
    if(new URLSearchParams(location.search).get('u') === String(PET_VER)) return;
    fetch('pversion.txt?x=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(tx){
        if(parseInt(tx, 10) === PET_VER && !/[?&]u=/.test(location.search)){
          location.replace(location.pathname + '?u=' + PET_VER);
        }
      })
      .catch(function(){});
  } catch(e){}
})();
</script>
