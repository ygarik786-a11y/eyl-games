<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>💛 E.Y.L Город Любви — игра от создателя E.Y.L</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1526;color:#fff;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
input{font-family:inherit}
/* ===== СОЗДАНИЕ ПЕРСОНАЖА ===== */
#createScr{position:fixed;inset:0;background:linear-gradient(180deg,#2a4a7f 0%,#4a7ab5 55%,#e8c98a 100%);display:flex;flex-direction:column;align-items:center;padding:18px 14px;overflow-y:auto;z-index:30}
#createScr h1{font-size:24px;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.logo{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:2px}
.logo .l1{font-size:37px;font-weight:900;letter-spacing:2.5px;line-height:1.05;background:linear-gradient(92deg,#ff9ec4 5%,#ffd94d 48%,#ff5d8f 95%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.logo .eyl{background:linear-gradient(180deg,#ffe97a,#f5b921);color:#4a2c00;font-size:15px;font-weight:900;letter-spacing:6px;padding:5px 16px 5px 22px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 #fff8;text-shadow:none}
.logo .orn{font-size:14px;letter-spacing:8px;opacity:.95;text-shadow:0 2px 6px rgba(0,0,0,.4)}
#createScr .sub{opacity:.92;font-size:13px;margin:4px 0 12px;text-align:center}
.bigava{text-align:center;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));height:196px;flex:0 0 auto;margin-bottom:6px}
#createScr>*{flex-shrink:0}
.bigava svg{height:152px;width:auto}
#nameInp{width:min(320px,90vw);padding:12px 14px;border-radius:12px;border:none;font-size:17px;text-align:center;margin:10px 0}
.pickrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:360px;margin:4px 0 8px}
.pick{width:54px;height:64px;font-size:30px;background:rgba(255,255,255,.18);border:2px solid transparent;border-radius:14px;display:flex;align-items:center;justify-content:center}
.pick svg{height:54px;width:auto}
.pick.sel{border-color:#ffd94d;background:rgba(255,217,77,.25)}
.picklbl{font-size:12px;opacity:.9;margin-top:6px}
#playBtn{background:#ffd94d;color:#402c00;font-size:19px;font-weight:800;padding:13px 42px;border-radius:16px;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#contBtn{background:rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:700;padding:11px 26px;border-radius:14px;margin-top:10px;border:2px solid rgba(255,255,255,.5)}
#resetBtn{background:none;color:rgba(255,255,255,.75);font-size:12px;margin-top:14px;text-decoration:underline}
/* ===== ИГРА ===== */
#gameScr{position:fixed;inset:0;display:none;flex-direction:column;background:#0d1526}
@media(min-width:700px){
 body{background:radial-gradient(1000px 600px at 50% 30%,#1d2c4d,#0d1526)}
 #gameScr{left:50%;right:auto;transform:translateX(-50%);width:560px;box-shadow:0 0 60px rgba(0,0,0,.65);border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08)}
 #scene{height:330px}
 .charimg{height:150px}
 .person.me .charimg{height:162px}
 #chatLog{max-height:170px}
}
#topbar{background:linear-gradient(180deg,#d6eefc,#a9d7f8);padding:7px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#14456b;box-shadow:0 2px 6px rgba(20,69,107,.25)}
#topbar .nm{font-weight:800;font-size:15px}
#topbar .pill{background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:#14456b;box-shadow:0 1px 3px rgba(20,69,107,.2)}
#topbar .pill b{color:#1d9d4e}
#giftBtn{margin-left:auto;background:#ff5d8f;color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
#giftBtn:disabled{background:#5a6a8a;color:#c8d2e8}
#scene{position:relative;height:252px;flex:none;overflow:hidden;transition:background .4s}
#scenePersons{position:absolute;inset:0;z-index:6}
#questBtn{background:#fff3a6;color:#4a3200;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;border:2px solid #ffd94d;box-shadow:0 1px 3px rgba(20,69,107,.2)}
.deco{position:absolute;pointer-events:none;line-height:1}
.person{position:absolute;bottom:26px;transform:translateX(-50%);text-align:center;z-index:3;transition:left .55s ease}
.person .av{line-height:.95;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.person .av svg{height:66px;width:auto;display:block;margin:0 auto}
@keyframes legSwing{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
@keyframes armSwing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.pl,.pa{transform-box:fill-box;transform-origin:50% 0;animation:legSwing .72s ease-in-out infinite}
.pl.r{animation-delay:-.36s}
.pa{animation-name:armSwing;animation-duration:.72s}
.pa.r{animation-delay:-.36s}
.person .pn{font-size:11px;font-weight:700;background:rgba(0,0,0,.45);border-radius:999px;padding:1px 7px;margin-top:1px;white-space:nowrap}
.person.me .pn{background:#ffd94d;color:#402c00}
.person .say{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;color:#222;font-size:10.5px;line-height:1.3;border-radius:10px;padding:3px 8px;width:max-content;max-width:118px;box-shadow:0 2px 6px rgba(0,0,0,.25);margin-bottom:2px;z-index:6}
.person .fxb{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:32px;background:#fff;font-size:17px;line-height:1;padding:5px 8px;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,.3);z-index:4}
.person .fxb:after{content:'';position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#fff;border-radius:50%;transform:translateX(-50%)}
.person .pet{position:absolute;bottom:-4px;left:-25px;font-size:19px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.charimg{height:118px;width:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28));animation:sway 2.8s ease-in-out infinite}
.charimg.me{height:128px}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.walking .charimg{animation:walkB .16s ease-in-out infinite alternate!important}
@keyframes walkB{from{transform:translateY(0) rotate(-1.6deg)}to{transform:translateY(-6px) rotate(1.6deg)}}
.drunk .charimg{animation:drunkSway .9s ease-in-out infinite alternate!important;transform-origin:50% 100%}
@keyframes drunkSway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg) translateY(-2px)}}
.dancing .charimg{animation:danceB .4s ease-in-out infinite alternate}
@keyframes danceB{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-7px) rotate(2deg)}}
.shopChar{height:88px;width:auto}
.bigava img{height:192px;width:auto}
.pick{width:auto;height:auto;padding:4px 6px}
.pick img{height:98px;width:auto;display:block}
#charPick{max-width:400px}
.slot{position:absolute;bottom:24px;transform:translateX(-50%);font-size:34px;z-index:2;text-align:center}
.slot.empty{opacity:.28;font-size:22px}
@keyframes dance{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px) rotate(-3deg)}}
.dancing{animation:dance .5s infinite}
/* Панель действий — ВЫШЕ вкладок локаций (урок телефона Erik) */
#actions{display:flex;gap:7px;padding:8px;background:#14213d;flex-wrap:wrap;justify-content:center}
#actions button{background:#2a4a7f;color:#fff;font-size:14px;font-weight:700;padding:10px 13px;border-radius:12px}
#actions button:active{background:#3a5f9e}
#actions button.gold{background:#ffd94d;color:#402c00}
#locs{display:flex;gap:7px;padding:0 8px 8px;background:#14213d;justify-content:center}
#locs button{flex:1;max-width:110px;background:rgba(255,255,255,.1);color:#c8d2e8;font-size:13px;font-weight:700;padding:9px 4px;border-radius:12px;border:2px solid transparent}
#locs button.sel{background:#2a4a7f;color:#fff;border-color:#ffd94d}
/* Чат */
#chat{flex:1;display:flex;flex-direction:column;background:#0a1120;min-height:86px}
#chatLog{flex:1;overflow-y:auto;padding:6px 10px;font-size:13px;line-height:1.45}
#chatLog .sys{color:#ffd94d}
#chatRow{display:flex;gap:7px;padding:7px;background:#14213d}
#chatInp{flex:1;padding:11px 12px;border-radius:12px;border:none;font-size:15px;background:#fff;color:#111}
#chatSend{background:#ffd94d;color:#402c00;font-weight:800;font-size:15px;padding:11px 18px;border-radius:12px}
/* Модалки */
#modalWrap{position:fixed;inset:0;background:rgba(4,8,18,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal{background:#fff;color:#16233f;width:min(430px,96vw);max-height:88vh;overflow-y:auto;border-radius:18px;padding:16px}
#modal h3{font-size:18px;margin-bottom:8px}
#modal .x{float:right;background:#eef2fa;font-size:15px;width:34px;height:34px;border-radius:10px}
.shopGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.shopIt{background:#f2f5fb;border:2px solid #dfe7f5;border-radius:14px;padding:9px 4px;text-align:center}
.shopIt .e{font-size:34px;line-height:1.1}
.shopIt .e svg{height:54px;width:auto}
.shopIt .n{font-size:12px;font-weight:700;margin:2px 0}
.shopIt .p{font-size:12px;color:#0a7a42;font-weight:800}
.shopIt button{margin-top:5px;background:#2a4a7f;color:#fff;font-size:12px;font-weight:700;padding:7px 10px;border-radius:9px;width:100%}
.shopIt button.own{background:#0a7a42}
.shopIt button:disabled{background:#aab6cc}
#fishTrack{position:relative;height:54px;background:linear-gradient(180deg,#7ec8e3,#2a7ab5);border-radius:12px;margin:12px 0;overflow:hidden}
#fishZone{position:absolute;top:0;bottom:0;left:38%;width:24%;background:rgba(80,255,140,.45);border-left:2px dashed #0a7a42;border-right:2px dashed #0a7a42}
#fish{position:absolute;top:9px;font-size:34px;left:0}
.bigAct{background:#ffd94d;color:#402c00;font-size:17px;font-weight:800;padding:13px;border-radius:14px;width:100%;margin-top:6px}
.bushGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.bush{font-size:44px;background:#eef7ee;border-radius:14px;padding:10px 0;border:2px solid #d5e8d5}
.msg{font-size:13px;margin-top:8px;min-height:18px;color:#40506e;text-align:center;font-weight:600}
</style>
</head>

</div>

function checkQuest(){var qBefore=S.quest;var changed=true;
 while(changed&&S.quest<QUESTS.length){changed=false;var q=QUESTS[S.quest];
  var done=q.prog?(q.prog(S)>=q.need):q.test(S);
  if(done){S.credits+=q.reward;S.rep+=20;S.quest++;
   if(S.quest===2)S.fishQuest=0; if(S.quest===3)S.mushQuest=0;
   sysChat('Задание выполнено! +'+q.reward+'💰 +20⭐');changed=true;}}
 if(S.quest>qBefore&&S.quest<QUESTS.length){var nq=QUESTS[S.quest];chatMsg(nq.npc,nq.text);}
 save();renderTop();renderQuest();}

function buyItem(id){var it=itemById(id);if(!it||S.owned.indexOf(id)>=0)return false;
 if(S.credits<it.p)return false;S.credits-=it.p;S.owned.push(id);
 if(id[0]==='h')S.head=id; if(id[0]==='b')S.body=id; if(id[0]==='p')S.pet=id; if(id[0]==='a')S.acc=id; if(id[0]==='c')S.char=id;
 save();renderAll();sysChat('Куплено: '+it.n+' '+it.e);checkQuest();return true;}
function equipItem(id){if(S.owned.indexOf(id)<0)return;if(id[0]==='h')S.head=id;if(id[0]==='b')S.body=id;if(id[0]==='p')S.pet=id;if(id[0]==='a')S.acc=id;if(id[0]==='c')S.char=id;save();renderAll();}
function setFace(f){S.face=f;save();renderAll();}
function setAcc(id){S.acc=id;save();renderAll();}
/* ================= КЛУБ: БАР И ТАНЦЫ ================= */
function openBar(){var h='<h3>🍸 Бар клуба Star</h3><div style="font-size:13px">Бармен: «Привет! Нужна помощь в выборе выпивки?» У тебя: <b>'+S.credits+'💰</b><br>Всё, что выпьешь или съешь, минуту висит облачком над головой — как в оригинале!</div><div class="shopGrid">';
 DRINKS.forEach(function(d,i){h+='<div class="shopIt"><div class="e">'+d.e+'</div><div class="n">'+d.n+'</div><div class="p">'+d.p+'💰</div><button data-drink="'+i+'" '+(S.credits<d.p?'disabled':'')+'>Заказать</button></div>';});
 h+='</div>';openModal(h);
 Array.prototype.forEach.call(document.querySelectorAll('[data-drink]'),function(b){b.addEventListener('click',function(){doDrink(parseInt(b.getAttribute('data-drink'),10));});});}
function doDrink(i){var d=DRINKS[i];if(!d||S.credits<d.p)return false;
 S.credits-=d.p;S.drank=(S.drank||0)+1;S.fx={icon:d.e,face:d.face,until:Date.now()+60000};if(d.face==='drunk')S.drunkUntil=Date.now()+60000;
 save();closeModal();renderAll();sysChat(d.say+' (эффект на минуту)');
 chatMsg('Бармен','хороший выбор! 🍸');
 setTimeout(function(){renderScene();},60500);checkQuest();return true;}
function doDance(){if(S.danceUntil&&Date.now()<S.danceUntil){sysChat('Ты уже танцуешь! 💃');return false;}
 if(S.credits<6){sysChat('Не хватает кредитов на танец. Порыбачь или собери грибы!');return false;}
 S.credits-=6;S.danced=(S.danced||0)+1;S.rep+=10;S.danceUntil=Date.now()+20000;
 save();renderAll();sysChat('Ты танцуешь на танцполе! 🪩 +10⭐');
 chatMsg('Рита','как ты танцуешь! 💃');chatMsg('Диджей','отличный ритм! 🎧');
 setTimeout(function(){renderScene();},20500);checkQuest();return true;}
function openLook(){openShop(CHARS,'👤 Твой образ');}
var pendingFur=null;
function openPlace(){var own=FURS.filter(function(f){return S.owned.indexOf(f.id)>=0;});
 if(!own.length){openModal('<h3>🛋️ Мебель</h3><div class="msg">У тебя пока нет мебели. Купи её в Торговом центре, отдел «Мебель».</div>');return;}
 var h='<h3>🛋️ Поставить мебель</h3><div style="font-size:13px">Выбери вещь, потом тапни по месту в комнате:</div><div class="shopGrid">';
 own.forEach(function(f){h+='<div class="shopIt"><div class="e">'+f.e+'</div><div class="n">'+f.n+'</div><button data-pf="'+f.id+'">Сюда</button></div>';});
 h+='</div>';openModal(h);
 Array.prototype.forEach.call(document.querySelectorAll('[data-pf]'),function(b){b.addEventListener('click',function(){pendingFur=b.getAttribute('data-pf');closeModal();sysChat('Теперь тапни по месту в комнате 🛋️');});});}
function placeAt(i){if(S.loc!=='home')return;
 if(pendingFur){var old=S.placed.indexOf(pendingFur);if(old>=0)S.placed[old]=null;
  S.placed[i]=pendingFur;pendingFur=null;save();renderScene();sysChat('Поставлено! Дом всё уютнее 🏠');checkQuest();}}
/* ================= РЫБАЛКА ================= */
var fishTimer=null,fishPos=0,fishDir=1;
function stopFish(){if(fishTimer){clearInterval(fishTimer);fishTimer=null;}}
function openFish(){openModal('<h3>🎣 Рыбалка</h3><div style="font-size:13px">Рыба плавает туда-сюда. Жми «Тяни!», когда рыба в <b>зелёной зоне</b>. Пойманная рыба — сразу +15💰.</div><div id="fishTrack"><div id="fishZone"></div><div id="fish">🐟</div></div><button class="bigAct" id="pullBtn">🎣 Тяни!</button><div class="msg" id="fishMsg">У тебя рыбы: '+S.fish+'</div>');
 fishPos=0;fishDir=1;stopFish();
 fishTimer=setInterval(function(){fishPos+=fishDir*1.1;if(fishPos>88){fishPos=88;fishDir=-1;}if(fishPos<0){fishPos=0;fishDir=1;}
  var f=$('fish');if(f){f.style.left=fishPos+'%';f.style.transform=(fishDir>0?'scaleX(-1)':'scaleX(1)');}},30);
 $('pullBtn').addEventListener('click',function(){var m=$('fishMsg');if(!m)return;
  if(fishPos>=36&&fishPos<=62){S.fish++;if(S.quest===2)S.fishQuest++;S.credits+=15;save();renderTop();
   m.textContent='Поймал! 🐟 +15💰 Всего рыбы: '+S.fish;checkQuest();}
  else m.textContent='Мимо! Рыба была не в зелёной зоне.';});}
function catchOk(){S.fish++;if(S.quest===2)S.fishQuest++;S.credits+=15;save();checkQuest();return true;}
/* ================= ГРИБЫ ================= */
function openMush(){var vals=[];for(var i=0;i<6;i++)vals.push(Math.random()<0.55?(Math.random()<0.3?2:1):0);
 var h='<h3>🍄 Лесная поляна</h3><div style="font-size:13px">Тапай по кустам! Гриб — +8💰.</div><div class="bushGrid">';
 vals.forEach(function(v,i){h+='<button class="bush" data-bush="'+i+'" data-v="'+v+'">🌿</button>';});
 h+='</div><div class="msg" id="mushMsg">У тебя грибов: '+S.mush+'</div><button class="bigAct" id="mushMore">Ещё поляна</button>';
 openModal(h);
 Array.prototype.forEach.call(document.querySelectorAll('[data-bush]'),function(b){b.addEventListener('click',function(){
  if(b.getAttribute('data-done'))return;b.setAttribute('data-done','1');var v=parseInt(b.getAttribute('data-v'),10);
  if(v>0){b.textContent='🍄';S.mush+=v;if(S.quest===3)S.mushQuest+=v;S.credits+=8*v;save();renderTop();
   $('mushMsg').textContent='Нашёл грибов: '+v+'! +'+(8*v)+'💰 Всего: '+S.mush;checkQuest();}
  else{b.textContent='🍃';$('mushMsg').textContent='Тут пусто, ищи дальше!';}});});
 $('mushMore').addEventListener('click',openMush);}
function mushAdd(v){S.mush+=v;if(S.quest===3)S.mushQuest+=v;S.credits+=8*v;save();checkQuest();return true;}
/* ================= ЧАТ ================= */
function sendChat(){var inp=$('chatInp');var t=inp.value.trim();if(!t)return;inp.value='';
 chatMsg(S.name,t);
 var low=t.toLowerCase();var npcs=LOCS[S.loc].npcs;if(!npcs.length)return;
 var n=npcs[Math.floor(Math.random()*npcs.length)];var reply=null;
 if(low.indexOf('привет')>=0)reply='привет, '+S.name+'! 😊';
 else if(low.indexOf('ищу')>=0)reply='удачи! в Городе все кого-то ищут, хаха';
 else if(low.indexOf('люблю')>=0)reply='💛';
 else if(Math.random()<0.6)reply=CHAT_REPLY[Math.floor(Math.random()*CHAT_REPLY.length)];
 if(reply)setTimeout(function(){chatMsg(n.n,reply);say(n.n,reply);},800);}
setInterval(function(){if(!S||$('gameScr').style.display==='none')return;
 var ns=LOCS[S.loc].npcs;if(ns.length&&Math.random()<0.85){var w=ns[Math.floor(Math.random()*ns.length)];w.x=Math.max(9,Math.min(91,w.x+(Math.random()<0.5?-6:6)));renderScene();}},7000);
setInterval(function(){if(!S||$('gameScr').style.display==='none')return;
 if(Math.random()<0.75){var npcs=LOCS[S.loc].npcs;if(npcs.length){var n=npcs[Math.floor(Math.random()*npcs.length)];
  var t=CHAT_COMMON[Math.floor(Math.random()*CHAT_COMMON.length)];chatMsg(n.n,t);}}},12000);
/* ================= СОЗДАНИЕ ================= */
var selChar='c1',newArm=false;
function buildPickers(){var cp=$('charPick');cp.innerHTML='';
 CHARS.filter(function(c){return c.p===0;}).forEach(function(c){var btn=document.createElement('button');btn.className='pick'+(selChar===c.id?' sel':'');btn.innerHTML=charImg(c.img);
  btn.addEventListener('click',function(){selChar=c.id;buildPickers();updPreview();});cp.appendChild(btn);});}
function updPreview(){$('prevAva').innerHTML=charImg(charById(selChar).img);}
function enterGame(){$('createScr').style.display='none';$('gameScr').style.display='flex';renderAll();
 sysChat('Добро пожаловать в Город, '+S.name+'! 💛');chatMsg('Мита','я тут, в твоём доме живу по соседству 😊');checkQuest();}
$('playBtn').addEventListener('click',function(){
 var nm=$('nameInp').value.trim()||'Игрок';
 if(load()&&!newArm){newArm=true;$('playBtn').textContent='Точно начать заново? Нажми ещё раз';return;}
 S=defState(nm);S.char=selChar;S.owned=[selChar];save();enterGame();});
$('contBtn').addEventListener('click',function(){var s=load();if(s){S=s;enterGame();}});
$('resetBtn').addEventListener('click',function(){if(!newArm){newArm=true;$('resetBtn').textContent='точно сбросить всё? нажми ещё раз';return;}
 try{localStorage.removeItem(KEY);}catch(e){}location.reload();});
$('questBtn').addEventListener('click',showQuest);
$('giftBtn').addEventListener('click',function(){var today=new Date().toDateString();
 if(S.giftDate===today){sysChat('Подарок дня уже получен 🎁 Приходи завтра!');return;}
 S.giftDate=today;S.credits+=30;save();renderTop();sysChat('Подарок дня: +30💰 🎁');});
$('chatSend').addEventListener('click',sendChat);
$('chatInp').addEventListener('keydown',function(e){if(e.key==='Enter')sendChat();});
$('modalWrap').addEventListener('click',function(e){if(e.target===$('modalWrap'))closeModal();});
(function init(){buildPickers();updPreview();var s=load();
 if(s){$('contBtn').style.display='block';$('contName').textContent=s.name;$('resetBtn').style.display='block';
  $('nameInp').value=s.name;selChar=s.char||'c1';buildPickers();updPreview();}})();
/* API для проверок */
window.G={get state(){return S;},newGame:function(n){S=defState(n||'Тест');save();return S;},
 buy:buyItem,equip:equipItem,catchOk:catchOk,mushAdd:mushAdd,party:doParty,clean:doClean,drink:doDrink,dance:doDance,place:placeAt,
 placeItem:function(id,i){pendingFur=id;placeAt(i);},
 setLoc:function(l){S.loc=l;},check:checkQuest,quests:QUESTS};
</script>
</body>
</html>
