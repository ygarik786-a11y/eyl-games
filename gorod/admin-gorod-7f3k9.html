<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Тут ничего нет</title>
<style>
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#0d1526;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px}
.card{background:#16233f;border-radius:18px;padding:22px;width:min(400px,94vw);text-align:center}
input{width:100%;padding:12px;border-radius:12px;border:none;font-size:16px;text-align:center;margin:10px 0;box-sizing:border-box}
button{display:block;width:100%;background:#ffd94d;color:#402c00;font-weight:800;font-size:16px;padding:14px;border:none;border-radius:14px;margin-top:10px;cursor:pointer}
button.blue{background:#2a4a7f;color:#fff}
button.red{background:#8a2432;color:#fff}
.stat{font-size:15px;line-height:1.7;text-align:left;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px}
.msg{font-size:13px;min-height:18px;margin-top:8px;color:#ffd94d;font-weight:700}
</style>
</head>
<body>
<div class="card" id="gate">
  <div style="font-size:40px">🔒</div>
  <div style="font-weight:800;font-size:18px">Админка Города</div>
  <div style="font-size:13px;opacity:.85">Только для создателя. Если пароля ещё нет — придумай и введи, он запомнится на этом телефоне.</div>
  <input id="pw" type="password" placeholder="Пароль">
  <button id="go">Войти</button>
  <div class="msg" id="gmsg"></div>
</div>
<div class="card" id="panel" style="display:none">
  <div style="font-weight:800;font-size:18px">👑 Админка «E.Y.L Город Любви»</div>
  <div class="stat" id="stat"></div>
  <button id="bCred">💰 +10 000 кредитов</button>
  <button id="bRep" class="blue">⭐ +1 000 репутации</button>
  <button id="bAll" class="blue">🎁 Открыть всю одежду, причёски и мебель</button>
  <button id="bReset" class="red">Сбросить прогресс игры</button>
  <div class="msg" id="pmsg"></div>
  <div style="font-size:12px;opacity:.8;margin-top:8px">Открывай эту страницу в том же браузере, где играешь, — иначе монеты упадут в чужой сейв.</div>
</div>
<script>
"use strict";
var KEY='eyl-gorod-v1',PK='eyl-gorod-admin-pass';
function $(i){return document.getElementById(i);}
function loadS(){try{var t=localStorage.getItem(KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function saveS(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function defS(){return {name:'Erik',head:'h0',body:'b0',credits:282,rep:0,owned:['h0','h9','b0','b7'],loc:'mall',x:50,quest:0,fish:0,mush:0,fishQuest:0,mushQuest:0,parties:0,placed:[null,null,null,null],giftDate:'',shellCd:0,partyUntil:0};}
function stat(){var s=loadS();if(!s){$('stat').innerHTML='Сейва пока нет — кнопки ниже создадут его.';return;}
 $('stat').innerHTML='Игрок: <b>'+s.name+'</b><br>💰 Кредитов: <b>'+s.credits+'</b><br>⭐ Репутации: <b>'+s.rep+'</b><br>Заданий пройдено: <b>'+s.quest+'</b><br>Вещей куплено: <b>'+s.owned.length+'</b>';}
$('go').addEventListener('click',function(){var v=$('pw').value;if(!v)return;
 var saved=null;try{saved=localStorage.getItem(PK);}catch(e){}
 if(!saved){try{localStorage.setItem(PK,v);}catch(e){}$('gate').style.display='none';$('panel').style.display='block';stat();return;}
 if(v===saved){$('gate').style.display='none';$('panel').style.display='block';stat();}
 else $('gmsg').textContent='Не тот пароль.';});
function withS(fn){var s=loadS()||defS();fn(s);saveS(s);stat();}
$('bCred').addEventListener('click',function(){withS(function(s){s.credits+=10000;});$('pmsg').textContent='+10 000 кредитов! 💰';});
$('bRep').addEventListener('click',function(){withS(function(s){s.rep+=1000;});$('pmsg').textContent='+1 000 репутации! ⭐';});
$('bAll').addEventListener('click',function(){withS(function(s){['h0','h1','h2','h3','h4','h5','h6','h7','c1','c2','c3','c4','c5','c6','p1','p2','p3','p4','f1','f2','f3','f4','f5','f6','f7'].forEach(function(id){if(s.owned.indexOf(id)<0)s.owned.push(id);});});$('pmsg').textContent='Всё открыто! Загляни в магазины и домой 🎁';});
var arm=false;
$('bReset').addEventListener('click',function(){if(!arm){arm=true;$('bReset').textContent='Точно сбросить? Нажми ещё раз';return;}
 try{localStorage.removeItem(KEY);}catch(e){}$('pmsg').textContent='Прогресс сброшен.';stat();});
</script>
<!-- Значки-картинки (Twemoji): на компе Erik часть смайлов не рисуется шрифтом Windows и видна как □. Подменяем их картинками — одинаково на телефоне и на компе. -->
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>img.emoji{height:1em;width:1em;margin:0 .05em 0 .1em;vertical-align:-.1em}</style>
<script>
(function(){
  function parseAll(){ if(window.twemoji){ try{ twemoji.parse(document.body); }catch(e){} } }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',parseAll); } else { parseAll(); }
  if(window.MutationObserver){
    var mo=new MutationObserver(function(muts){
      if(!window.twemoji) return;
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.nodeType===1 && (!n.classList || !n.classList.contains('emoji'))){ try{ twemoji.parse(n); }catch(e){} }
        });
      });
    });
    mo.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
</body>
</html>
