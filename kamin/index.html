  .scene.warm { box-shadow:0 14px 34px rgba(0,0,0,.6), inset 0 0 60px rgba(255,140,40,.28), inset 0 0 0 1px rgba(255,180,90,.2); }
  .garland { position:absolute; top:4px; left:0; right:0; text-align:center; font-size:13px; letter-spacing:5px; z-index:6; animation:gar 1.8s ease-in-out infinite; pointer-events:none; }
  @keyframes gar { 0%,100%{opacity:.65;} 50%{opacity:1; filter:drop-shadow(0 0 5px rgba(255,210,90,.8));} }
  .glow { position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(46% 40% at 47% 68%, rgba(255,150,50,.38), transparent 70%); opacity:.25; }

  /* ===== Ёлка (нарисована кодом) ===== */
  .tree { position:absolute; left:0; bottom:100px; width:132px; height:281px; z-index:3; }
  .tree .bulb { animation:bulbGlow 1.5s ease-in-out infinite; }
  .tree .b2 { animation-delay:.5s; } .tree .b3 { animation-delay:1s; }
  @keyframes bulbGlow { 0%,100%{ opacity:.55; } 50%{ opacity:1; filter:drop-shadow(0 0 6px currentColor); } }
  .tree .twinkle { animation:tw 2.4s ease-in-out infinite; transform-origin:center; }
  .tree .tw2 { animation-delay:1.2s; }
  @keyframes tw { 0%,100%{ opacity:.25; transform:scale(.7) rotate(0deg);} 50%{ opacity:1; transform:scale(1.15) rotate(20deg);} }
  .tree .star { animation:starGlow 2s ease-in-out infinite; transform-origin:80px 26px; }
  @keyframes starGlow { 0%,100%{ filter:drop-shadow(0 0 4px rgba(255,215,80,.7)); transform:scale(1);} 50%{ filter:drop-shadow(0 0 13px rgba(255,215,80,1)); transform:scale(1.1);} }

  /* ===== Телевизор ===== */
  .tv { position:absolute; left:24%; top:1%; width:48%; height:40.5%; z-index:4;
    background:#000; border:3px solid #191919; border-radius:6px; overflow:hidden; box-sizing:border-box;
    box-shadow:0 14px 30px rgba(0,0,0,.5); }
  .tv:fullscreen { left:0; top:0; width:100%; height:100%; border-radius:0; }
  .tv.on { box-shadow:0 10px 22px rgba(0,0,0,.65), 0 0 26px rgba(120,180,255,.28), inset 0 0 0 2px #26262b; }
  .tv video { width:100%; height:100%; display:block; background:#000; object-fit:cover; }
  .tv:fullscreen video { object-fit:contain; }
  .tv .off { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:rgba(0,0,0,.30); color:#9fc2e0; font-size:9px; text-align:center; }
  .tv .off .big { font-size:22px; }
  .tv .off .eyl-logo { font-family:Georgia,'Times New Roman',serif; font-size:36px; font-weight:900; letter-spacing:7px; padding-left:7px;
    background:linear-gradient(180deg,#ffefa8 0%,#ffd94d 38%,#f0a81c 62%,#9c6a08 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 7px rgba(240,168,28,.45)); }
  .tv .off .offhint { font-size:10px; opacity:.85; }
  .tv:fullscreen .off .eyl-logo { font-size:72px; letter-spacing:12px; }
  .tv.on .off { display:none; }
  .tv .chname { position:absolute; top:4px; left:4px; z-index:5; background:rgba(0,0,0,.62); color:#fff; font-size:10px; font-weight:700;
    padding:2px 6px; border-radius:6px; opacity:0; transition:opacity .4s; pointer-events:none; max-width:92%; }
  .tv .chname.show { opacity:1; }
  .tvstand { display:none; }

  /* ===== Камин ===== */
  .mantel { position:absolute; right:6px; bottom:298px; width:224px; height:14px; border-radius:6px;
    background:linear-gradient(180deg,#6b4630,#4a2d1c); box-shadow:0 4px 10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,170,.35); z-index:3; }
  .mantel-items { position:absolute; right:6px; bottom:314px; width:224px; display:flex; justify-content:space-between; padding:0 8px; font-size:18px; z-index:3; }
  .mantel-items .candle { animation:candle 1.6s ease-in-out infinite; display:inline-block; }
  @keyframes candle { 0%,100%{ transform:scale(1) rotate(-2deg);} 50%{ transform:scale(1.12) rotate(2deg); filter:drop-shadow(0 0 7px rgba(255,190,80,.9)); } }
  .portal { position:absolute; right:8px; bottom:106px; width:216px; height:190px; border-radius:14px 14px 6px 6px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 24px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.20) 0 2px, transparent 2px 46px),
      linear-gradient(160deg,#7a4433,#5d3122 60%,#4c281b);
    box-shadow:0 10px 24px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,200,150,.18); z-index:2; }
  .firebox { position:absolute; left:37.2%; top:57.5%; width:20.2%; height:23%; border-radius:2px;
    background:transparent; overflow:hidden; z-index:2; }
  #fire { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #firevid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .5s; z-index:2; }
  .hearth { position:absolute; right:2px; bottom:96px; width:240px; height:14px; border-radius:6px;
    background:linear-gradient(180deg,#3d2c20,#241812); box-shadow:0 6px 14px rgba(0,0,0,.6); z-index:2; }
  .woodpile { position:absolute; right:206px; bottom:100px; font-size:23px; z-index:4; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .stockings { position:absolute; left:4%; top:44%; width:27%; z-index:4; }
  .stockimg { width:100%; display:block; transform-origin:50% 0; animation:sway 3.6s ease-in-out infinite; filter:drop-shadow(0 4px 5px rgba(0,0,0,.45)); }
  .stocking { position:absolute; top:0; height:100%; width:33.33%; cursor:pointer; font-size:0; touch-action:manipulation; border-radius:10px; }
  .stocking[data-who="Erik"] { left:0; }
  .stocking[data-who="Mita"] { left:33.33%; }
  .stocking[data-who="E.Y.L"] { left:66.66%; }
  .stocking:active { background:radial-gradient(60% 60% at 50% 45%, rgba(255,220,120,.25), transparent 70%); }
  .stocking .nm { position:absolute; top:-12px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:700; color:#ffd98a; text-shadow:0 1px 3px #000; }
  @keyframes sway { 0%,100%{ transform:rotate(-4deg);} 50%{ transform:rotate(4deg);} }
  .marsh { position:absolute; left:30.5%; top:63%; font-size:24px; z-index:6; opacity:0; pointer-events:none; transition:opacity .25s; transform:rotate(-24deg); }
  .marsh.on { opacity:1; animation:roast 1s ease-in-out infinite; }
  @keyframes roast { 0%,100%{ transform:rotate(-24deg) translateX(0);} 50%{ transform:rotate(-16deg) translateX(5px);} }

  /* ===== Диван (нарисован кодом) ===== */
  .sofa { position:absolute; left:0; bottom:0; width:230px; height:118px; z-index:5; filter:drop-shadow(0 6px 12px rgba(0,0,0,.5)); }

  /* ===== Панель ===== */
  .heat { margin:10px 2px 4px; font-size:13px; display:flex; justify-content:space-between; }
  .heatbar { height:12px; border-radius:8px; background:#2a1a10; box-shadow:inset 0 1px 3px rgba(0,0,0,.7); overflow:hidden; }
  .heatfill { height:100%; width:30%; border-radius:8px; background:linear-gradient(90deg,#ff7b1c,#ffb03a,#ffe27a); transition:width .6s; box-shadow:0 0 12px rgba(255,150,50,.8); }
  .status { text-align:center; font-size:14px; min-height:20px; margin:7px 0 2px; }
  .tvbar { display:grid; grid-template-columns:1.15fr .5fr .5fr .5fr .5fr; gap:8px; margin-top:8px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:9px; }
  button.act { border:none; border-radius:14px; padding:13px 6px; font-size:16px; font-weight:700; color:#fff; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); transition:transform .08s; touch-action:manipulation; }
  button.act:active { transform:scale(.96); }
  .b-tv { background:linear-gradient(160deg,#2f6fb3,#1d4e80); }
  .b-ch { background:linear-gradient(160deg,#44506b,#2c364a); }
  .b-list { background:linear-gradient(160deg,#7a4fa3,#553377); }
  .chlist { max-height:230px; overflow-y:auto; margin-top:8px; background:rgba(10,14,24,.92); border:1px solid #3a4a6b; border-radius:12px; padding:6px; }
  .chlist button { display:block; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid rgba(255,255,255,.07); color:#e8eefc; font-size:15px; padding:9px 10px; cursor:pointer; }
  .chlist button.cur { background:rgba(122,79,163,.35); font-weight:700; }
  .b-wood { background:linear-gradient(160deg,#a05a2c,#7a3f1a); }
  .b-stoke { background:linear-gradient(160deg,#e0641e,#b33e0e); }
  .b-marsh { background:linear-gradient(160deg,#8a5aa8,#67407f); }
  .b-sound { background:linear-gradient(160deg,#3d6e8f,#2a4f68); }
  .stats { display:flex; justify-content:space-around; margin-top:12px; font-size:13px; opacity:.9; text-align:center; }
  .stats b { display:block; font-size:17px; }
  .back { display:block; text-align:center; margin-top:14px; color:#ffb03a; text-decoration:none; font-size:14px; }
</style>

      hls = new Hls({ maxBufferLength: 12 });
      hls.loadSource(url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(function(){}); });
      hls.on(Hls.Events.ERROR, function(ev, data){ if (data && data.fatal) tvError(); });
    } else {
      video.src = url; video.play().catch(function(){});

  }
  function burstSparks(n){
    for (var i=0;i<n;i++) sparks.push({ x: W/2 + (Math.random()*70-35), y: H-44, vx:(Math.random()*0.9-0.45), vy:-(1.5+Math.random()*2.6), life: 50+Math.random()*60 });
  }

  function initAudio(){
    if (AC) return;
    try {
      AC = new (window.AudioContext||window.webkitAudioContext)();
      var len = AC.sampleRate * 4, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0), last = 0;
      for (var i=0;i<len;i++){ var w = Math.random()*2-1; last = (last + 0.02*w)/1.02; var swell = 0.72 + 0.28*Math.sin(6.2832*3*i/len) * Math.sin(6.2832*7*i/len + 1.3); d[i] = last*3.2*swell; }
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 260;
      noiseGain = AC.createGain(); noiseGain.gain.value = 0;
      src.connect(f); f.connect(noiseGain); noiseGain.connect(AC.destination); src.start();
    } catch(e){ AC = null; }
  }
  function cracklePop(vol){
    if (!soundOn || !AC) return;
    var dur = 0.05 + Math.random()*0.07, n = Math.floor(AC.sampleRate*dur);
    var buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++){ var t = i/n; d[i] = (Math.random()*2-1) * Math.pow(1-t, 2.2) * Math.min(1, t*14); }
    var src = AC.createBufferSource(); src.buffer = buf;
    var g = AC.createGain(); g.gain.value = (vol||0.4) * (0.4+Math.random()*0.6);
    var f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 380 + Math.random()*650; f.Q.value = 0.8;
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
  }

  function drawLog(lg){
    ctx.save();
    ctx.translate(lg.x, lg.y); ctx.rotate(lg.ang);
    var L = lg.len, R = 11;
    var ch = 1 - lg.fuel/100;
    var g = ctx.createLinearGradient(0,-R,0,R);
    if (ch < 0.55) { g.addColorStop(0,'#8a5a30'); g.addColorStop(0.5,'#6e4423'); g.addColorStop(1,'#4e2d15'); }
    else { g.addColorStop(0,'#3a3a3a'); g.addColorStop(0.5,'#232323'); g.addColorStop(1,'#101010'); }
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(-L/2,-R,L,R*2,9); ctx.fill();
    ctx.fillStyle = ch < 0.55 ? '#c9a06b' : '#2c2c2c';
    ctx.beginPath(); ctx.ellipse(-L/2+3,0,5,R-2,0,0,Math.PI*2); ctx.fill();
    if (ch > 0.35) {
      ctx.strokeStyle = 'rgba(255,' + Math.floor(90+Math.random()*90) + ',20,' + (0.35+Math.random()*0.4) + ')';
      ctx.lineWidth = 1.6;
      for (var i=0;i<3;i++){ ctx.beginPath(); var sx = -L/2+12+Math.random()*(L-24); ctx.moveTo(sx,-R+3); ctx.lineTo(sx+6, R-3); ctx.stroke(); }
    }
    ctx.restore();
  }

  function frame(){
    t++;
    var burnRate = 100 / (80*60);
    for (var i=logs.length-1;i>=0;i--){
      logs[i].fuel -= burnRate * (1 + flare*0.6);
      if (logs[i].fuel <= 0){ logs.splice(i,1); stats.burned++; save(); updStats(); statusEl.textContent = 'Полено сгорело дотла — остались угли 🔥'; }
    }
    flare *= 0.985;
    var fl = fireLevel();
    ctx.clearRect(0,0,W,H);
    var vOp = vidOk ? (fl <= 0.03 ? 0 : Math.min(1, 0.3 + fl*0.8)) : 0;
    if (Math.abs(vOp - lastVOp) > 0.03){ firevid.style.opacity = vOp.toFixed(2); lastVOp = vOp; }
    var videoFire = vidOk && vOp > 0.05;
    if (!videoFire) {
    if (fl > 0.02){
      var gg = ctx.createRadialGradient(W/2,H-28,6, W/2,H-28, 218);
      gg.addColorStop(0,'rgba(255,160,45,' + (0.62*fl + Math.random()*0.08) + ')');
      gg.addColorStop(1,'rgba(255,80,0,0)');
      ctx.fillStyle = gg; ctx.fillRect(0,0,W,H);
    }
    for (var j=0;j<logs.length;j++) drawLog(logs[j]);
    if (stats.burned > 0 || logs.length){
      ctx.fillStyle = 'rgba(255,100,15,' + (0.35 + 0.35*fl + Math.random()*0.1) + ')';
      for (var c=0;c<9;c++){ ctx.beginPath(); ctx.ellipse(W/2-64+c*16, H-14, 9.5, 3.8, 0, 0, Math.PI*2); ctx.fill(); }
    }
    /* Пламя: внешний слой (оранжевый) + яркое ядро (жёлто-белое), режим наложения — свечение */
    ctx.globalCompositeOperation = 'lighter';
    var spawn = Math.floor(fl * 16) + (flare > 0.3 ? 5 : 0);
    for (var s2=0;s2<spawn;s2++){
      parts.push({ x: W/2 + (Math.random()*2-1) * (34+fl*72), y: H-31, vx:(Math.random()*0.6-0.3), vy:-(1.5+Math.random()*2.6)*(0.6+fl*0.75), life:0, max: 40+Math.random()*22, r: 14+Math.random()*20*(0.65+fl*0.75) });
      if (Math.random() < 0.75) cores.push({ x: W/2 + (Math.random()*2-1) * (20+fl*32), y: H-29, vx:(Math.random()*0.4-0.2), vy:-(1.3+Math.random()*2.0)*(0.6+fl*0.7), life:0, max: 26+Math.random()*16, r: 8+Math.random()*11*(0.65+fl*0.75) });
    }
    for (var p=parts.length-1;p>=0;p--){
      var pt = parts[p]; pt.life++;
      pt.x += pt.vx + Math.sin((t+pt.life)*0.22)*0.6;
      pt.y += pt.vy; pt.r *= 0.968;
      var k = pt.life/pt.max;
      if (k >= 1 || pt.r < 0.6){ parts.splice(p,1); continue; }
      var col = k < 0.3 ? '255,195,65' : (k < 0.65 ? '255,125,22' : '225,60,10');
      var rad = ctx.createRadialGradient(pt.x,pt.y,0, pt.x,pt.y, pt.r);
      rad.addColorStop(0,'rgba(' + col + ',' + (0.7*(1-k)) + ')');
      rad.addColorStop(1,'rgba(' + col + ',0)');
      ctx.fillStyle = rad;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
    }
    for (var q2=cores.length-1;q2>=0;q2--){
      var co = cores[q2]; co.life++;
      co.x += co.vx + Math.sin((t+co.life)*0.3)*0.4;
      co.y += co.vy; co.r *= 0.966;
      var k2 = co.life/co.max;
      if (k2 >= 1 || co.r < 0.5){ cores.splice(q2,1); continue; }
      var rad2 = ctx.createRadialGradient(co.x,co.y,0, co.x,co.y, co.r);
      rad2.addColorStop(0,'rgba(255,250,215,' + (0.9*(1-k2)) + ')');
      rad2.addColorStop(0.55,'rgba(255,220,100,' + (0.62*(1-k2)) + ')');
      rad2.addColorStop(1,'rgba(255,180,40,0)');
      ctx.fillStyle = rad2;
      ctx.beginPath(); ctx.arc(co.x,co.y,co.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if (fl > 0.25 && Math.random() < fl*0.55) burstSparks(1);
    for (var q=sparks.length-1;q>=0;q--){
      var sp = sparks[q]; sp.life--; sp.x += sp.vx + Math.sin(t*0.3+q)*0.3; sp.y += sp.vy; sp.vy *= 0.99;
      if (sp.life <= 0){ sparks.splice(q,1); continue; }
      ctx.fillStyle = 'rgba(255,' + (170+Math.floor(Math.random()*70)) + ',60,' + Math.min(1, sp.life/40) + ')';
      ctx.fillRect(sp.x, sp.y, 2.2, 2.2);
    }
    if (fl > 0.15 && Math.random() < 0.05) smokes.push({ x: W/2+(Math.random()*26-13), y: 50, r: 7, life: 0 });
    for (var m=smokes.length-1;m>=0;m--){
      var sm = smokes[m]; sm.life++; sm.y -= 0.5; sm.r += 0.14; sm.x += Math.sin(t*0.05+m)*0.2;
      if (sm.life > 90){ smokes.splice(m,1); continue; }
      ctx.fillStyle = 'rgba(160,160,170,' + (0.10*(1-sm.life/90)) + ')';
      ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.r, 0, Math.PI*2); ctx.fill();
    }
    }
    var flick = 0.85 + Math.random()*0.3;
    glow.style.opacity = (0.15 + fl*0.75*flick).toFixed(2);
    scene.classList.toggle('warm', fl > 0.35);
    var heat = Math.round(fl*100);
    heatfill.style.width = Math.max(3, heat) + '%';
    heatTxt.textContent = heat < 8 ? 'огонь погас 🥶' : heat < 30 ? 'прохладно' : heat < 55 ? 'теплеет 🙂' : heat < 80 ? 'тепло и уютно 😊' : 'жарко, как в бане! 🥵';
    if (noiseGain) noiseGain.gain.value = soundOn ? 0.015 + fl*0.06 : 0;
    if (soundOn && fl > 0.1 && Math.random() < fl*0.07) cracklePop(0.16);
    requestAnimationFrame(frame);
  }

  function updStats(){
    document.getElementById('stBurned').textContent = stats.burned;
    document.getElementById('stMarsh').textContent = stats.marsh;
  }
  document.getElementById('btnWood').addEventListener('click', addLog);
  document.getElementById('btnStoke').addEventListener('click', stoke);
  document.getElementById('btnMarsh').addEventListener('click', marsh);
  document.getElementById('btnSound').addEventListener('click', function(){
    initAudio();
    if (AC && AC.state === 'suspended') AC.resume();
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊 Треск включён' : '🔇 Включить треск';
    if (soundOn) statusEl.textContent = 'Слушай, как трещат дрова… 🎧🔥';
  });
  document.querySelector('.firebox').addEventListener('click', addLog);

  /* Носочки: Санта кладёт в них подарочки */
  var treats = ['🍬 конфета','🍫 шоколадка','🍭 леденец','🎁 маленький подарок','🪙 золотая монетка','🍊 мандаринка','⭐ звёздочка на ёлку','🧸 крошечный мишка'];
  var stockEls = document.querySelectorAll('.stocking');
  for (var si=0; si<stockEls.length; si++){
    stockEls[si].addEventListener('click', function(){
      var who = this.getAttribute('data-who');
      if (Math.random() < 0.22) {
        statusEl.textContent = 'В носочке ' + who + ' пока пусто… Санта ещё не приходил 🎅 Загляни позже!';
      } else {
        stats.gifts++; save();
        statusEl.textContent = 'В носочке ' + who + ' нашлось: ' + pick(treats) + '! 🎅 Всего подарков из носочков: ' + stats.gifts;
      }
      this.style.transform = 'scale(1.25)';
      var el = this; setTimeout(function(){ el.style.transform = ''; }, 220);
    });
  }

  addLog(); addLog(); logs[0].fuel = 82; logs[1].fuel = 64; flare = 0.4;
  updStats();
  requestAnimationFrame(frame);
})();
</script>
<!-- Значки-картинки (Twemoji): на компе Erik часть смайлов не рисуется шрифтом Windows и видна как □. Подменяем их картинками — одинаково на телефоне и на компе. -->
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>img.emoji{height:1em;width:1em;margin:0 .05em 0 .1em;vertical-align:-.1em}</style>
<script>
(function(){
  function parseAll(){ if(window.twemoji){ try{ twemoji.parse(document.body); }catch(e){} } }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',parseAll); } else { parseAll(); }
  if(window.MutationObserver){
    var mo=new MutationObserver(function(muts){
      if(!window.twemoji) return;
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.nodeType===1 && (!n.classList || !n.classList.contains('emoji'))){ try{ twemoji.parse(n); }catch(e){} }
        });
      });
    });
    mo.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
</body>
