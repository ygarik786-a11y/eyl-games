<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 Раскраски E.Y.L</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#1b1030;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;min-height:100%}
#app{max-width:480px;margin:0 auto;padding:12px 12px 24px}
h1{text-align:center;font-size:28px;line-height:1.2}
.sub{text-align:center;color:#d8b4fe;font-size:13px;margin:4px 0 12px}
.picker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;border:2px solid #ffffff33;background:#ffffff14;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
.pick .e{font-size:26px;display:block;text-align:center}
.pick.sel{border-color:#ffd94d;background:#ffd94d22;box-shadow:0 0 0 2px #ffd94d55}
#stageCard{background:#fff;border-radius:20px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#stage svg{display:block;width:100%;height:auto;touch-action:manipulation}
#stage .rg{cursor:pointer;stroke:#222;stroke-width:3;stroke-linejoin:round}
#stage .rg:active{opacity:.75}
#progress{text-align:center;font-weight:700;margin:10px 0 4px;color:#ffd94d}
#doneMsg{text-align:center;font-size:18px;font-weight:800;color:#7CFC98;min-height:26px}
#palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid #ffffff55;cursor:pointer;padding:0}
.sw.sel{border-color:#ffd94d;transform:scale(1.15);box-shadow:0 0 0 3px #ffd94d88}
.sw.eraser{background:#fff;color:#222;font-size:20px;font-weight:800}
#curColor{text-align:center;font-size:14px;color:#d8b4fe;margin-bottom:8px}
#curColor b{color:#fff}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;border:0;border-radius:16px;padding:13px 6px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(180deg,#3b5bff,#1f37c9);box-shadow:0 3px 0 #14207a;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #14207a}
.btn.gold{background:linear-gradient(180deg,#ffb400,#e07f00);box-shadow:0 3px 0 #7a4a00}
.btn.green{background:linear-gradient(180deg,#22c55e,#15803d);box-shadow:0 3px 0 #14532d}
.btn.gray{background:linear-gradient(180deg,#475569,#1e293b);box-shadow:0 3px 0 #0f172a}
.btn:disabled{opacity:.45}
.back{display:block;width:100%;margin-top:14px;text-align:center;color:#c7d2fe;text-decoration:none;font-weight:700;padding:10px}
.hint{text-align:center;font-size:12px;color:#b9a8e8;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <h1>🎨 Раскраски E.Y.L</h1>
  <p class="sub">Выбери картинку, возьми краску и раскрась! Нажми на часть картинки — она закрасится</p>
  <div class="picker" id="picker"></div>
  <div id="stageCard"><div id="stage"></div></div>
  <div id="progress"></div>
  <div id="doneMsg"></div>
  <div id="palette"></div>
  <div id="curColor">Краска: <b id="curName">Красная</b> <span id="curDot" style="display:inline-block;width:16px;height:16px;border-radius:50%;background:#e53935;vertical-align:-3px;border:2px solid #fff"></span></div>
  <div class="row">
    <button class="btn gray" id="btnUndo">↩ Отменить</button>
    <button class="btn gold" id="btnAuto">✨ За меня</button>
    <button class="btn green" id="btnSave">💾 Сохранить</button>
  </div>
  <div class="row">
    <button class="btn gray" id="btnClear" style="flex:1">🧹 Очистить всё</button>
  </div>
  <p class="hint">Раскраска сохраняется в телефоне — можно вернуться позже и дорисовать 💛<br>Кнопка «Сохранить» скачает картинку как фото — можно показать друзьям!</p>
  <a class="back" href="../">⬅️ На главную игр</a>
</div>
<script>
'use strict';

<circle class="rg" cx="40" cy="44" r="20"/><circle class="rg" cx="284" cy="36" r="16"/>

</svg>`,sample:['#fff','#fff','#ffd94d','#3aa655','#2e8b47','#1e6b34','#8d6e63','#e53935','#1e88e5','#ffd94d','#ec407a','#8e24aa','#e53935','#1e88e5','#fff']},

<circle class="rg" cx="272" cy="44" r="24"/><circle class="rg" cx="48" cy="52" r="13"/><circle class="rg" cx="78" cy="38" r="10"/>

<circle class="rg" cx="272" cy="42" r="24"/>
<path class="rg" d="M60 150 L160 70 L260 150 Z"/>

</svg>`,sample:['#ffd94d','#e53935','#ffcc9e','#8d6e63','#7ec8f7','#7ec8f7','#8d6e63','#fff','#fff','#8d6e63','#e53935','#3aa655','#3aa655']},
{id:'linda',e:'🐶',name:'Линда',svg:`<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
<ellipse class="rg" cx="98" cy="128" rx="22" ry="40"/><ellipse class="rg" cx="222" cy="128" rx="22" ry="40"/>
<circle class="rg" cx="160" cy="118" r="58"/>

<rect class="rg" x="118" y="252" width="18" height="26"/><rect class="rg" x="146" y="256" width="18" height="22"/><rect class="rg" x="180" y="256" width="18" height="22"/><rect class="rg" x="206" y="252" width="18" height="26"/>
<path class="rg" d="M232 196 Q276 186 274 146 Q272 128 256 140 Q248 164 238 180 Z"/>
<ellipse class="rg" cx="196" cy="216" rx="26" ry="16"/>
<circle cx="140" cy="108" r="6" fill="#222"/><circle cx="180" cy="108" r="6" fill="#222"/>
<circle class="rg" cx="160" cy="136" r="10"/>
<path class="rg" d="M60 288 Q80 268 104 284 Q128 300 150 284 Q170 268 190 284 Q210 300 232 284" fill="none"/>
<circle class="rg" cx="276" cy="282" r="16"/>
</svg>`,sample:['#8d6e63','#8d6e63','#ffcc9e','#ffcc9e','#8d6e63','#8d6e63','#8d6e63','#8d6e63','#8d6e63','#fff','#3aa655','#222','#ec407a','#fff','#e53935']}
];
const COLORS=[
{name:'Красная',v:'#e53935'},{name:'Оранжевая',v:'#fb8c00'},{name:'Жёлтая',v:'#fdd835'},
{name:'Зелёная',v:'#43a047'},{name:'Салатовая',v:'#7cb342'},{name:'Голубая',v:'#4fc3f7'},
{name:'Синяя',v:'#1e88e5'},{name:'Фиолетовая',v:'#8e24aa'},{name:'Розовая',v:'#ec407a'},
{name:'Коричневая',v:'#8d6e63'},{name:'Бежевая',v:'#ffcc9e'},{name:'Серая',v:'#90a4ae'},
{name:'Чёрная',v:'#222222'},{name:'Белая (ластик)',v:'#ffffff'}];
const KEY='eyl_coloring_v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){saved={};}
let cur=PICS[0],color=COLORS[0],hist=[];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));}catch(e){}}
function regions(){return Array.from(document.querySelectorAll('#stage .rg'));}
function fillOf(el){return el.getAttribute('fill')||'#ffffff';}
function render(){
  document.getElementById('picker').innerHTML=PICS.map(p=>'<button class="pick'+(p.id===cur.id?' sel':'')+'" data-id="'+p.id+'"><span class="e">'+p.e+'</span>'+p.name+'</button>').join('');
  document.getElementById('stage').innerHTML=cur.svg;
  const sv=saved[cur.id]||{};
  regions().forEach((el,i)=>{el.setAttribute('fill',sv[i]||'#ffffff');el.dataset.i=i;});
  hist=[];
  updateProgress();
}
function updateProgress(){
  const r=regions();const done=r.filter(el=>fillOf(el).toLowerCase()!=='#ffffff').length;
  document.getElementById('progress').textContent='Раскрашено '+done+' из '+r.length+' частей';
  document.getElementById('doneMsg').textContent=(done===r.length&&r.length>0)?'🎉 Картина готова! Ты — художник!':'';
  document.getElementById('btnUndo').disabled=hist.length===0;
}
function paint(el){
  const prev=fillOf(el);if(prev.toLowerCase()===color.v.toLowerCase())return;
  hist.push({el,prev});el.setAttribute('fill',color.v);
  const sv=saved[cur.id]=saved[cur.id]||{};sv[el.dataset.i]=color.v;persist();updateProgress();
}
document.getElementById('stage').addEventListener('click',e=>{
  const t=e.target.closest?e.target.closest('.rg'):null;if(t)paint(t);
});
document.getElementById('picker').addEventListener('click',e=>{
  const b=e.target.closest?e.target.closest('.pick'):null;if(!b)return;
  cur=PICS.find(p=>p.id===b.dataset.id);render();
});
document.getElementById('palette').innerHTML=COLORS.map((c,i)=>'<button class="sw'+(i===0?' sel':'')+(c.v==='#ffffff'?' eraser':'')+'" style="background:'+c.v+'" data-i="'+i+'" title="'+c.name+'">'+(c.v==='#ffffff'?'✕':'')+'</button>').join('');
document.getElementById('palette').addEventListener('click',e=>{
  const b=e.target.closest?e.target.closest('.sw'):null;if(!b)return;
  document.querySelectorAll('.sw').forEach(s=>s.classList.remove('sel'));b.classList.add('sel');
  color=COLORS[+b.dataset.i];
  document.getElementById('curName').textContent=color.name;
  document.getElementById('curDot').style.background=color.v;
});
document.getElementById('btnUndo').addEventListener('click',()=>{
  const h=hist.pop();if(!h)return;
  h.el.setAttribute('fill',h.prev);
  const sv=saved[cur.id]=saved[cur.id]||{};
  if(h.prev.toLowerCase()==='#ffffff')delete sv[h.el.dataset.i];else sv[h.el.dataset.i]=h.prev;
  persist();updateProgress();
});
document.getElementById('btnClear').addEventListener('click',()=>{
  if(!confirm('Очистить всю картинку?'))return;
  regions().forEach(el=>el.setAttribute('fill','#ffffff'));
  saved[cur.id]={};hist=[];persist();updateProgress();
});
document.getElementById('btnAuto').addEventListener('click',()=>{
  regions().forEach((el,i)=>{const c=cur.sample[i]||'#fdd835';el.setAttribute('fill',c);});
  const sv=saved[cur.id]={};regions().forEach((el,i)=>{sv[i]=cur.sample[i]||'#fdd835';});
  hist=[];persist();updateProgress();
});
document.getElementById('btnSave').addEventListener('click',()=>{
  try{
    const svgEl=document.querySelector('#stage svg');
    const clone=svgEl.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    clone.setAttribute('width','640');clone.setAttribute('height','640');
    const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x','0');bg.setAttribute('y','0');bg.setAttribute('width','320');bg.setAttribute('height','320');bg.setAttribute('fill','#ffffff');
    clone.insertBefore(bg,clone.firstChild);
    const xml=new XMLSerializer().serializeToString(clone);
    const img=new Image();
    img.onload=function(){
      const c=document.createElement('canvas');c.width=640;c.height=640;
      const x=c.getContext('2d');x.drawImage(img,0,0,640,640);
      const a=document.createElement('a');a.href=c.toDataURL('image/png');
      a.download='raskraska-'+cur.id+'.png';a.click();
    };
    img.onerror=function(){alert('Не получилось сохранить — попробуй ещё раз');};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
  }catch(e){alert('Не получилось сохранить — попробуй ещё раз');}
});
render();
</script>
</body>
</html>
