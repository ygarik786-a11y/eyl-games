<script>
var PAGE_VER=1;
fetch("../gversion.txt?x="+Date.now()).then(function(r){return r.text()}).then(function(t){
  var rv=parseInt(t,10);
  if(rv&&rv>PAGE_VER&&sessionStorage.getItem("upd-emoji-world")!==String(rv)){
    sessionStorage.setItem("upd-emoji-world",String(rv));
    location.replace(location.pathname+"?u="+rv);
  }
}).catch(function(){});
</script>

<body>
<div class="wrap">
  <div class="top"><a class="back" href="../">← Игры</a><h1>🌍 EMOJI WORLD</h1><span style="width:52px"></span></div>

<script>
// ================= СОСТОЯНИЕ =================
var SAVE_KEY='eyl-emoji-world-v1';
function defDet(){return{rep:0,money:200,ci:0,clues:{},talked:{},solved:0,failed:0}}
function defZom(){return{day:1,hp:100,hun:100,food:3,meds:1,mats:2,shelter:0,surv:0,dead:false,win:false,log:[]}}
function defMil(){return{cash:1000,bank:0,day:1,props:[],biz:[],cars:[],worth:1000}}
function defIsl(){return{day:1,hp:100,hun:100,wood:0,food:2,stone:0,vine:0,zones:{beach:true},camp:0,house:0,boat:0,win:false,dead:false,log:[]}}
function defCtr(){return{set:false,name:'',flag:'🏳️',money:1000,pop:1000,happy:60,cities:1,schools:0,hosp:0,roads:0,laws:[],allies:[],month:1,over:false,rating:0}}
function defaultState(){return{ach:{},det:defDet(),zom:defZom(),mil:defMil(),isl:defIsl(),ctr:defCtr()}}
var S;
try{S=JSON.parse(localStorage.getItem(SAVE_KEY))||defaultState()}catch(e){S=defaultState()}
if(!S.det)S=defaultState();
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
var toastTimer=null;
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},2600)}
function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function chance(p){return Math.random()<p}
function fmt(n){return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function ach(id,n,r){
  if(S.ach[id])return;
  S.ach[id]=true;
  toast('🏆 Достижение: '+n+'!');
}
// ================= ХАБ =================
var VIEW='hub',SUB=null;
var GAMES=[
  {id:'det',e:'🕵️',n:'Криминальный город',d:'Стань детективом: ищи улики, допрашивай подозреваемых и раскрывай дела.',pr:function(){return 'Дел раскрыто: '+S.det.solved+'/5 • Репутация: '+S.det.rep}},
  {id:'zom',e:'🧟',n:'Апокалипсис',d:'Мир зомби: ищи припасы, строй убежище и выживи 30 дней.',pr:function(){return S.zom.dead?'💀 Погиб на день '+S.zom.day:S.zom.win?'🏆 Выжил! День '+S.zom.day:'День '+S.zom.day+'/30 • ❤️ '+S.zom.hp}},
  {id:'mil',e:'💰',n:'Стань миллионером',d:'Начни с $1000: недвижимость, бизнес, машины. Стань миллиардером!',pr:function(){return 'Состояние: $'+fmt(netWorth())}},
  {id:'isl',e:'🏝️',n:'Необитаемый остров',d:'Один на острове: строй лагерь, исследуй и построй корабль домой.',pr:function(){return S.isl.win?'🏆 Вернулся домой!':'День '+S.isl.day+' • Корабль: '+Math.min(100,Math.round(S.isl.boat/40*100))+'%'}},
  {id:'ctr',e:'👑',n:'Создай свою страну',d:'Ты — президент: строй города, принимай законы и веди страну к счастью.',pr:function(){return S.ctr.set?S.ctr.flag+' '+S.ctr.name+' • 😊 '+S.ctr.happy+'% • Месяц '+S.ctr.month+'/12':'Страна ещё не создана'}}
];
function hubScreen(){
  var h='<div class="card" style="text-align:center"><div style="font-size:56px">🌍🎮</div><h2>Добро пожаловать в EMOJI WORLD!</h2><p>Выбери мир — и проживи в нём свою жизнь. Прогресс каждой игры сохраняется отдельно, достижения — общие.</p><p class="muted">🏆 Достижений: '+Object.keys(S.ach).length+'</p></div>';
  GAMES.forEach(function(g){
    h+='<div class="game" data-game="'+g.id+'"><span class="ic">'+g.e+'</span><span><span class="nm">'+g.n+'</span><br><span class="ds">'+g.d+'</span><br><span class="pr">'+g.pr()+'</span></span><span class="go">›</span></div>';
  });
  h+='<div class="card"><h2>🏆 Достижения мира</h2><p>';
  ACHLIST.forEach(function(a){
    h+='<span class="badge" style="'+(S.ach[a.id]?'':'opacity:.4')+'">'+a.e+' '+a.n+'</span>';
  });
  h+='</p></div>';
  return h;
}
var ACHLIST=[
  {id:'d1',e:'🕵️',n:'Первое дело'},{id:'d5',e:'🔍',n:'Легенда сыска'},
  {id:'z7',e:'🧟',n:'Неделя в аду'},{id:'z30',e:'🏆',n:'Выживший'},
  {id:'m1',e:'💰',n:'Первый миллион'},{id:'m9',e:'🤑',n:'Миллиардер'},
  {id:'i1',e:'🏝️',n:'Робинзон'},{id:'i2',e:'⛵',n:'Домой!'},
  {id:'c1',e:'👑',n:'Основатель'},{id:'c2',e:'🌟',n:'Легендарный лидер'}
];
function render(){
  var h='';
  if(VIEW==='hub')h=hubScreen();
  else if(VIEW==='det')h=detScreen();
  else if(VIEW==='zom')h=zomScreen();
  else if(VIEW==='mil')h=milScreen();
  else if(VIEW==='isl')h=islScreen();
  else if(VIEW==='ctr')h=ctrScreen();
  $('screen').innerHTML=h;
  save();
}
function backBtn(){return '<button class="btn ghost" id="backHub">← В главное меню EMOJI WORLD</button>'}

// ================= 1. 🕵️ КРИМИНАЛЬНЫЙ ГОРОД =================
var CASES=[
 {t:'Дело №1: Пропавший кот Барсик',d:'У бабушки Зины пропал кот Барсик. Подозреваются все соседи. Найди улики и вычисли похитителя.',
  places:[{n:'🏠 Квартира бабушки',c:'Кошачьи следы ведут к двери соседки.'},{n:'🌳 Двор',c:'Объявление о пропаже кто-то сорвал.'},{n:'🏚️ Подвал',c:'Миска с молоком — свежая, кто-то кормит кота здесь.'}],
  sus:[{e:'👵',n:'Соседка Вера',s:'«Я котов терпеть не могу! У меня аллергия!»'},{e:'🧹',n:'Дворник Петрович',s:'«Видел Барсика утром. Он за мной до подъезда шёл.»'},{e:'📮',n:'Почтальон',s:'«Я в дом даже не заходил, только ящик.»'}],
  cul:0,proof:'На пальто соседки Веры — рыжая шерсть Барсика, а в её подвале — его миска. Она «спасала» кота от улицы!'},
 {t:'Дело №2: Ограбление ювелирного',d:'Ночью обчистили ювелирный магазин. Витрина разбита, сейф пуст. Кто это сделал?',
  places:[{n:'💎 Магазин',c:'Витрина разбита ИЗНУТРИ — вор был внутри.'},{n:'🔐 Сейф',c:'Сейф открыт ключом. Взлома не было!'},{n:'🌃 Переулок',c:'След ботинка 44 размера ведёт к чёрному ходу.'}],
  sus:[{e:'💂',n:'Охранник Гриша',s:'«Я всю ночь спал на посту. Ничего не слышал.»'},{e:'🧹',n:'Уборщица Люда',s:'«Я ушла в шесть вечера. Дома была.»'},{e:'🛍️',n:'Продавец Игорь',s:'«Меня камера видела — я в кафе был.»'}],
  cul:0,proof:'У охранника Гриши ботинки 44 размера, а ключ от сейфа был только у него. Он сам разбил витрину изнутри!'},
 {t:'Дело №3: Отравленный торт',d:'На дне рождения именинник отравился тортом. Кто подсыпал яд?',
  places:[{n:'🍰 Кухня',c:'Пустая банка из-под яда — в шкафчике кондитера.'},{n:'🎂 Стол',c:'Отравлен только кусок именинника. Кто-то знал, где он сядет.'},{n:'🌿 Сад',c:'Следы ведут к кухонному окну — кто-то подглядывал.'}],
  sus:[{e:'👨‍🍳',n:'Кондитер Антон',s:'«Я к торту после выпечки не подходил!»'},{e:'🍽️',n:'Официант Олег',s:'«Я только разносил тарелки.»'},{e:'🎩',n:'Гость Виктор',s:'«Я с именинником дружу с детства!»'}],
  cul:0,proof:'Банка из-под яда лежала в шкафчике кондитера Антона, а яд был только в куске именинника — Антон знал рассадку!'},
 {t:'Дело №4: Письмо с угрозами',d:'Директор фирмы получил письмо с угрозами. Отправитель — кто-то из своих.',
  places:[{n:'🗄️ Кабинет',c:'Письмо напечатано на машинке из этого кабинета.'},{n:'📮 Почта',c:'Марка куплена в киоске рядом с офисом.'},{n:'📁 Архив',c:'Пропал документ, который невыгоден отправителю.'}],
  sus:[{e:'📝',n:'Секретарь Марина',s:'«Я ничего не печатала! У меня алиби!»'},{e:'💼',n:'Замдиректора',s:'«Мне угрозы невыгодны, я сам в деле.»'},{e:'🚴',n:'Курьер',s:'«Я просто развожу письма, не читаю.»'}],
  cul:0,proof:'На машинке секретаря Марины — та же лента, что и на письме. А пропал документ о её махинациях!'},
 {t:'Дело №5: Призрак театра',d:'Перед премьерой в театре появился «призрак» и сорвал спектакль. Кто за этим стоит?',
  places:[{n:'🎭 Сцена',c:'Верёвка люстры перерезана — аккуратно, ножом.'},{n:'💄 Гримёрка',c:'Парик «призрака» и белый грим.'},{n:'🎟️ Зал',c:'Билет с места режиссёра — он был в зале во время «явления».'}],
  sus:[{e:'🎬',n:'Режиссёр Стас',s:'«Я хочу, чтобы премьера состоялась! Это не я!»'},{e:'🎭',n:'Актёр Денис',s:'«Мне призрак тоже угрожал!»'},{e:'👗',n:'Костюмер Алла',s:'«Парик пропал из моей костюмерной…»'}],
  cul:0,proof:'Верёвку перерезали ножом из гримёрки, а билет доказывает: режиссёр Стас был в зале и дёргал её сам. Он хотел сорвать премьеру конкурента!'}
];
var RANKS=[[0,'🕵️ Новичок'],[20,'🔍 Сыщик'],[50,'⭐ Старший детектив'],[90,'👑 Легенда сыска']];
function detRank(){var r=RANKS[0][1];RANKS.forEach(function(x){if(S.det.rep>=x[0])r=x[1]});return r}
function detScreen(){
  var D=S.det;
  var h='<div class="card"><h2>🕵️ Криминальный город</h2><p>Репутация: <b>'+D.rep+'</b> • Звание: <b>'+detRank()+'</b> • 💰 '+fmt(D.money)+'</p><div class="bar"><i style="width:'+Math.min(100,D.rep)+'%"></i></div><p class="muted">Дел раскрыто: '+D.solved+'/5 • Ошибок: '+D.failed+'</p></div>';
  if(D.solved>=5){
    var end=D.rep>=90?'👑 Ты — Легенда сыска! Город спит спокойно, ведь ты на страже. Мэр вручил тебе ключ от города!':D.rep>=50?'⭐ Ты — старший детектив! Газеты пишут о тебе, преступники боятся твоего имени.':'🕵️ Все дела раскрыты! Ты — настоящий детектив, город гордится тобой.';
    h+='<div class="card"><h2>🎭 Финал карьеры</h2><p>'+end+'</p><button class="btn gold" data-detreset="1">Начать карьеру заново</button></div>'+backBtn();
    return h;
  }
  var c=CASES[D.ci];
  h+='<div class="card"><h2>'+c.t+'</h2><p>'+c.d+'</p>';
  h+='<p class="muted">Улик найдено: '+Object.keys(D.clues).length+'/3 • Допрошено: '+Object.keys(D.talked).length+'/3</p></div>';
  h+='<div class="card"><h2>🔍 Места преступления</h2>';

    var got=D.clues[i];
    h+='<button class="choice" data-clue="'+i+'">'+p.n+'<small>'+(got?('✅ '+p.c):'Осмотреть место')+'</small></button>';
  });
  h+='</div><div class="card"><h2>💬 Подозреваемые</h2>';

// ================= 2. 🧟 АПОКАЛИПСИС =================
function zomScreen(){
  var Z=S.zom;
  var h='<div class="card"><h2>🧟 Апокалипсис</h2><p>День <b>'+Z.day+'</b>/30 • 🏠 Убежище: ур. '+Z.shelter+' • 👥 Выжившие: '+Z.surv+'</p>';

var PENDING_NAME=null;
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-game],[data-clue],[data-talk],[data-accuse],[data-detreset],[data-zact],[data-zeat],[data-zheal],[data-zfight],[data-zrun],[data-zomreset],[data-mwork],[data-mbank],[data-mday],[data-mprop],[data-mbiz],[data-mcar],[data-milreset],[data-iact],[data-ieat],[data-isleep],[data-islreset],[data-cname],[data-cflag],[data-cbuild],[data-claw],[data-cally],[data-cmonth],[data-ctrreset],#backHub,#resetBtn');
  if(!t)return;
  // хаб
  if(t.dataset.game){VIEW=t.dataset.game;SUB=null;save();render();return}
  if(t.id==='backHub'){VIEW='hub';SUB=null;save();render();return}
  if(t.id==='resetBtn'){
    if(!confirm('Начать всё заново? Прогресс всех 5 игр EMOJI WORLD пропадёт.'))return;
    S=defaultState();VIEW='hub';SUB=null;save();render();toast('🌍 Новый мир ждёт тебя!');
    return;
  }
  // --- детектив ---
  if(t.dataset.clue!==undefined&&VIEW==='det'){
    var D=S.det,c=CASES[D.ci],i=+t.dataset.clue;
    if(!D.clues[i]){D.clues[i]=true;toast('🔍 Улика: '+c.places[i].c)}
    save();render();return;
  }
  if(t.dataset.talk!==undefined&&VIEW==='det'){
    var D=S.det,c=CASES[D.ci],i=+t.dataset.talk;
    if(!D.talked[i]){D.talked[i]=true;toast('💬 '+c.sus[i].n+': '+c.sus[i].s)}
    save();render();return;
  }
  if(t.dataset.accuse!==undefined&&VIEW==='det'){
    var D=S.det,c=CASES[D.ci],i=+t.dataset.accuse;
    D.wrong=D.wrong||[];
    if(Object.keys(D.clues).length<3||Object.keys(D.talked).length<3){toast('🔍 Сначала найди все 3 улики и допроси всех 3 подозреваемых!');return}
    if(D.wrong.indexOf(i)>=0){toast('⚖️ Он уже оправдан — выбери другого!');return}
    if(i===c.cul){
      var rep=10+D.ci*5,mon=100*(D.ci+1);
      D.rep+=rep;D.money+=mon;D.solved++;
      toast('✅ Дело раскрыто! '+c.proof);
      if(D.solved===1)ach('d1','Первое дело');
      if(D.solved>=5)ach('d5','Легенда сыска');
      D.ci++;D.clues={};D.talked={};D.wrong=[];
    }else{
      D.rep=Math.max(0,D.rep-5);D.failed++;D.wrong.push(i);
      toast('❌ Не тот! Репутация −5. Смотри внимательнее на улики.');
    }
    save();render();return;
  }
  if(t.dataset.detreset){S.det=defDet();save();render();return}
  // --- зомби ---
  if(t.dataset.zact){
    var Z=S.zom;
    if(Z.dead||Z.win)return;
    var a=t.dataset.zact;
    if(a==='scav'){
      var f=1+rnd(3),m=chance(0.4)?1:0,mt=1+rnd(3);
      Z.food+=f;Z.meds+=m;Z.mats+=mt;
      if(chance(0.35)){SUB={type:'fight'};zlog('🧟 Зомби заметил тебя во время поисков!');toast('🧟 Зомби рядом!');save();render();return}
      zlog('🔍 Нашёл припасы: +'+f+'🍖'+(m?' +1💊':'')+' +'+mt+'🔧');
      toast('🔍 Припасы: +'+f+'🍖 +'+mt+'🔧'+(m?' +1💊':''));
    }else if(a==='build'){
      if(Z.shelter>=5){toast('🏠 Убежище уже максимальное!');return}
      if(Z.mats<3){toast('🔧 Нужно 3 материала! У тебя '+Z.mats);return}
      Z.mats-=3;Z.shelter++;
      zlog('🏠 Убежище улучшено до ур. '+Z.shelter+'!');
      toast('🏠 Убежище: ур. '+Z.shelter);
    }else if(a==='surv'){
      var r=Math.random();
      if(r<0.5){Z.surv++;Z.food++;zlog('👥 Выживший присоединился к тебе! Принёс еду. Всего выживших: '+Z.surv);toast('👥 +1 выживший! Он принёс еду.')}
      else if(r<0.8){zlog('👥 Никого не нашёл. Город пуст…');toast('👥 Никого… Город пуст.')}
      else{if(Z.food>0){Z.food--;zlog('🦹 Встретил мародёра! Он стащил 1🍖 и убежал.');toast('🦹 Мародёр стащил еду!')}else{zlog('🦹 Мародёр хотел тебя ограбить, но брать нечего.');toast('🦹 Мародёр ушёл ни с чем.')}}
    }else if(a==='sleep'){zNight()}
    save();render();return;
  }
  if(t.dataset.zeat){var Z=S.zom;if(Z.food>0){Z.food--;Z.hun=Math.min(100,Z.hun+30);zlog('🍖 Поели. Сытость '+Z.hun);toast('🍖 Вкусно! Сытость '+Z.hun)}save();render();return}
  if(t.dataset.zheal){var Z=S.zom;if(Z.meds>0){Z.meds--;Z.hp=Math.min(100,Z.hp+30);zlog('💊 Лекарства помогли. Здоровье '+Z.hp);toast('💊 Здоровье '+Z.hp)}save();render();return}
  if(t.dataset.zfight){
    var Z=S.zom;
    if(chance(0.5)){Z.mats+=2;zlog('⚔️ Ты победил зомби! +2🔧');toast('⚔️ Победа! +2🔧')}
    else{Z.hp-=15;zlog('⚔️ Зомби тебя ранил! −15❤️');toast('⚔️ Ранен! −15❤️')}
    SUB=null;
    if(Z.hp<=0){Z.hp=0;Z.dead=true;zlog('💀 Раны оказались смертельными…')}
    save();render();return;
  }
  if(t.dataset.zrun){
    var Z=S.zom;
    if(chance(0.7)){zlog('🏃 Ты убежал от зомби!');toast('🏃 Убежал!')}
    else{Z.hp-=10;zlog('🏃 Зомби укусил тебя при побеге! −10❤️');toast('🏃 Укушен! −10❤️');if(Z.hp<=0){Z.hp=0;Z.dead=true}}
    SUB=null;save();render();return;
  }
  if(t.dataset.zomreset){S.zom=defZom();SUB=null;save();render();return}
  // --- миллионер ---
  if(t.dataset.mwork){
    var M=S.mil;
    if(M.worked){toast('💼 Ты уже работал сегодня. Жми «Следующий день»!');return}
    M.worked=true;M.cash+=200;toast('💼 +$200 за работу!');save();render();return;
  }
  if(t.dataset.mbank){
    var M=S.mil;
    if(M.cash>0){M.bank+=M.cash;toast('🏦 Положил в банк $'+fmt(M.cash)+'! Теперь там $'+fmt(M.bank));M.cash=0}
    else if(M.bank>0){M.cash+=M.bank;toast('🏦 Снял из банка $'+fmt(M.bank)+'!');M.bank=0}
    else toast('🏦 Пусто везде! Сначала заработай.');
    save();render();return;
  }
  if(t.dataset.mday){
    var M=S.mil;
    M.day++;M.worked=false;
    var inc=milIncome();
    M.cash+=inc;
    if(M.bank>0)M.bank=Math.round(M.bank*1.05);
    var exp=100+M.props.length*20+M.biz.length*50;
    M.cash-=exp;
    if(M.cash<0)M.cash=0;
    var ev=Math.random(),msg='📅 День '+M.day+': доход $'+fmt(inc)+' − расходы $'+fmt(exp);
    if(ev<0.12){var b=Math.round(netWorth()*0.05);M.cash+=b;msg+=' • 📈 Рынок вырос! +$'+fmt(b)}
    else if(ev<0.24){var l=Math.round(M.cash*0.05);M.cash=Math.max(0,M.cash-l);msg+=' • 📉 Рынок упал! −$'+fmt(l)}
    else if(ev<0.3){M.cash=Math.max(0,M.cash-200);msg+=' • 🧾 Налоговая проверка! −$200'}
    else if(ev<0.36){M.cash+=500;msg+=' • 🍀 Нашёл $500 на улице!'}
    toast(msg);
    if(netWorth()>=1000000)ach('m1','Первый миллион');
    if(netWorth()>=1000000000)ach('m9','Миллиардер');
    save();render();return;
  }
  function mbuy(list,key,arr){
    var M=S.mil,it=list.filter(function(x){return x.id===key})[0];
    if(!it||arr.indexOf(key)>=0)return;
    if(M.cash<it.p){toast('💰 Не хватает! Нужно $'+fmt(it.p));return}
    M.cash-=it.p;arr.push(key);
    toast('🎉 Куплено: '+it.e+' '+it.n+'!');
  }
  if(t.dataset.mprop){mbuy(PROPS,t.dataset.mprop,S.mil.props);save();render();return}
  if(t.dataset.mbiz){mbuy(BIZ,t.dataset.mbiz,S.mil.biz);save();render();return}
  if(t.dataset.mcar){mbuy(CARS,t.dataset.mcar,S.mil.cars);save();render();return}
  if(t.dataset.milreset){S.mil=defMil();save();render();return}
  // --- остров ---
  if(t.dataset.iact){
    var I=S.isl;
    if(I.dead||I.win)return;
    var a=t.dataset.iact;
    if(a==='gather'){
      var w=2+rnd(3),f=1+rnd(2),s=rnd(3),v=rnd(2);
      I.wood+=w;I.food+=f;I.stone+=s;I.vine+=v;I.hun=Math.max(0,I.hun-5);
      I.gathers=(I.gathers||0)+1;
      if(I.gathers>=2&&!I.zones.forest){I.zones.forest=true;ilog('🌳 Открыта новая территория: Лес!');toast('🌳 Открыт Лес!')}
      ilog('🌴 Собрал: +'+w+'🪵 +'+f+'🍖 +'+s+'🪨 +'+v+'🌿');
      toast('🌴 +'+w+'🪵 +'+f+'🍖 +'+s+'🪨');
    }else if(a==='fish'){
      var f2=2+rnd(3);I.food+=f2;I.hun=Math.max(0,I.hun-5);
      ilog('🎣 Наловил рыбы: +'+f2+'🍖');toast('🎣 +'+f2+'🍖!');
    }else if(a==='explore'){
      I.hun=Math.max(0,I.hun-10);
      if(I.wood>=5&&!I.zones.cave){I.zones.cave=true;ilog('🕳️ Открыта Пещера!');toast('🕳️ Открыта Пещера!')}
      if(I.house&&!I.zones.volcano){I.zones.volcano=true;ilog('🌋 Открыт Вулкан!');toast('🌋 Открыт Вулкан!')}
      var r=Math.random();
      if(r<0.35){I.food+=3;I.wood+=2;ilog('🔍 Нашёл заброшенный тайник: +3🍖 +2🪵');toast('🔍 Тайник! +3🍖 +2🪵')}
      else if(r<0.55){if(I.food>0){I.food--;ilog('🐒 Обезьяна стащила 1🍖! Вот нахалка.');toast('🐒 Обезьяна стащила еду!')}else{ilog('🐒 Обезьяна хотела стащить еду, но брать нечего.');toast('🐒 Обезьяна ушла ни с чем.')}}
      else if(r<0.75){I.stone+=4;ilog('🔍 Нашёл камни: +4🪨');toast('🔍 +4🪨!')}
      else{I.vine+=3;ilog('🔍 Нашёл лианы: +3🌿');toast('🔍 +3🌿!')}
    }else if(a==='build'){
      if(I.camp<3&&I.wood>=5){I.wood-=5;I.camp++;ilog('🏕️ Лагерь улучшен до ур. '+I.camp+'!');toast('🏕️ Лагерь: ур. '+I.camp);if(I.camp===1)ach('i1','Робинзон')}
      else if(!I.house&&I.wood>=10&&I.stone>=5){I.wood-=10;I.stone-=5;I.house=true;ilog('🏠 Дом построен! Теперь есть где укрыться от дождя.');toast('🏠 Дом построен!')}
      else if(I.boat<40&&I.wood>=10&&I.vine>=5){I.wood-=10;I.vine-=5;I.boat+=10;ilog('⛵ Корабль: '+I.boat+'/40 готово!');toast('⛵ Корабль: '+I.boat+'/40');if(I.boat>=40){I.win=true;ach('i2','Домой!')}}
      else{
        if(I.camp<3)toast('🏕️ Для лагеря нужно 5🪵 (у тебя '+I.wood+')');
        else if(!I.house)toast('🏠 Для дома нужно 10🪵 и 5🪨');
        else toast('⛵ Для корабля нужно 10🪵 и 5🌿');
      }
    }
    save();render();return;
  }
  if(t.dataset.ieat){var I=S.isl;if(I.food>0){I.food--;I.hun=Math.min(100,I.hun+30);ilog('🍖 Поели. Сытость '+I.hun);toast('🍖 Сытость '+I.hun)}save();render();return}
  if(t.dataset.isleep){
    var I=S.isl;
    I.day++;I.hun=Math.max(0,I.hun-25);
    if(I.hun<=0){I.hp-=10;ilog('🍖 Голод! −10❤️')}
    if(I.hp<=0){I.hp=0;I.dead=true;ilog('💀 Остров победил…')}
    else ilog('🌙 День '+I.day+'. Ты всё ещё жив. Так держать!');
    save();render();return;
  }
  if(t.dataset.islreset){S.isl=defIsl();save();render();return}
  // --- страна ---
  if(t.dataset.cname){PENDING_NAME=t.dataset.cname;toast('📛 Название: '+PENDING_NAME+'. Теперь выбери флаг!');save();render();return}
  if(t.dataset.cflag){
    if(!PENDING_NAME){toast('📛 Сначала выбери название страны!');return}
    S.ctr.set=true;S.ctr.name=PENDING_NAME;S.ctr.flag=t.dataset.cflag;
    PENDING_NAME=null;
    ach('c1','Основатель');
    toast('👑 Страна '+S.ctr.flag+' '+S.ctr.name+' основана!');
    save();render();return;
  }
  if(t.dataset.cbuild){
    var C=S.ctr;
    if(C.acted){toast('📅 Ты уже действовал в этом месяце — жми «Следующий месяц»!');return}
    var b=t.dataset.cbuild,cost={city:500,school:300,hosp:400,road:200}[b];
    if(C.money<cost){toast('💰 Не хватает! Нужно '+cost+'💰');return}
    C.money-=cost;C.acted=true;
    if(b==='city'){C.cities++;C.pop+=500;toast('🏙️ Новый город! +500 жителей')}
    if(b==='school'){C.schools++;C.happy=Math.min(100,C.happy+5);toast('🏫 Школа построена! +5😊')}
    if(b==='hosp'){C.hosp++;C.happy=Math.min(100,C.happy+8);toast('🏥 Больница построена! +8😊')}
    if(b==='road'){C.roads++;toast('🛣️ Дорога построена! Доход вырос')}
    save();render();return;
  }
  if(t.dataset.claw){
    var C=S.ctr;
    if(C.acted){toast('📅 Ты уже действовал в этом месяце — жми «Следующий месяц»!');return}
    var l=t.dataset.claw;
    if(C.laws.indexOf(l)>=0){toast('📜 Этот закон уже принят!');return}
    C.laws.push(l);C.acted=true;
    if(l==='tax'){C.money+=300;C.happy=Math.max(0,C.happy-5);toast('💰 Налоги повышены! +300💰, −5😊')}
    if(l==='fest'){if(C.money<200){toast('💰 Не хватает 200💰 на праздник!');C.laws.pop();C.acted=false;return}C.money-=200;C.happy=Math.min(100,C.happy+10);toast('🎉 Праздник! Народ счастлив! +10😊')}
    if(l==='green'){C.money-=100;C.happy=Math.min(100,C.happy+8);toast('🌿 Зелёный закон! +8😊')}
    save();render();return;
  }
  if(t.dataset.cally){
    var C=S.ctr,nb=t.dataset.cally;
    if(C.allies.indexOf(nb)>=0){toast('🤝 Вы уже союзники!');return}
    if(C.acted){toast('📅 Ты уже действовал в этом месяце — жми «Следующий месяц»!');return}
    if(C.money<200){toast('💰 Не хватает 200💰 на союз!');return}
    C.money-=200;C.allies.push(nb);C.acted=true;
    toast('🤝 Союз с '+nb+' заключён! +100💰/мес');
    save();render();return;
  }
  if(t.dataset.cmonth){
    var C=S.ctr;
    C.money+=ctrIncome();
    C.month++;C.acted=false;
    var ev=Math.random(),msg='📅 Месяц '+C.month+': доход +'+fmt(ctrIncome());
    if(ev<0.15){C.money-=200;C.happy=Math.max(0,C.happy-5);msg+=' • 🌊 Наводнение! −200💰 −5😊'}
    else if(ev<0.3){C.happy=Math.min(100,C.happy+5);msg+=' • 🎉 Фестиваль! +5😊'}
    else if(ev<0.45){C.money+=300;msg+=' • 💎 Нашли золото! +300💰'}
    else if(ev<0.55&&C.happy<40){C.pop=Math.max(0,C.pop-100);C.happy=Math.max(0,C.happy-5);msg+=' • ✊ Протесты! −100 жителей'}
    toast(msg);
    if(C.month>12){
      C.over=true;
      C.rating=C.happy+Math.round(C.pop/100)+Math.round(C.money/100);
      if(C.rating>=200)ach('c2','Легендарный лидер');
    }
    save();render();return;
  }
  if(t.dataset.ctrreset){S.ctr=defCtr();PENDING_NAME=null;save();render();return}
});
// ================= СТАРТ =================
render();
</script>
</body>
</html>
