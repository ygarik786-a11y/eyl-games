<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏪 Магазинчик — E.Y.L Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0d1117; color:#e6edf3; min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:10px 10px 26px; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .back { color:#58a6ff; text-decoration:none; font-size:15px; background:#161b22; border:1px solid #30363d; padding:7px 12px; border-radius:10px; }
  h1 { font-size:21px; }
  .hud { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .hud .cell { flex:1; min-width:86px; background:#161b22; border:1px solid #30363d; border-radius:12px; padding:7px 8px; text-align:center; font-size:15px; }
  .hud .cell b { display:block; font-size:16px; color:#ffd93d; }
  .hud .cell span { font-size:11px; color:#8b949e; }
  #scene { position:relative; border-radius:16px; overflow:hidden; border:2px solid #8a6d1f; background:linear-gradient(180deg,#3d2f0a,#241b05 70%,#171003); padding:12px 10px 10px; min-height:170px; }
  #shopName { text-align:center; font-size:19px; font-weight:800; margin-bottom:8px; }
  #shelves { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
  .shelf { background:#5d4310; border:2px solid #8a6d1f; border-radius:10px; min-width:64px; padding:6px 4px; text-align:center; font-size:22px; position:relative; }
  .shelf small { display:block; font-size:11px; color:#ffd93d; font-weight:700; }
  .shelf.empty { opacity:.45; }
  #custLine { text-align:center; font-size:24px; min-height:32px; margin-top:8px; letter-spacing:2px; }
  #sceneMsg { text-align:center; font-size:14px; font-weight:700; color:#ffd93d; min-height:19px; margin-top:2px; }
  .modes { display:flex; gap:6px; margin:10px 0; }
  .modebtn { flex:1; background:#161b22; border:2px solid #30363d; color:#e6edf3; border-radius:10px; padding:9px 4px; font-size:14px; cursor:pointer; }
  .modebtn.on { border-color:#ffd93d; background:#2a2410; }
  .tabs { display:flex; gap:6px; margin:6px 0 8px; }
  .tabbtn { flex:1; background:#161b22; border:2px solid #30363d; color:#e6edf3; border-radius:10px; padding:9px 4px; font-size:15px; cursor:pointer; }
  .tabbtn.on { border-color:#ffd93d; background:#2a2410; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:10px; }
  .row { display:flex; align-items:center; gap:9px; padding:8px 4px; border-bottom:1px solid #21262d; }
  .row:last-child { border-bottom:none; }
  .row .ic { font-size:26px; }
  .row .tx { flex:1; font-size:14px; }
  .row .tx small { display:block; color:#8b949e; font-size:12px; }
  .bar { height:7px; background:#30363d; border-radius:4px; margin-top:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#ffd93d; border-radius:4px; }
  .act { background:#ffd93d; color:#111; border:none; border-radius:9px; padding:8px 10px; font-weight:800; font-size:13px; cursor:pointer; white-space:nowrap; }
  .act.green { background:#238636; color:#fff; }
  .act:disabled { background:#30363d; color:#8b949e; }
  .btnrow { display:flex; gap:6px; }
  .foot { text-align:center; color:#8b949e; font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="../">← Игры</a><h1>🏪 Магазинчик</h1></div>

  <div class="hud">
    <div class="cell"><b id="hudCoins">0</b><span>🪙 монеты</span></div>
    <div class="cell"><b id="hudSold">0</b><span>🧾 продано</span></div>
    <div class="cell"><b id="hudStock">0</b><span>📦 на полках</span></div>
    <div class="cell"><b id="hudLvl">Лавка</b><span>🏪 магазин</span></div>
  </div>

  <div id="scene">
    <div id="shopName">🏪 Лавка</div>
    <div id="shelves"></div>
    <div id="custLine">🚶</div>
    <div id="sceneMsg"></div>
  </div>

  <div class="modes">
    <button class="modebtn" id="modebtn-0" onclick="setMode(0)">💸 Скидки<br><small>дешевле — берут чаще</small></button>
    <button class="modebtn on" id="modebtn-1" onclick="setMode(1)">⚖️ Обычные цены</button>
    <button class="modebtn" id="modebtn-2" onclick="setMode(2)">💰 Дорого<br><small>прибыль больше — берут реже</small></button>
  </div>

  <div class="tabs">
    <button class="tabbtn on" id="tabbtn-goods" onclick="openTab('goods')">📦 Товары и полки</button>
    <button class="tabbtn" id="tabbtn-tasks" onclick="openTab('tasks')">📋 Задания</button>
  </div>
  <div class="panel" id="panel-goods"></div>
  <div class="panel" id="panel-tasks" style="display:none"></div>

  <div class="foot">Игра от создателя E.Y.L · закупай дёшево — продавай дорого · магазин торгует, даже пока тебя нет 💛</div>
</div>
<script>
'use strict';
/* ============ МАГАЗИНЧИК E.Y.L ============ */
var SAVE_KEY = 'eyl-shop-v1';
var LEVELS = [
  { name:'Лавка',       e:'🏪', slots:3,  interval:6, price:0 },
  { name:'Магазин',     e:'🏬', slots:5,  interval:5, price:1500 },
  { name:'Супермаркет', e:'🛒', slots:8,  interval:4, price:8000 },
  { name:'Мегамаркет',  e:'🏙️', slots:12, interval:3, price:30000 }
];
var PRODUCTS = [
  { id:'bread',  e:'🍞', name:'Хлеб',      buy:5,    sell:12,   lvl:0 },
  { id:'milk',   e:'🥛', name:'Молоко',    buy:8,    sell:18,   lvl:0 },
  { id:'apple',  e:'🍎', name:'Яблоки',    buy:6,    sell:15,   lvl:0 },
  { id:'eggs',   e:'🥚', name:'Яйца',      buy:7,    sell:16,   lvl:0 },
  { id:'cheese', e:'🧀', name:'Сыр',       buy:20,   sell:45,   lvl:1 },
  { id:'choco',  e:'🍫', name:'Шоколад',   buy:15,   sell:35,   lvl:1 },
  { id:'cake',   e:'🍰', name:'Торты',     buy:40,   sell:95,   lvl:1 },
  { id:'shirt',  e:'👕', name:'Футболки',  buy:60,   sell:140,  lvl:1 },
  { id:'watch',  e:'⌚', name:'Часы',      buy:200,  sell:480,  lvl:2 },
  { id:'phone',  e:'📱', name:'Телефоны',  buy:300,  sell:720,  lvl:2 },
  { id:'laptop', e:'💻', name:'Ноутбуки',  buy:800,  sell:1850, lvl:2 },
  { id:'bike',   e:'🚲', name:'Велосипеды',buy:1200, sell:2800, lvl:3 },
  { id:'sofa',   e:'🛋️', name:'Диваны',    buy:2000, sell:4600, lvl:3 },
  { id:'diam',   e:'💎', name:'Украшения', buy:1500, sell:3700, lvl:3 }
];
var MODES = [
  { name:'Скидки', priceMul:0.8, freqMul:1.6 },
  { name:'Обычные', priceMul:1, freqMul:1 },
  { name:'Дорого', priceMul:1.45, freqMul:0.5 }
];
var TASKS = [
  { id:'sold', icon:'🧾', name:'Продай товаров',        tiers:[20,100,500,2000],      rewards:[100,500,2500,12000] },
  { id:'earn', icon:'🪙', name:'Заработай на продажах', tiers:[1000,10000,60000,300000], rewards:[150,800,4000,20000] },
  { id:'stock',icon:'📦', name:'Закупи товаров оптом',  tiers:[50,300,1500,6000],     rewards:[100,600,3000,15000] },
  { id:'lvl',  icon:'🏪', name:'Уровень магазина',      tiers:[2,3,4],                rewards:[500,2000,10000], val:'lvl' }
];
var DAILY_POOL = [
  { id:'sold', icon:'🧾', name:'Продай 10 товаров',    target:10,  reward:150 },
  { id:'earn', icon:'🪙', name:'Заработай 500 монет',  target:500, reward:150 },
  { id:'stock',icon:'📦', name:'Закупи 15 товаров',    target:15,  reward:150 }
];
var CUST = ['🧑','👩','👨','👵','👴','🧒','👱‍♀️','🧔','👩‍🦰','👨‍🦱'];

function defState() {
  return {
    coins:150, level:0, mode:1, stock:{}, onShelf:[],
    prog:{ sold:0, earn:0, stock:0 },
    tier:{ sold:0, earn:0, stock:0, lvl:0 },
    daily:{ date:'', idx:0, base:0, claimed:false },
    saleAcc:0, lastSeen:Date.now()
  };
}
var S = defState();
try {
  var raw = localStorage.getItem(SAVE_KEY);
  if (raw) { var p = JSON.parse(raw); var d = defState();
    for (var k in d) { if (p[k] !== undefined) S[k] = p[k]; }
    for (var k2 in d.prog) { if (S.prog[k2] === undefined) S.prog[k2] = 0; }
    for (var k3 in d.tier) { if (S.tier[k3] === undefined) S.tier[k3] = 0; }
  }
} catch (e) {}
function save() { S.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function prodDef(id) { for (var i=0;i<PRODUCTS.length;i++) if (PRODUCTS[i].id===id) return PRODUCTS[i]; return PRODUCTS[0]; }
function lvlDef() { return LEVELS[S.level]; }
function totalStock() { var n = 0; for (var k in S.stock) n += S.stock[k]; return n; }
function sellPriceOf(pd) { return Math.round(pd.sell * MODES[S.mode].priceMul); }
function todayStr() { var t = new Date(); return t.getFullYear() + '-' + (t.getMonth()+1) + '-' + t.getDate(); }
function dailyDef() { return DAILY_POOL[S.daily.idx % DAILY_POOL.length]; }
function ensureDaily() {
  var t = todayStr();
  if (S.daily.date !== t) {
    var idx = 0; for (var i=0;i<t.length;i++) idx += t.charCodeAt(i);
    S.daily = { date:t, idx: idx % DAILY_POOL.length, base:0, claimed:false };
    S.daily.base = S.prog[dailyDef().id] || 0;
  }
}
function dailyProg() { var d = dailyDef(); return Math.min(d.target, (S.prog[d.id] || 0) - S.daily.base); }

/* ---- торговля ---- */
function stockedShelf() {
  return S.onShelf.filter(function(id){ return (S.stock[id] || 0) > 0; });
}
function trySale() {
  var avail = stockedShelf();
  if (avail.length === 0) return null;
  var id = avail[Math.floor(Math.random() * avail.length)];
  var pd = prodDef(id);
  var price = sellPriceOf(pd);
  S.stock[id] -= 1;
  S.coins += price;
  S.prog.sold += 1; S.prog.earn += price;
  return { pd: pd, price: price };
}
function advanceSales(seconds, offline) {
  var rate = offline ? 0.5 : 1;
  var interval = lvlDef().interval / (MODES[S.mode].freqMul * rate);
  S.saleAcc += seconds;
  var made = 0, earned = 0;
  while (S.saleAcc >= interval) {
    S.saleAcc -= interval;
    var r = trySale();
    if (!r) { S.saleAcc = 0; break; }
    made++; earned += r.price;
    if (made > 5000) break;
  }
  return { made: made, earned: earned };
}
function offlineSales() {
  var now = Date.now();
  var elapsed = Math.min(4 * 3600, Math.max(0, (now - (S.lastSeen || now)) / 1000));
  var res = { made:0, earned:0 };
  if (elapsed > 60) res = advanceSales(elapsed, true);
  S.lastSeen = now;
  return res;
}

/* ---- действия ---- */
function stockUp(id, n) {
  var pd = prodDef(id);
  if (pd.lvl > S.level) return false;
  var cost = pd.buy * n;
  if (S.coins < cost) { sceneSay('Не хватает монет на закупку 🪙'); return false; }
  S.coins -= cost;
  S.stock[id] = (S.stock[id] || 0) + n;
  S.prog.stock += n;
  if (S.onShelf.indexOf(id) < 0 && S.onShelf.length < lvlDef().slots) S.onShelf.push(id);
  save(); renderAll();
  return true;
}
function toggleShelf(id) {
  var i = S.onShelf.indexOf(id);
  if (i >= 0) { S.onShelf.splice(i, 1); }
  else {
    if (S.onShelf.length >= lvlDef().slots) { sceneSay('Полки полные! Улучши магазин, чтобы было больше полок 🏪'); return false; }
    S.onShelf.push(id);
  }
  save(); renderAll();
  return true;
}
function setMode(m) { S.mode = m; save(); renderAll(); }
function upgradeShop() {
  var next = LEVELS[S.level + 1];
  if (!next || S.coins < next.price) return false;
  S.coins -= next.price; S.level += 1;
  sceneSay('Теперь у тебя ' + next.name + '! ' + next.e + ' Полок: ' + next.slots + ', покупатели чаще!');
  save(); renderAll();
  return true;
}
function claimTask(id) {
  var t = null; TASKS.forEach(function(x){ if (x.id===id) t = x; });
  if (!t) return;
  var ti = S.tier[id] || 0;
  if (ti >= t.tiers.length) return;
  var val = t.val === 'lvl' ? (S.level + 1) : (S.prog[id] || 0);
  if (val < t.tiers[ti]) return;
  S.coins += t.rewards[ti]; S.tier[id] = ti + 1;
  save(); renderAll();
}
function claimDaily() {
  ensureDaily();
  if (S.daily.claimed) return;
  var d = dailyDef();
  if (dailyProg() < d.target) return;
  S.coins += d.reward; S.daily.claimed = true;
  save(); renderAll();
}
/* ============ ОТРИСОВКА ============ */
var lastMsg = '';
function sceneSay(txt) { lastMsg = txt; var m = $('sceneMsg'); if (m) m.textContent = txt; }
function renderScene() {
  var L = lvlDef();
  $('shopName').textContent = L.e + ' ' + L.name;
  var h = '';
  if (S.onShelf.length === 0) h = '<div style="color:#c9a227;font-size:14px">Полки пустые — выбери товары внизу 👇</div>';
  S.onShelf.forEach(function(id){
    var pd = prodDef(id), n = S.stock[id] || 0;
    h += '<div class="shelf' + (n === 0 ? ' empty' : '') + '">' + pd.e + '<small>×' + n + '</small></div>';
  });
  $('shelves').innerHTML = h;
  var line = '';
  if (stockedShelf().length > 0) {
    for (var i = 0; i < 4; i++) line += CUST[Math.floor(Math.random() * CUST.length)];
  } else line = '😴';
  $('custLine').textContent = line;
  if (lastMsg) $('sceneMsg').textContent = lastMsg;
}
function renderHUD() {
  $('hudCoins').textContent = S.coins;
  $('hudSold').textContent = S.prog.sold;
  $('hudStock').textContent = totalStock();
  $('hudLvl').textContent = lvlDef().name;
  for (var i = 0; i < 3; i++) $('modebtn-' + i).className = 'modebtn' + (S.mode === i ? ' on' : '');
}
function renderGoods() {
  var h = '';
  var next = LEVELS[S.level + 1];
  if (next) {
    h += '<div class="row"><div class="ic">' + next.e + '</div><div class="tx"><b>Улучшить до «' + next.name + '»</b><small>Полок: ' + next.slots + ' · покупатели каждые ' + next.interval + ' сек · новые товары</small></div>' +
      '<button class="act green" ' + (S.coins >= next.price ? '' : 'disabled') + ' onclick="upgradeShop()">Купить ' + next.price + ' 🪙</button></div>';
  } else {
    h += '<div class="row"><div class="ic">🏙️</div><div class="tx"><b>Мегамаркет</b><small>Самый крутой магазин ✔️</small></div></div>';
  }
  PRODUCTS.forEach(function(pd){
    var locked = pd.lvl > S.level;
    var n = S.stock[pd.id] || 0;
    var onSh = S.onShelf.indexOf(pd.id) >= 0;
    if (locked) {
      h += '<div class="row"><div class="ic">' + pd.e + '</div><div class="tx"><b>' + pd.name + '</b><small>Откроется в магазине «' + LEVELS[pd.lvl].name + '» 🔒</small></div></div>';
      return;
    }
    h += '<div class="row"><div class="ic">' + pd.e + '</div><div class="tx"><b>' + pd.name + '</b> · на складе: ' + n +
      '<small>Закупка: ' + pd.buy + ' 🪙 · продажа: ' + sellPriceOf(pd) + ' 🪙 · прибыль: ' + (sellPriceOf(pd) - pd.buy) + '</small></div>' +
      '<div class="btnrow">' +
      '<button class="act" onclick="toggleShelf(\'' + pd.id + '\')">' + (onSh ? 'С полки ✔️' : 'На полку') + '</button>' +
      '<button class="act" ' + (S.coins >= pd.buy ? '' : 'disabled') + ' onclick="stockUp(\'' + pd.id + '\',1)">+1 · ' + pd.buy + ' 🪙</button>' +
      '<button class="act" ' + (S.coins >= pd.buy * 10 ? '' : 'disabled') + ' onclick="stockUp(\'' + pd.id + '\',10)">+10 · ' + (pd.buy * 10) + ' 🪙</button>' +
      '</div></div>';
  });
  $('panel-goods').innerHTML = h;
}
function renderTasks() {
  ensureDaily();
  var h = '';
  var dd = dailyDef(), dp = dailyProg();
  h += '<div class="row"><div class="ic">📅</div><div class="tx"><b>Задание дня:</b> ' + dd.name +
    '<small>Награда: ' + dd.reward + ' 🪙 · прогресс: ' + dp + ' / ' + dd.target + '</small>' +
    '<div class="bar"><i style="width:' + Math.round(100 * dp / dd.target) + '%"></i></div></div>' +
    (S.daily.claimed ? '<button class="act" disabled>Взято ✔️</button>' : '<button class="act" ' + (dp >= dd.target ? '' : 'disabled') + ' onclick="claimDaily()">Забрать ' + dd.reward + ' 🪙</button>') + '</div>';
  TASKS.forEach(function(t){
    var ti = S.tier[t.id] || 0;
    var val = t.val === 'lvl' ? (S.level + 1) : (S.prog[t.id] || 0);
    if (ti >= t.tiers.length) {
      h += '<div class="row"><div class="ic">' + t.icon + '</div><div class="tx">' + t.name + '<small>Все награды взяты ✔️</small></div></div>';
      return;
    }
    var target = t.tiers[ti], prog = Math.min(target, val);
    h += '<div class="row"><div class="ic">' + t.icon + '</div><div class="tx">' + t.name +
      '<small>Награда: ' + t.rewards[ti] + ' 🪙 · прогресс: ' + prog + ' / ' + target + '</small>' +
      '<div class="bar"><i style="width:' + Math.round(100 * prog / target) + '%"></i></div></div>' +
      '<button class="act" ' + (prog >= target ? '' : 'disabled') + ' onclick="claimTask(\'' + t.id + '\')">Забрать ' + t.rewards[ti] + ' 🪙</button></div>';
  });
  $('panel-tasks').innerHTML = h;
}
function renderAll() { renderHUD(); renderScene(); renderGoods(); renderTasks(); }
function openTab(name) {
  ['goods','tasks'].forEach(function(t){
    $('panel-' + t).style.display = (t === name) ? 'block' : 'none';
    $('tabbtn-' + t).className = 'tabbtn' + (t === name ? ' on' : '');
  });
  if (name === 'goods') renderGoods();
  if (name === 'tasks') renderTasks();
}

/* ============ ЦИКЛ ============ */
var tickN = 0;
setInterval(function(){
  var r = advanceSales(1, false);
  tickN++;
  if (r.made > 0) {
    sceneSay('Покупатели взяли товаров: ' + r.made + ' · +' + r.earned + ' 🪙');
    renderHUD(); renderScene();
    if (tickN % 5 === 0) { renderGoods(); renderTasks(); }
    save();
  } else if (tickN % 5 === 0) {
    renderScene();
  }
}, 1000);
document.addEventListener('visibilitychange', function(){ if (document.hidden) save(); });

/* ---- старт ---- */
ensureDaily();
var offRes = offlineSales();
renderAll();
if (offRes.made > 0) sceneSay('Пока тебя не было, магазин наторговал: продано ' + offRes.made + ' · +' + offRes.earned + ' 🪙');
save();
window.__shop = { S:S, stockUp:stockUp, toggleShelf:toggleShelf, setMode:setMode, upgradeShop:upgradeShop, claimTask:claimTask, claimDaily:claimDaily, advanceSales:advanceSales, trySale:trySale, sellPriceOf:sellPriceOf, offlineSales:offlineSales };
</script>
</body>
</html>
