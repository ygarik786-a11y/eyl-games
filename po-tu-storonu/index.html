function pickCreature(){
 var boost={fog:['fog','invis'],storm:['ancient','doppel'],snow:['ice'],rain:['zombie','spider'],clear:[]};
 var pool=[];
 CREATURES.forEach(function(c){
  var w=[10,6,3,1.2][c.rar];
  if(S.phase===3)w*= (c.rar>=2?1.8:1.1);
  if(S.phase===1&&c.rar>=3)w*=0.4;
  if((boost[S.weather]||[]).indexOf(c.id)>=0)w*=2.2;
  if(S.lv<3&&c.rar>=3)w*=0.3;
  for(var i=0;i<Math.round(w*10);i++)pool.push(c);
 });
 return pick(pool);
}

  S.fainted++;var lost=Math.floor(S.coins*0.1);S.coins-=lost;S.health=50;S.energy=Math.max(20,S.energy-20);S.hunt=null;

function doAttack(kind){
 var h=S.hunt;if(!h)return;
 var A=ATK[kind];if(!A)return;
 if(A.need&&S.gear[A.need]<1){toast('🔒 Сначала купи книгу заклинаний в 🎒 Снаряжении!');return}
 if(A.stock){if((S.stock[A.stock]||0)<1){toast('Нет расходника! Купи в 🎒 Снаряжении');return}S.stock[A.stock]--}
 var base=A.dmg();var weak=h.weak===kind;
 var dmg=Math.max(3,Math.round(base*(weak?2.2:1)*(0.75+Math.random()*0.5)));
 h.hp-=dmg;h.calm=(kind==='candle');addXP(2);
 log(A.e+' '+A.n+': −'+dmg+' энергии существу'+(weak?' 💥 СЛАБОСТЬ!':''));
 if(h.hp<=0){h.hp=0;log('🌟 '+h.n+' обессилен! Теперь лови в контейнер!')}
 else if(chance(h.calm?0.18:0.35))ghostHit();

}
function doTrap(){

function doCatch(){
 var h=S.hunt;if(!h)return;
 if((S.stock.box||0)<1){toast('🧪 Нет контейнеров! Купи в 🎒 Снаряжении');return}
 var pct=h.hp/h.maxHp*100;
 var ch=h.boss?(pct<=0?100:pct<=25?50:10):(pct<=0?100:pct<=35?65:20);
 if(h.trap)ch+=25;
 S.stock.box--;
 if(chance(Math.min(100,ch)/100)){
  var c=creatureById(h.cid),b=h.boss?bossById(h.boss):null;
  var coins=b?b.coins:(10+h.rar*10+rnd(0,10));
  var ecto=b?b.ecto:[5,10,20,40][h.rar];
  S.coins+=coins;S.totalEarn+=coins;S.ecto+=ecto;
  S.caught[h.cid]=(S.caught[h.cid]||0)+1;S.totalCaught++;qAdd('catch',1);
  if(S.phase===3)S.nightCatch=true;
  if(b){S.bossesDone[b.id]=true;S.finds.artifact++;log('🏺 Босс оставил древний артефакт! +1🏺')}
  addXP(b?100:30);
  log('🎉 ПОЙМАНО: '+h.e+' '+h.n+'! +'+coins+'💰 +'+ecto+'👻');
  toast('🎉 Поймано: '+h.n+'!');
  S.hunt=null;
 }else{
  log('💨 '+h.n+' вырвался из контейнера!');
  toast('💨 Вырвался!');
  if(!h.trap&&chance(0.5)){log('🌫️ '+h.n+' исчез во тьме...');S.hunt=null}

 }
 save();render();
}

}
function gearScreen(){
 var h='<div class="card"><h2>🎒 Снаряжение охотника</h2><p class="muted">Монеты 💰 — на всё. Эктоплазма 👻 копится с поимок — это твой трофейный счёт.</p></div>';
 GEARSHOP.forEach(function(g){
  if(g.kind==='gear'){
   var lv=S.gear[g.id]||0,maxed=lv>=g.max;
   h+='<div class="item"><span class="e">'+g.e+'</span><span class="n">'+g.n+'<small>'+g.d+' '+lv+'/'+g.max+'</small></span>'+(maxed?'<span class="cnt">МАКС</span>':'<button class="btn small gold" data-buy="'+g.id+'">Улучшить '+g.price[lv]+'💰</button>')+'</div>';
  }else{
   h+='<div class="item"><span class="e">'+g.e+'</span><span class="n">'+g.n+'<small>'+g.d+' • У тебя: '+(S.stock[g.id]||0)+'</small></span><button class="btn small gold" data-buy="'+g.id+'">Купить '+g.price+'💰</button></div>';
  }
 });
 h+='<div class="card"><h2>🧰 Твои запасы</h2><p><span class="badge">🪤 Ловушки ×'+(S.stock.trap||0)+'</span><span class="badge">🧪 Контейнеры ×'+(S.stock.box||0)+'</span><span class="badge">🕯️ Свечи ×'+(S.stock.candle||0)+'</span><span class="badge">🧂 Соль ×'+(S.stock.salt||0)+'</span></p><p class="muted">Не хватает монет? Лови существ, закрывай дела и выполняй задания дня на базе!</p></div>';
 return h;
}
function rateScreen(){
 var h='<div class="card"><h2>🏆 Рейтинг охотника</h2><p>Звание: <b>'+rank()+'</b><br>Уровень: '+S.lv+' • Опыт: '+S.xp+'/'+(S.lv*100)+'⭐</p><div class="bar"><i style="width:'+Math.min(100,Math.round(S.xp/(S.lv*100)*100))+'%"></i></div>';
 h+='<p><span class="badge">👻 Поймано всего: '+S.totalCaught+'</span><span class="badge">📖 Видов встречено: '+Object.keys(S.seen).length+'/14</span><span class="badge">👹 Боссов: '+Object.keys(S.bossesDone).length+'/7</span><span class="badge">📂 Дел закрыто: '+Object.keys(S.casesDone).length+'/5</span></p></div>';
 h+='<div class="card"><h2>🏅 Достижения</h2>';
 ACH.forEach(function(a){
  var got=!!S.ach[a.id],can=!got&&a.check();
  h+='<div class="item"><span class="e">'+a.e+'</span><span class="n">'+a.n+'<small>'+a.d+' • Награда: '+a.r+'💰</small></span>'+(got?'<span class="cnt">✅</span>':can?'<button class="btn small gold" data-ach="'+a.id+'">Забрать</button>':'<span class="muted">🔒</span>')+'</div>';
 });
 h+='</div>';
 return h;
}
var TABS=[['base','🏠 База'],['hunt','🔍 Охота'],['cases','📂 Дела'],['book','📖 Энциклопедия'],['gear','🎒 Снаряжение'],['rate','🏆 Рейтинг']];
function render(){
 $('#dayline').textContent='📅 День '+S.day+' • '+PHASES[S.phase].e+' '+PHASES[S.phase].n+' • '+WEATHERS[S.weather].e+' '+WEATHERS[S.weather].n;
 $('#stats').innerHTML='<span class="pill">💰 '+S.coins+'</span><span class="pill">👻 '+S.ecto+'</span><span class="pill">⭐ '+S.lv+' ур.</span><span class="pill">❤️ '+Math.max(0,S.health)+'</span><span class="pill">⚡ '+S.energy+'/100</span><span class="pill">🧪 '+(S.stock.box||0)+'</span>';
 $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(TAB===t[0]?' on':'')+'" data-goto="'+t[0]+'">'+t[1]+'</button>'}).join('');
 var h='';
 if(TAB==='base')h=baseScreen();
 else if(TAB==='hunt')h=huntScreen();
 else if(TAB==='cases')h=casesScreen();
 else if(TAB==='book')h=bookScreen();
 else if(TAB==='gear')h=gearScreen();
 else h=rateScreen();
 $('#app').innerHTML=h;
 $('#log').innerHTML=S.log.map(function(l){return '<div>'+l+'</div>'}).join('');
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-goto],[data-scan],[data-boss],[data-ident],[data-atk],[data-trap],[data-catch],[data-release],[data-flee],[data-sleep],[data-radio],[data-gift],[data-qclaim],[data-sell],[data-case],[data-loc],[data-culprit],[data-casequit],[data-buy],[data-ach]');
 if(!t)return;
 if(t.dataset.goto){TAB=t.dataset.goto;save();render();return}
 if(t.dataset.scan){doScan();return}
 if(t.dataset.boss){doBoss(t.dataset.boss);return}
 if(t.dataset.ident){doIdentify();return}
 if(t.dataset.atk){doAttack(t.dataset.atk);return}
 if(t.dataset.trap){doTrap();return}
 if(t.dataset.catch){doCatch();return}
 if(t.dataset.release){doRelease();return}
 if(t.dataset.flee){doFlee();return}
 if(t.dataset.sleep){
  S.day++;S.phase=0;newWeather();S.energy=100;S.health=Math.min(100,S.health+50);
  log('😴 Ты проспал до утра. День '+S.day+', погода: '+WEATHERS[S.weather].e+' '+WEATHERS[S.weather].n+'. Энергия и силы восстановлены!');
  toast('🌅 Доброе утро, охотник! День '+S.day);
  save();render();return;
 }
 if(t.dataset.radio){
  if(S.energy<2){toast('⚡ Нужно 2 энергии!');return}
  S.energy-=2;
  if(chance(0.65))rollEvent();else log('📻 В эфире только шум и редкие помехи... Сегодня тихо.');
  save();render();return;
 }
 if(t.dataset.gift){
  var td=todayStr();if(S.giftDay===td)return;
  var y=new Date(Date.now()-864e5);var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak=(S.lastGift===ys)?(S.streak||0)+1:1;S.lastGift=td;S.giftDay=td;
  var g=30+S.streak*5;S.coins+=g;S.totalEarn+=g;
  var extra='';if(chance(0.35)){S.stock.box++;extra=' +1🧪 контейнер!'}
  log('🎁 Подарок за вход: +'+g+'💰'+extra+' Серия: '+S.streak+' дн.');
  toast('🎁 +'+g+'💰'+extra);
  save();render();return;
 }
 if(t.dataset.qclaim){
  var q=null;DQUESTS.forEach(function(x){if(x.id===t.dataset.qclaim)q=x});
  if(q&&!S.qdone[q.id]&&(S.qprog[q.id]||0)>=q.n2){S.qdone[q.id]=true;S.coins+=q.r;S.totalEarn+=q.r;log('📋 Задание дня выполнено: '+q.n+' +'+q.r+'💰');toast('📋 +'+q.r+'💰')}
  save();render();return;
 }
 if(t.dataset.sell){
  var kind=t.dataset.sell,price=kind==='photo'?15:20,n=S.finds[kind]||0;
  if(n>0){S.finds[kind]=0;S.coins+=n*price;S.totalEarn+=n*price;log('💰 Продано находок: '+n+' × '+price+'💰');toast('💰 +'+(n*price))}
  save();render();return;
 }
 if(t.dataset.case){
  if(S.caseId){toast('📂 У тебя уже есть активное дело!');return}
  S.caseId=t.dataset.case;S.caseClues=0;CASEMSG='';
  log('🕵️ Начато расследование: '+t.dataset.case);
  save();render();return;
 }
 if(t.dataset.loc){
  var cs=null;CASES.forEach(function(x){if(x.id===S.caseId)cs=x});if(!cs)return;
  if(t.dataset.loc===cs.locs[S.caseClues]){
   var foundClue=cs.clues[S.caseClues];S.caseClues++;qAdd('clue',1);addXP(10);
   CASEMSG='✅ Улика найдена! Смотри выше в списке улик.';
   log('🔍 Улика '+S.caseClues+'/3 найдена в месте: '+t.dataset.loc);
   if(S.caseClues>=3)log('🕵️ Все улики собраны! Пора назвать виновника.');
  }else{
   S.energy=Math.max(0,S.energy-2);
   CASEMSG=pick(['🌫️ Здесь тихо и пусто. Только пыль и эхо. −2⚡','🚪 Ничего подозрительного. Следы ведут не сюда. −2⚡','🕸️ Паутина, старые вещи — но улик нет. −2⚡']);
   log('🚶 Осмотр места '+t.dataset.loc+' — улик нет. −2⚡');
  }
  advance(1);save();render();return;
 }
 if(t.dataset.culprit){
  var cs2=null;CASES.forEach(function(x){if(x.id===S.caseId)cs2=x});if(!cs2)return;
  var right=parseInt(t.dataset.culprit,10)===cs2.right;
  var coins=right?cs2.coins:Math.floor(cs2.coins/2),ecto=right?cs2.ecto:Math.floor(cs2.ecto/2);
  S.coins+=coins;S.totalEarn+=coins;S.ecto+=ecto;S.casesDone[cs2.id]=true;S.caseId=null;S.caseClues=0;CASEMSG='';
  addXP(right?50:20);
  log(right?'🎉 ДЕЛО ЗАКРЫТО! Вывод верный: +'+coins+'💰 +'+ecto+'👻':'📂 Дело закрыто, но вывод был неверным. Половина награды: +'+coins+'💰 +'+ecto+'👻');
  toast(right?'🎉 Дело закрыто!':'📂 Дело закрыто (вывод неверный)');
  TAB='cases';save();render();return;
 }
 if(t.dataset.casequit){S.caseId=null;S.caseClues=0;CASEMSG='';save();render();return}
 if(t.dataset.buy){
  var g=null;GEARSHOP.forEach(function(x){if(x.id===t.dataset.buy)g=x});if(!g)return;
  if(g.kind==='gear'){
   var lv=S.gear[g.id]||0;
   if(lv>=g.max){toast('Уже максимум!');return}
   var cost=g.price[lv];
   if(S.coins<cost){toast('💰 Не хватает монет! Нужно '+cost+'💰');return}
   S.coins-=cost;S.gear[g.id]=lv+1;log('🎒 Улучшено: '+g.e+' '+g.n+' — уровень '+(lv+1));toast('🎒 '+g.n+': уровень '+(lv+1));
  }else{
   if(S.coins<g.price){toast('💰 Не хватает монет! Нужно '+g.price+'💰');return}
   S.coins-=g.price;S.stock[g.id]=(S.stock[g.id]||0)+1;log('🎒 Куплено: '+g.e+' '+g.n);toast('🎒 +1 '+g.n);
  }
  save();render();return;
 }
 if(t.dataset.ach){
  var a=null;ACH.forEach(function(x){if(x.id===t.dataset.ach)a=x});
  if(a&&!S.ach[a.id]&&a.check()){S.ach[a.id]=true;S.coins+=a.r;S.totalEarn+=a.r;log('🏅 Достижение «'+a.n+'»: +'+a.r+'💰');toast('🏅 '+a.n+' +'+a.r+'💰')}
  save();render();return;
 }
});
if(!S.log.length)log('👁️ Добро пожаловать по ту сторону тьмы, охотник! Начни с 📟 сканирования на вкладке 🔍 Охота.');
save();render();
</script>
</body>
</html>
