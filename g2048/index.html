<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧩 2048 E.Y.L — E.Y.L Games</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior:none}
  body{background:#0d0f1a;color:#eef;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:14px 10px 26px}
  .wrap{max-width:480px;margin:0 auto}
  .back{display:inline-block;color:#ffa751;text-decoration:none;font-size:15px;margin-bottom:6px}
  .back:active{opacity:.7}
  h1{font-size:27px;letter-spacing:.5px;text-align:center}
  h1 span{background:linear-gradient(90deg,#ffa751,#ffe259);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:#9aa0c3;font-size:13.5px;text-align:center;margin:3px 0 12px}
  .topbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .cell{background:#171a2e;border:1px solid #262a47;border-radius:10px;padding:7px 13px;font-size:14.5px;font-weight:600}
  .cell b{color:#ffe259;font-size:16.5px}
  .btnrow{display:flex;gap:8px;margin-bottom:12px}
  .btnrow button{flex:1;background:#1b1e33;border:1px solid #2c3050;color:#eef;border-radius:12px;padding:11px 8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btnrow button:active{transform:scale(.97);background:#232642}
  .btnrow button:disabled{opacity:.38;cursor:default;transform:none}
  /* Поле 4×4: целиком в экран телефона */
  .boardwrap{display:flex;justify-content:center}
  .board{position:relative;width:min(92vw,440px);aspect-ratio:1/1;background:#14172a;border:2px solid #262a47;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:none;overflow:hidden}
  .grid-bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:2.6%;padding:2.6%}
  .grid-bg i{background:#1d2038;border-radius:9px}
  .tiles{position:absolute;inset:0}
  .tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:9px;font-weight:800;color:#2b2118;transition:left .13s ease-in-out,top .13s ease-in-out;z-index:2}
  .tile span{line-height:1;pointer-events:none}
  .tile.new{animation:pop .18s ease-out}
  .tile.merged{animation:bump .18s ease-out;z-index:3}
  @keyframes pop{0%{transform:scale(.3);opacity:.4}100%{transform:scale(1);opacity:1}}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
  /* Цвета плиток: от светлой к золотой */
  .v2{background:#e8e3d8}.v4{background:#f0dfba}.v8{background:#f6b56b;color:#4a2b00}
  .v16{background:#f6914d;color:#fff}.v32{background:#f4704f;color:#fff}.v64{background:#ef4b3a;color:#fff}
  .v128{background:#f2cf6b;color:#5a3c00;box-shadow:0 0 12px rgba(242,207,107,.45)}
  .v256{background:#efc53f;color:#5a3c00;box-shadow:0 0 14px rgba(239,197,63,.55)}
  .v512{background:#eab308;color:#fff;box-shadow:0 0 16px rgba(234,179,8,.6)}
  .v1024{background:#f5a623;color:#fff;box-shadow:0 0 20px rgba(245,166,35,.7)}
  .v2048{background:linear-gradient(135deg,#ffe259,#ffa751);color:#5a2d00;box-shadow:0 0 30px rgba(255,210,80,.95),0 0 60px rgba(255,167,81,.5)}
  .vsuper{background:linear-gradient(135deg,#ff5f9e,#a855f7);color:#fff;box-shadow:0 0 26px rgba(200,90,255,.75)}
  .hint{color:#7c81a3;font-size:13px;margin-top:12px;text-align:center;line-height:1.55}
  /* Финальные экраны — на весь экран телефона */
  .overlay{position:fixed;inset:0;background:rgba(8,9,18,.94);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:36px 18px 40px;gap:16px;z-index:50;overflow-y:auto}
  .hidden{display:none!important}
  .overlay h2{font-size:31px}
  .overlay h2 span{background:linear-gradient(90deg,#ffa751,#ffe259);-webkit-background-clip:text;background-clip:text;color:transparent}
  .final{font-size:17.5px;line-height:1.65;color:#dfe3ff}
  .final b{color:#ffe259}
  .bigbtn{background:linear-gradient(90deg,#ffa751,#ffe259);color:#231600;border:0;border-radius:14px;padding:15px 40px;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(255,167,81,.35);font-family:inherit;min-width:min(84vw,300px)}
  .bigbtn:active{transform:scale(.97)}
  .ghostbtn{background:#1b1e33;border:1px solid #2c3050;color:#eef;border-radius:14px;padding:13px 30px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;min-width:min(84vw,300px)}
  .ghostbtn:active{transform:scale(.97)}
  .crown{font-size:62px;animation:floaty 2.6s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← Все игры</a>
  <h1>🧩 2048 <span>E.Y.L</span></h1>
  <div class="sub">Сдвигай плитки и сливай одинаковые: 2+2=4, 4+4=8… Собери золотую 2048 с короной! 👑</div>

  <div class="topbar">
    <div class="cell">🏆 Очки: <b id="score">0</b></div>
    <div class="cell">⭐ Рекорд: <b id="best">0</b></div>
    <div class="cell">💎 Лучшая: <b id="maxTile">2</b></div>
  </div>
  <div class="btnrow">
    <button id="undoBtn" disabled>↩ Отмена хода</button>
    <button id="newBtn">🔄 Новая игра</button>
  </div>

  <div class="boardwrap">
    <div class="board" id="board">
      <div class="grid-bg" id="gridBg"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>

  <div class="hint">📱 На телефоне: веди палец по полю — вверх, вниз, влево или вправо.<br>⌨️ На компьютере: стрелки или клавиши W A S D.</div>
</div>

<!-- Победа: собрана плитка 2048 -->
<div class="overlay hidden" id="winOv">
  <div class="crown">👑</div>
  <h2>👑 ТЫ СОБРАЛ <span>2048!</span></h2>
  <div class="final" id="winText"></div>
  <button class="bigbtn" id="keepBtn">▶ ИГРАТЬ ДАЛЬШЕ — к 4096!</button>
  <button class="ghostbtn" id="winNewBtn">🔄 Начать заново</button>
</div>

<!-- Конец игры -->
<div class="overlay hidden" id="overOv">
  <h2>🏁 ХОДОВ <span>БОЛЬШЕ НЕТ</span></h2>
  <div class="final" id="finalText"></div>
  <button class="bigbtn" id="againBtn">🔄 ЕЩЁ РАЗ</button>
  <button class="ghostbtn" id="overUndoBtn">↩ Отменить последний ход</button>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const boardEl = $("board"), tilesEl = $("tiles");
const SIZE = 4, GAP = 2.6; // gap в % от ширины поля (как в CSS .grid-bg)
const BEST_KEY = "eyl-2048-best";

/* ---------- состояние ---------- */
let grid = [];        // 4x4 числа (0 = пусто)
let score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch(e) { best = 0; }
let prevState = null; // {grid, score} — один шаг назад
let wonShown = false; // экран победы за эту игру уже показывали
let over = false;
let tileEls = new Map(); // id -> элемент плитки (для анимации сдвига)
let nextId = 1;

/* ---------- звук: тихие бипы, тон растёт со значением плитки ---------- */
let AC = null;
function beep(freq, dur, vol, type){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (dur || 0.09));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || 0.09));
  } catch(e) {}
}
function mergeSound(maxMerged){
  // высота тона — по логарифму значения: 4 -> низко, 2048 -> высоко
  const steps = Math.max(1, Math.round(Math.log2(maxMerged)) - 1);
  const freq = 220 * Math.pow(1.122, steps); // полутон за удвоение
  beep(freq, 0.1, 0.06);
  setTimeout(() => beep(freq * 1.5, 0.12, 0.045), 55);
}
const slideSound = () => beep(160, 0.05, 0.022, "triangle");
const winSound = () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.16,0.06), i*110)); };
const overSound = () => { [392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,0.16,0.05), i*130)); };

/* ---------- геометрия ---------- */
// позиция и размер плитки в %: 4 клетки, gap GAP, padding GAP
function cellPct(){ return (100 - GAP * (SIZE + 1)) / SIZE; }
function posPct(i){ return GAP + i * (cellPct() + GAP); }
function fontPx(v){
  const s = String(v).length;
  const cellPx = boardEl.clientWidth * cellPct() / 100;
  const f = s <= 2 ? 0.44 : s === 3 ? 0.36 : s === 4 ? 0.28 : 0.23;
  return Math.max(12, Math.round(cellPx * f)) + "px";
}

/* ---------- логика поля ---------- */
function emptyCells(){
  const out = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!grid[r][c]) out.push([r, c]);
  return out;
}
function addRandom(){
  const e = emptyCells();
  if (!e.length) return null;
  const [r, c] = e[Math.floor(Math.random() * e.length)];
  const v = Math.random() < 0.9 ? 2 : 4;
  grid[r][c] = { v: v, id: nextId++ };
  return grid[r][c];
}
function snapshot(){
  return {
    grid: grid.map(row => row.map(t => t ? { v: t.v, id: t.id } : 0)),
    score: score, nextId: nextId, wonShown: wonShown
  };
}
function restore(s){
  grid = s.grid.map(row => row.map(t => t ? { v: t.v, id: t.id } : 0));
  score = s.score; nextId = s.nextId; wonShown = s.wonShown;
  over = false;
}
function maxTileVal(){
  let m = 0;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c]) m = Math.max(m, grid[r][c].v);
  return m;
}
function canMove(){
  if (emptyCells().length) return true;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++){
    const v = grid[r][c].v;
    if (c + 1 < SIZE && grid[r][c + 1].v === v) return true;
    if (r + 1 < SIZE && grid[r + 1][c].v === v) return true;
  }
  return false;
}

/* один ряд/столбец влево: возвращает {line, gained, maxMerged, moved} */
function slideLine(line){
  const arr = line.filter(t => t);
  const out = [];
  let gained = 0, maxMerged = 0;
  for (let i = 0; i < arr.length; i++){
    if (i + 1 < arr.length && arr[i].v === arr[i + 1].v){
      const nv = arr[i].v * 2;
      out.push({ v: nv, id: arr[i].id, merged: true });
      gained += nv;
      if (nv > maxMerged) maxMerged = nv;
      i++;
    } else {
      out.push({ v: arr[i].v, id: arr[i].id });
    }
  }
  while (out.length < SIZE) out.push(0);
  const moved = out.some((t, i) => (t ? t.id : 0) !== (line[i] ? line[i].id : 0) || (t ? t.v : 0) !== (line[i] ? line[i].v : 0));
  return { line: out, gained: gained, maxMerged: maxMerged, moved: moved };
}

function move(dr, dc){
  if (over) return;
  // линии в направлении хода
  const lines = [];
  for (let i = 0; i < SIZE; i++){
    const line = [];
    for (let j = 0; j < SIZE; j++){
      let r, c;
      if (dc === -1){ r = i; c = j; }            // влево
      else if (dc === 1){ r = i; c = SIZE - 1 - j; } // вправо
      else if (dr === -1){ r = j; c = i; }       // вверх
      else { r = SIZE - 1 - j; c = i; }          // вниз
      line.push(grid[r][c]);
    }
    lines.push(line);
  }
  let anyMoved = false, gained = 0, maxMerged = 0;
  const results = lines.map(line => {
    const res = slideLine(line);
    if (res.moved) anyMoved = true;
    gained += res.gained;
    if (res.maxMerged > maxMerged) maxMerged = res.maxMerged;
    return res.line;
  });
  if (!anyMoved) return;

  prevState = snapshot(); // для отмены хода
  results.forEach((line, i) => {
    line.forEach((t, j) => {
      let r, c;
      if (dc === -1){ r = i; c = j; }
      else if (dc === 1){ r = i; c = SIZE - 1 - j; }
      else if (dr === -1){ r = j; c = i; }
      else { r = SIZE - 1 - j; c = i; }
      grid[r][c] = t;
    });
  });
  score += gained;
  const born = addRandom();
  render(born);
  if (gained > 0) mergeSound(maxMerged); else slideSound();
  updateHud();

  if (!wonShown && maxTileVal() >= 2048){
    wonShown = true;
    winSound();
    $("winText").innerHTML = "Очки: <b>" + score + "</b><br>Золотая плитка с короной — твоя! 👑<br>Но это не предел: дальше — 4096!";
    setTimeout(() => $("winOv").classList.remove("hidden"), 350);
    return;
  }
  if (!canMove()){
    over = true;
    overSound();
    const m = maxTileVal();
    $("finalText").innerHTML = "Очки: <b>" + score + "</b><br>Лучшая плитка: <b>" + m + "</b><br>Рекорд: <b>" + Math.max(best, score) + "</b>" +
      (score >= best && score > 0 ? "<br>🎉 Новый рекорд!" : "");
    $("overUndoBtn").style.display = prevState ? "" : "none";
    setTimeout(() => $("overOv").classList.remove("hidden"), 350);
  }
  saveBest();
}

function saveBest(){
  if (score > best){
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch(e) {}
  }
}

/* ---------- отрисовка (с анимацией сдвига) ---------- */
function tileClass(v){
  if (v <= 2048) return "v" + v;
  return "vsuper";
}
function setPos(el, r, c){
  el.style.left = posPct(c) + "%";
  el.style.top = posPct(r) + "%";
}
function paintTile(el, t){
  el.className = "tile " + tileClass(t.v) + (t.merged ? " merged" : "");
  el.firstChild.textContent = t.v === 2048 ? "👑" + t.v : String(t.v);
  el.firstChild.style.fontSize = fontPx(t.v);
  el.style.width = cellPct() + "%";
  el.style.height = cellPct() + "%";
}
function render(born){
  const seen = new Set();
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++){
    const t = grid[r][c];
    if (!t) continue;
    seen.add(t.id);
    let el = tileEls.get(t.id);
    const isNew = born && born.id === t.id;
    if (!el){
      el = document.createElement("div");
      el.appendChild(document.createElement("span"));
      tilesEl.appendChild(el);
      tileEls.set(t.id, el);
      // стартовая позиция — без перехода, чтобы не «прилетала» из угла
      el.style.transition = "none";
      setPos(el, r, c);
      paintTile(el, t);
      if (isNew) el.classList.add("new");
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ""; }));
    } else {
      setPos(el, r, c);
      paintTile(el, t);
    }
    if (t.merged) delete t.merged;
  }
  // убрать элементы исчезнувших (слившихся) плиток
  for (const [id, el] of tileEls){
    if (!seen.has(id)){ el.remove(); tileEls.delete(id); }
  }
}
window.addEventListener("resize", () => render(null));

function updateHud(){
  $("score").textContent = score;
  saveBest();
  $("best").textContent = best;
  $("maxTile").textContent = maxTileVal() || 2;
  $("undoBtn").disabled = !prevState;
}

/* ---------- старт / рестарт / отмена ---------- */
function newGame(){
  grid = Array.from({length: SIZE}, () => [0, 0, 0, 0]);
  score = 0; prevState = null; wonShown = false; over = false;
  tileEls.forEach(el => el.remove()); tileEls.clear();
  addRandom(); addRandom();
  $("winOv").classList.add("hidden");
  $("overOv").classList.add("hidden");
  render(null);
  updateHud();
}
function undo(){
  if (!prevState) return;
  restore(prevState);
  prevState = null;
  // Элементы перестраиваем заново: render() сам создаст недостающие
  tileEls.forEach(el => el.remove()); tileEls.clear();
  render(null);
  $("winOv").classList.add("hidden");
  $("overOv").classList.add("hidden");
  updateHud();
  beep(300, 0.07, 0.04, "triangle");
}

/* ---------- управление ---------- */
const KEYMAP = {
  ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0],
  a: [0, -1], d: [0, 1], w: [-1, 0], s: [1, 0],
  A: [0, -1], D: [0, 1], W: [-1, 0], S: [1, 0]
};
document.addEventListener("keydown", e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  if (!$("winOv").classList.contains("hidden") || !$("overOv").classList.contains("hidden")) return;
  e.preventDefault();
  move(k[0], k[1]);
});

let touchX = null, touchY = null;
boardEl.addEventListener("touchstart", e => {
  const t = e.changedTouches[0];
  touchX = t.clientX; touchY = t.clientY;
}, {passive: true});
boardEl.addEventListener("touchmove", e => { e.preventDefault(); }, {passive: false});
boardEl.addEventListener("touchend", e => {
  if (touchX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX, dy = t.clientY - touchY;
  touchX = touchY = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; // короткий тап — не свайп
  if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
  else move(dy > 0 ? 1 : -1, 0);
}, {passive: true});
// мышь — тоже свайпом по полю (удобно проверять с компьютера)
let mouseX = null, mouseY = null;
boardEl.addEventListener("mousedown", e => { mouseX = e.clientX; mouseY = e.clientY; });
document.addEventListener("mouseup", e => {
  if (mouseX === null) return;
  const dx = e.clientX - mouseX, dy = e.clientY - mouseY;
  mouseX = mouseY = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
  else move(dy > 0 ? 1 : -1, 0);
});

/* ---------- кнопки ---------- */
$("undoBtn").onclick = undo;
$("newBtn").onclick = newGame;
$("againBtn").onclick = newGame;
$("winNewBtn").onclick = newGame;
$("overUndoBtn").onclick = undo;
$("keepBtn").onclick = () => { $("winOv").classList.add("hidden"); beep(660, 0.09, 0.05); };

/* ---------- фоновая сетка и старт ---------- */
for (let i = 0; i < SIZE * SIZE; i++) $("gridBg").appendChild(document.createElement("i"));
newGame();
})();
</script>
<!-- Значки-картинки (Twemoji): на компе Erik часть смайлов не рисуется шрифтом Windows и видна как □. Подменяем их картинками — одинаково на телефоне и на компе. -->
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>img.emoji{height:1em;width:1em;margin:0 .05em 0 .1em;vertical-align:-.1em}</style>
<script>
(function(){
  function parseAll(){ if(window.twemoji){ try{ twemoji.parse(document.body); }catch(e){} } }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',parseAll); } else { parseAll(); }
  if(window.MutationObserver){
    var mo=new MutationObserver(function(muts){
      if(!window.twemoji) return;
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.nodeType===1 && (!n.classList || !n.classList.contains('emoji'))){ try{ twemoji.parse(n); }catch(e){} }
        });
      });
    });
    mo.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
</body>
</html>
