<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🪙 Орёл или решка — E.Y.L Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(180deg,#141432,#1d2b53);color:#fff;font-family:Verdana,sans-serif;min-height:100vh;text-align:center;padding:14px 10px 24px}
a.back{color:#aef;font-size:14px;text-decoration:none}
h1{font-size:27px;color:#ffd23f;text-shadow:2px 2px 0 #b8860b;margin:10px 0 4px}
.sub{color:#c9c9da;font-size:14px;margin-bottom:6px}
.pick{display:flex;gap:10px;justify-content:center;margin:10px 0 2px}
.pick button{background:#2a2a55;color:#cfd8ff;border:2px solid #4a4a8a;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:bold;cursor:pointer}
.pick button.on{background:#ffd23f;color:#1a1a2e;border-color:#ffd23f;box-shadow:0 4px 0 #b8860b}
#coinWrap{height:190px;display:flex;align-items:center;justify-content:center;perspective:800px}
#coin{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd23f 55%,#e0a800);border:5px solid #b8860b;display:flex;align-items:center;justify-content:center;font-size:76px;box-shadow:0 14px 30px rgba(0,0,0,.5);transform-style:preserve-3d}
#coin.fly{animation:fly 1.15s ease-out}
@keyframes fly{0%{transform:translateY(0) rotateX(0)}30%{transform:translateY(-70px) rotateX(720deg)}60%{transform:translateY(-30px) rotateX(1260deg)}100%{transform:translateY(0) rotateX(1800deg)}}
#msg{font-size:19px;min-height:28px;margin:6px 0 4px;color:#ffd23f;font-weight:bold}
.stats{font-size:16px;margin:8px 0}.stats b{color:#ffd23f}
button.big{background:#ffd23f;color:#1a1a2e;border:0;border-radius:12px;padding:14px 30px;font-size:19px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #b8860b;margin-top:8px}
button.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b}
button.big:disabled{opacity:.5}
.histTitle{color:#9ab;font-size:13px;margin-top:18px}
#hist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;min-height:38px}
#hist span{width:38px;height:38px;border-radius:50%;background:rgba(255,210,63,.15);border:2px solid rgba(255,210,63,.5);display:flex;align-items:center;justify-content:center;font-size:20px}
#hist span:first-child{border-color:#ffd23f;background:rgba(255,210,63,.35);animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.linkish{background:none;border:0;color:#89a;font-size:13px;margin-top:16px;cursor:pointer;text-decoration:underline}
.hint{color:#89a;font-size:12px;margin-top:10px}
</style></head><body>
<a class="back" href="../">← E.Y.L Games</a>
<h1>🪙 ОРЁЛ ИЛИ РЕШКА</h1>
<div class="sub">Выбери свою сторону — и подбрасывай!</div>
<div class="pick">
<button id="pickH" class="on" onclick="setPick('H')">🦅 Орёл</button>
<button id="pickT" onclick="setPick('T')">👑 Решка</button>
</div>
<div id="coinWrap"><div id="coin">🪙</div></div>
<div id="msg">Твой выбор: 🦅 Орёл. Жги кнопку!</div>
<button class="big" id="flipBtn" onclick="flip()">🪙 Подбросить</button>
<div class="stats">Победы: <b id="w">0</b> • Поражения: <b id="l">0</b> • Бросков: <b id="n">0</b></div>
<div class="stats" style="font-size:14px">🔥 Серия побед: <b id="streak">0</b> • Лучшая серия: <b id="bstreak">0</b></div>
<div class="histTitle">История последних бросков:</div>
<div id="hist"></div>
<button class="linkish" onclick="resetStats()">сбросить счёт</button>
<div class="hint">Угадал сторону — победа! Монета честная: 50 на 50 🎲</div>
<script>
var pick='H',flipping=false;
var st=JSON.parse(localStorage.getItem('eyl_coinflip')||'{"w":0,"l":0,"n":0,"streak":0,"best":0,"hist":[]}');
function name(s){return s==='H'?'🦅 Орёл':'👑 Решка';}
function save(){localStorage.setItem('eyl_coinflip',JSON.stringify(st));}
function render(){
  document.getElementById('w').textContent=st.w;
  document.getElementById('l').textContent=st.l;
  document.getElementById('n').textContent=st.n;
  document.getElementById('streak').textContent=st.streak;
  document.getElementById('bstreak').textContent=st.best;
  var h=document.getElementById('hist');h.innerHTML='';
  st.hist.forEach(function(s){var sp=document.createElement('span');sp.textContent=(s==='H'?'🦅':'👑');h.appendChild(sp);});
}
function setPick(s){
  if(flipping)return;
  pick=s;
  document.getElementById('pickH').classList.toggle('on',s==='H');
  document.getElementById('pickT').classList.toggle('on',s==='T');
  document.getElementById('msg').textContent='Твой выбор: '+name(s)+'. Жги кнопку!';
}
function flip(){
  if(flipping)return;
  flipping=true;
  var btn=document.getElementById('flipBtn');btn.disabled=true;
  var coin=document.getElementById('coin');
  document.getElementById('msg').textContent='Монета в воздухе… 🌀';
  coin.classList.remove('fly');void coin.offsetWidth;coin.classList.add('fly');
  var result=Math.random()<0.5?'H':'T';
  // во время полёта монета крутится и показывает стороны по очереди
  var faces=['🦅','👑'],fi=0;
  coin.textContent='🪙';
  var iv=setInterval(function(){coin.textContent=faces[fi%2];fi++;},130);
  setTimeout(function(){
    clearInterval(iv);
    coin.textContent=(result==='H'?'🦅':'👑');
    st.n++;
    if(result===pick){
      st.w++;st.streak++;if(st.streak>st.best)st.best=st.streak;
      document.getElementById('msg').textContent='🎉 '+name(result)+'! Ты угадал!';
    }else{
      st.l++;st.streak=0;
      document.getElementById('msg').textContent='😄 '+name(result)+'! Мимо — ещё раз?';
    }
    st.hist.unshift(result);if(st.hist.length>14)st.hist.length=14;
    save();render();
    btn.disabled=false;btn.textContent='🪙 Подбросить ещё';
    flipping=false;
  },1150);
}
function resetStats(){
  st={w:0,l:0,n:0,streak:0,best:0,hist:[]};save();render();
  document.getElementById('coin').textContent='🪙';
  document.getElementById('msg').textContent='Счёт сброшен. Твой выбор: '+name(pick)+'. Жги кнопку!';
  document.getElementById('flipBtn').textContent='🪙 Подбросить';
}
render();
</script><!-- Значки-картинки (Twemoji): на компе Erik часть смайлов не рисуется шрифтом Windows и видна как □. Подменяем их картинками — одинаково на телефоне и на компе. -->
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>img.emoji{height:1em;width:1em;margin:0 .05em 0 .1em;vertical-align:-.1em}</style>
<script>
(function(){
  function parseAll(){ if(window.twemoji){ try{ twemoji.parse(document.body); }catch(e){} } }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',parseAll); } else { parseAll(); }
  if(window.MutationObserver){
    var mo=new MutationObserver(function(muts){
      if(!window.twemoji) return;
      muts.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.nodeType===1 && (!n.classList || !n.classList.contains('emoji'))){ try{ twemoji.parse(n); }catch(e){} }
        });
      });
    });
    mo.observe(document.body,{childList:true,subtree:true});
  }
})();
</script>
</body></html>
